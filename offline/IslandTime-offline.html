  if(c.next==null){callSchedule(c,S.t);return}
  if(S.t<c.next||c.ring||CALL_NOW)return;
  const m=tod();if(m<540||m>1230){c.next=(day()+(m<540?0:1))*1440+540+Math.floor(Math.random()*600);return}   // too early or late: later
  const ids=Object.keys(S.friends).filter(id=>phoneFriendAvail(id)==='ok');
  callSchedule(c,S.t);

  const id=pick(ids);c.ring={id,t:S.t,until:S.t+30};
  phoneNotify('📞',`${callWho(id,1)} ${/^the /i.test(callWho(id,1))?'are':'is'} calling`,'Open your 📱 phone to answer');

const AMB_LV={off:0,low:0.22,med:0.5},AMB_TXT={off:'Off',low:'Low',med:'Medium'},AMB_NEXT={off:'low',low:'med',med:'off'};

  for(let i=0;i<n;i++){const w=ambRnd()*2-1;last=(last+0.02*w)/1.02;d[i]=w*0.6+last*3}   // white + a little brown

// one day of forecast. rel = days from today: 0–1 = full detail, 2+ = lower confidence
function wxDay(d){const s=seasonId(),X=seaX(),rel=d-day(),sure=rel<=1,w=[];
  let hi,lo,rain,ic,sum;
  if(s==='winter'){hi=wxN(d,'hi',36,44);lo=wxN(d,'lo',28,34);rain=10*wxN(d,'rain',3,8)}
  else if(s==='summer'){hi=wxN(d,'hi',71,82);lo=wxN(d,'lo',52,58);rain=10*wxN(d,'rain',0,1)}
  else if(s==='spring'){hi=wxN(d,'hi',53,63);lo=wxN(d,'lo',38,45);rain=10*wxN(d,'rain',3,8)}
  else{hi=wxN(d,'hi',45,53);lo=wxN(d,'lo',36,43);rain=10*wxN(d,'rain',4,9)}
  ic=rain>=70?'🌧️':rain>=40?'🌦️':s==='summer'?'☀️':'⛅';sum=rain>=70?'Rain':rain>=40?(s==='spring'?'Showers and sun breaks':'Showers'):s==='summer'?'Sunny':s==='spring'?'Sun breaks':'Cloudy';
  const g=wxStorm(d);
  if(g){rain=100;ic='🌬️';sum=sure?'Gale':'Windy, maybe a gale';
    w.push(sure?(g.first?`🌬️ <b>Gale warning</b> from about ${fmt(g.start)}: gusts to 55 mph. Expect the ferry to stop and the power to go out.`:`🌬️ <b>Gale continues</b> until about ${fmtAbs(g.end)}.`)
      :'🌬️ A big Pacific system may arrive around here. Low confidence: check back.')}
  if(s==='winter'){
    if(X.snow===d){ic='❄️';sum=sure?'Snow':'Snow possible';hi=Math.min(hi,34);w.push(sure?'❄️ <b>Snow</b> overnight, ice underneath. Slick roads all day, a slow ferry ramp.':'❄️ Snow possible. Low confidence.')}
    else if(sure&&X.ice&&X.ice[d])w.push(`🧊 <b>Ice on the ferry ramp</b> before 10 AM: early boats ~${X.ice[d]} min late. Icy roads until late morning.`);
    if(X.cold&&X.cold[d]){lo=wxN(d,'cold',19,24);if(sure)w.push(`🥶 <b>Hard freeze tonight</b>, low ${lo}°. Drip the faucets if the heat might go out.`)}
    if(X.tide&&X.tide.day===d)w.push(`🌊 <b>King tide</b> peaking around ${fmt(X.tide.start+75)}: the Oro Bay road floods and ferry loading slows.`);
  }
  if(s==='summer'){
    if(X.smoke===d){hi=wxN(d,'hot',86,92);rain=0;ic=sure?'🔥':'🌫️';sum=sure?'Smoke & heat':'Haze possible';
      w.push(sure?`🔥 <b>Wildfire smoke and heat</b>, ${hi}°: air quality unhealthy. Outdoor work can wait.`:'🌫️ Smoke possible, depending on the wind east of the mountains.')}

  if(s==='spring'){
    if((X.pollen||[]).includes(d))w.push(sure?'🌼 <b>Pollen count very high</b>: alder, fir and grass. Allergy pills at the Lakewood pharmacy.':'🌼 Pollen likely to spike. Low confidence.');
    if(X.mud&&sure&&rain>=40)w.push('🟫 Mud season: soft gravel roads after the rain. Allow a few extra minutes.');
  }
  if(sure&&S.week.fog[d])w.push(`🌫️ <b>Fog</b> in the morning: boats before 11 AM ~${S.week.fog[d]} min late.`);
  return {d,rel,sure,hi,lo,rain,ic,sum,w}}
// tides: two highs and two lows a day, about 50 minutes later each day; anchored to the king tide when there is one
function wxTides(d){const X=seaX(),T=X.tide,out=[],P=745;
  const anchor=T?T.start+75:Math.floor(wxR(-1,'tide')*P);
  const n0=Math.floor((d*1440-anchor)/P)-1;
  for(let n=n0;n<n0+5;n++){const hiT=anchor+n*P,loT=hiT+372;
    for(const [t,isHi] of [[hiT,true],[loT,false]]){if(t<d*1440||t>=(d+1)*1440)continue;
      const king=isHi&&!!T&&t>=T.start&&t<T.end;
      const ft=king?15.6:isHi?(n%2?8.6:11.4)+wxR(d,'h'+n)*1.4:(n%2?4.2:-0.8)+wxR(d,'l'+n)*1.6;
      out.push({t,hi:isHi,king,ft:Math.round(ft*10)/10})}}
  return out.sort((a,b)=>a.t-b.t)}
const wxTideTxt=d=>wxTides(d).map(x=>`<span class="wx-tide${x.king?' wx-king':''}">${x.king?'🌊 KING ':''}${x.hi?'High':'Low'} ${fmt(x.t)} ${x.ft.toFixed(1)} ft</span>`).join('');
// warnings worth a buzz the evening before (and tonight’s freeze)
function wxTomorrowWarn(){const d=day();const out=[];
  if(d<6){const X=seaX(),st=S.week.storm;
    if(st&&st.day===d+1)out.push(['🌬️','Gale tomorrow',`From about ${fmt(st.start)}. Fuel the generator, fill the water jugs, charge everything.`]);
    if(seasonId()==='winter'){
      if(X.snow===d+1)out.push(['❄️','Snow tomorrow','Ice under it. Leave early or don’t leave.']);
      else if(X.ice&&X.ice[d+1])out.push(['🧊','Ice on the ramp tomorrow',`Early boats ~${X.ice[d+1]} min late.`]);
      if(X.tide&&X.tide.day===d+1)out.push(['🌊','King tide tomorrow',`Around ${fmt(X.tide.start+75)}. The Oro Bay road floods.`]);}
    if(seasonId()==='summer'&&X.smoke===d+1)out.push(['🔥','Smoke tomorrow','Unhealthy air. Plan indoor things.']);
    if(seasonId()==='spring'&&(X.pollen||[]).includes(d+1))out.push(['🌼','High pollen tomorrow','Grab allergy pills if you’re on the mainland.']);
  }
  const X=seaX();if(seasonId()==='winter'&&X.cold&&X.cold[d])out.push(['🥶','Hard freeze tonight','Drip the faucets if the heat might go out.']);

const MKT_PACKS=[{n:3,c:54},{n:5,c:88}],MKT_FEE=5,MKT_READY=120,MKT_OPEN=420,MKT_LAST=1140,MKT_CLOSE=1320;

const mktReady=()=>{const o=mktOrder();return !!o&&S.t>=o.at};

function mktPlace(n){const P=MKT_PACKS.find(p=>p.n===n);if(!P||!phoneCan()||MKT().order||!mktWindow())return false;const cost=P.c+MKT_FEE;if(!canEssential(cost))return false;

  MKT().order={n,cost,at:S.t+MKT_READY,close:day()*1440+MKT_CLOSE,spoiled:false};
  say(`🛒 Ordered ${n} days of groceries from Mainland Market: ${$(cost)} with the pickup fee. Ready around ${fmt(S.t+MKT_READY)} at the grocery pickup counter by the Steilacoom ferry landing. ${S.money<0?'It went on the card.':''}`.trim());
  apmMsg('market',`🛒 Order placed: ${n} days of food. Ready ${fmt(S.t+MKT_READY)} at the grocery pickup counter in Steilacoom. Pick up by ${fmt(MKT_CLOSE)} or the cold stuff spoils.`);

// 🩺 Telehealth: video visits with a doctor. Needs real signal: the mainland (4 bars) or the Riv's Wi-Fi.
// On the island's one bar the video freezes on your own face. One visit a day: 20 min, $25 copay, battery.
//   - 💊 renew the prescription: mail-order (+$15 for the meds), lands in your mailbox at 1 PM the next day.
//     Saves the pharmacy trip, not the copay. Wednesday to Saturday only (the refill is due Thursday).
//   - 😮‍💨 stress advice (stress −8) · 🤒 run-down advice (health +3)
//   - 🤕 the ankle: no visit, no charge, just “go to Urgent Care”. It doesn't replace the Thursday checkup either.
// State: PH().tele = {visit: dayKey of today's visit, mail: dayKey the refill arrives (-1 = none), msg: {h,t}}
const TELE_COPAY=20, TELE_RX=10,   // balance pass: was $25 + $15
      TELE_MIN=20, TELE_BAT=8, TELE_MAIL=780;   // mail comes at 1 PM
const TELE=()=>{const P=PH();P.tele=P.tele||{visit:-1,mail:-1};return P.tele};
const teleWifi=()=>S.loc==='food';                                          // the Riv: the Wi-Fi password is taped to the register
const teleOK=()=>phoneSignal()>=4||teleWifi();
const teleMsg=(h,k)=>{TELE().msg={h,k,t:S.t}};
function teleRxWhy(){const d=day(),T=TELE();
  if(S.rx)return 'Already have this week’s refill.';
  if(T.mail>=0)return 'Already in the mail.';
  if(d<2)return 'Too early: the refill isn’t due until Thursday.';
  if(d>5)return 'Too late for this week.';
  return ''}
function teleCall(){   // try to connect; false on one bar
  if(teleOK())return true;
  S.t+=5;phoneUse(2);
  teleMsg('📶 Connecting… Connecting… the video freezes on your own face. One bar won’t carry a doctor. Try the mainland, or the Riv’s Wi-Fi.','warn');
  say('📶 You try a video visit on one bar. The picture freezes on your own face, mid-blink. Call dropped.');
  afterAction();return false}
function teleVisit(kind){
  const T=TELE(),dk=dayKey();
  const cost=TELE_COPAY+(kind==='rx'?TELE_RX:0);
  if(T.visit===dk||!phoneCan()||S.phone<TELE_BAT+2||(kind==='rx'&&teleRxWhy())||!canEssential(cost))return false;
  if(!teleCall())return false;
  T.visit=dk;money(-cost);phoneUse(TELE_BAT);S.t+=TELE_MIN;
  const where=teleWifi()?'from a corner booth at the Riv':'from your car';
  if(kind==='rx'){T.mail=dk+1;
    say(`🩺 A video visit ${where}. The doctor renews your prescription in ninety seconds and spends the rest asking if you’re “getting outside.” It’s going out by mail: in your box tomorrow afternoon. $${cost} with the meds.`);
    teleMsg(`💊 <b>Prescription renewed.</b> It’s in the mail: your box, tomorrow around ${fmt(TELE_MAIL)}. No pharmacy run.`,'ok')}
  else if(kind==='stress'){adj('stress',-8);
    say(`🩺 A video visit ${where}. You describe your commute. The doctor goes quiet, then teaches you a breathing exercise “for the ferry line.” It sort of works. Stress −8.`);
    teleMsg('😮‍💨 <b>Breathe in for four, out for six.</b> Stress −8.','ok')}
  else{adj('health',3);
    say(`🩺 A video visit ${where}. Fluids, sleep, “maybe a vegetable.” You were hoping for something more dramatic. Health +3.`);
    teleMsg('🤒 <b>Fluids, sleep, a vegetable.</b> Health +3.','ok')}
  afterAction();return true}
function teleAnkle(){
  if(!phoneCan()||!S.injury||S.injury.treated)return false;
  if(!teleCall())return false;
  S.t+=5;phoneUse(1);
  teleMsg('🤕 The nurse takes one look at your ankle on camera. “That’s an Urgent Care thing. DuPont, 8 to 8. Don’t walk on it.” No charge for being told.','warn');
  say('🤕 Telehealth can’t wrap an ankle through a phone. “Urgent Care in DuPont,” the nurse says. No charge.');
  afterAction();return true}
// the refill lands in your mailbox (no phone needed: it's the mail)
function teleMailCheck(){const P=S&&S.ph,T=P&&P.tele;if(!T||!(T.mail>=0))return;
  const dk=dayKey();if(dk<T.mail||(dk===T.mail&&tod()<TELE_MAIL))return;
  T.mail=-1;if(S.rx)return;S.rx=true;
  say('📬 Your prescription came in the mail. A padded envelope, slightly damp. One less ferry.');
  phoneNotify('📬','Prescription in the mailbox','Mail-order refill from Telehealth')}
phoneOnTime(teleMailCheck);
// a new week (month mode) starts clean
if(typeof weekRollover==='function'){const _wr=weekRollover;weekRollover=function(){const P=S&&S.ph;if(P&&P.tele)P.tele.mail=-1;return _wr.apply(this,arguments)}}
// the To-do item knows the refill is in the mail
if(typeof todoItems==='function'){const _ti=todoItems;todoItems=function(){const it=_ti.apply(this,arguments),T=S&&S.ph&&S.ph.tele;
  if(T&&T.mail>=0&&!S.rx){const x=it.find(i=>/prescription/.test(i.l||''));if(x){x.s=`In the mail from Telehealth: your box, ${T.mail>dayKey()?'tomorrow':'today'} around ${fmt(TELE_MAIL)}.`;x.urgent=false}}

function tutState(){S.tips=S.tips||{seen:[]};S.tips.seen=S.tips.seen||[];return S.tips}
function tutNext(){
  if(!tipsOn()||!S||S.over) return null;
  const T=tutState();
  if(T.at===S.t) return null;   // just dismissed one: the next waits for the clock to move
  return TIPS.find(x=>!T.seen.includes(x.id)&&!TUT_FOLDED.includes(x.id)&&(()=>{try{return !!x.when()}catch(e){return false}})())||null;
}
tipView=function(){
  const t=tutNext();if(!t) return '';
  const txt=typeof t.t==='function'?(()=>{try{return t.t()}catch(e){return ''}})():t.t;if(!txt) return '';
  const g=t.g>=0?TUT_DAYS[t.g]:'Heads up';
  return `<div class="tip" role="note" aria-label="Guided week tip"><div class="tut-k">📘 Guided week · ${g}</div>${txt}<div class="tb"><button onclick="tipSeen('${t.id}')">Got it</button><button onclick="setPref('tips',false);render()">Turn off tips</button></div></div>`;

  say('🇺🇸 Folding chairs, a coffee urn and a hundred islanders in the Legion hall. Somebody’s grandkid runs the slideshow: freezers, the pump inspection, a delivery schedule that works around the ferry. People clap for the produce supplier.');

function siPie(){const C=SI().coop;C.pie=true;money(-10);S.coop.town+=300;S.t+=90;phoneTick();adj('stress',-6);

function siPledge(){const tot=siFund(),C=SI().coop,goal=STORY_COOP_GOAL,opts=[25,100,250].filter(v=>S.money>=v);

// story: never opens mid-chapter; during the last push, reaching the goal schedules a Sunday reopening;

// the store's actions: the story pledge (toward $6,000), and the member discount once it opens
{const _ca=coopActions;coopActions=function(a){const n0=a.length;_ca.apply(this,arguments);if(!siOn())return;try{

function siCoopActions(a){const ch=siCh(),C=SI().coop,m=tod(),k=siKey(),loc=S.loc;

}

// ======================= wiring =======================
{const _actions=actions;actions=function(){const a=_actions();if(!siOn())return a;try{siStormActions(a);siCoopActions(a)}catch(e){console.error(e)}return a}}
{const _todo=todoItems;todoItems=function(){const it=_todo();if(!siOn())return it;try{const ch=siCh(),C=SI().coop,d=day(),k=siKey();
  if(siStormWeek()){const st=S.week.storm,x=it.find(i=>i.l==='Be ready for the storm');
    if(x&&st.day>d)x.s=`The storm of the decade, ${DAYS[st.day]} night: gusts over 70 mph, days without power and no ferry. You need a generator at home and 3 gal in the shed (${S.homeGas} now), or the fridge dies. Firewood, water jugs and a charged power bank help too.`;
    if(siStormNow())it.push({ok:(SI().storm.helped||0)>0,fail:false,l:'Optional: help your neighbors through the storm',s:`You’ve helped ${SI().storm.helped||0} time${SI().storm.helped===1?'':'s'}. The Hendersons, a warming spot, the road crew, a neighbor who ran out.`,urgent:false});}
  if(ch===0&&S.weekNo===SI_PIE.wk&&d<=SI_PIE.d)it.push({ok:!!C.pie,fail:d===SI_PIE.d&&tod()>=SI_PIE.to&&!C.pie,l:'Optional: the co-op pie social',s:'Saturday 2–5 PM at the American Legion Hall. $10 a plate, raises $300 for the co-op.',urgent:false});
  if(ch===1&&!C.member)it.push({ok:false,fail:false,l:'Optional: join the co-op ($25)',s:'At the old store or the Legion. Members get 5% off when it opens.',urgent:false});

  if(ch===3&&C.decided==='short'&&!C.reached&&!C.failed)it.push({ok:false,fail:false,l:`Co-op last push: ${$(Math.max(0,STORY_COOP_GOAL-siFund()))} short`,s:'Pledge at the old store. The deadline is Saturday of the last week.',urgent:k>=SI_DEADLINE-1});
  if(ch===3&&C.openKey!=null&&(C.decided==='go'||C.reached)&&k<=C.openKey)it.push({ok:!!C.ribbon,fail:false,l:'The co-op’s grand reopening',s:`${DAYS[C.openKey%7]} ${C.openKey===k?'(today) ':''}10 AM–noon at the store.${repVal()>=60?' They want you to cut the ribbon.':''}`,urgent:k===C.openKey&&!C.ribbon});
}catch(e){console.error(e)}return it}}
// mornings: forecasts, reminders and the reopening
{const _sd=startDay;startDay=function(){const r=_sd.apply(this,arguments);if(!siOn())return r;try{const ch=siCh(),d=day(),C=SI().coop;
  if(ch===2&&S.weekNo===1&&S.week&&!S.week.siStorm){siStormBuild(S.week)}
  if(ch===2&&S.weekNo===0&&d===6&&typeof phoneInstalled==='function'&&phoneInstalled('weather')){say('📱 🌦️ <b>Tides & Weather</b>: the long-range models are lining up something big for <b>Wednesday night</b>. A deep low, a tight pressure gradient. Worth watching.');showTile('🌦️','A big storm on the models','Wednesday night','warn')}
  if(siStormWeek()){
    if(d===0){say('📻 <b>Heads-up:</b> the forecasters are calling Wednesday night’s storm “the storm of the decade”: gusts over 70 mph, the ferry likely to stop, and power out for days. Get gas for the generator, firewood, water and batteries now.');showTile('🌬️','The storm of the decade','Wednesday night: 70+ mph gusts','warn')}
    else if(d===1)say('📻 High wind warning confirmed for Wednesday night. The Island Group is all generator questions and photos of the bread aisle in Lakewood.');
    else if(d===2)say('🌬️ The storm hits tonight: <b>gusts over 70 mph</b>. The ferry stops at 6 PM and won’t run again until Thursday night. Expect the power to go out around 8 PM and stay out for days.');
    else if(d===3){say(`🌲 Thursday. The island is dark and quiet except for chainsaws. ${S.week.siStorm.tree?'A big fir is down across the road by the lake. ':''}No ferry until 10 PM, no power, and no store to walk to. Somebody tapes a note under the co-op flyer: “THIS IS WHY.”`)}
    else if(d===5&&S.t<SI_PWR.end)say('🔌 Puget Sound Energy says crews will have the island back on by about noon.');
  }
  if(ch===0&&S.weekNo===SI_PIE.wk&&(d===0||d===SI_PIE.d)&&!C.pie)say(`🥧 ${d===0?'Saturday':'Today'}: the co-op pie social at the American Legion Hall, 2–5 PM. $10 a plate. Every dollar goes to reopening the store.`);
  if(ch===1&&S.weekNo===0&&d===0)say('🪪 The co-op’s fall membership drive is on: $25 to join, 5% off at the store once it opens. Sign up at the old store or the Legion.');
  if(ch===3){
    if(S.weekNo===0&&(d===0||d===SI_MEET.d)&&!C.decided)say(`🏪 ${d===0?'Thursday':'Tonight'} at 7 PM: the co-op members’ meeting at the American Legion Hall. The fund is at ${$(siFund())} of ${$(STORY_COOP_GOAL)}.`);

  }
}catch(e){console.error(e)}return r}}
// game time passing: the storm's power, the lights coming back, the meeting's result
phoneOnTime(function siTimed(){if(!siOn()||!S||S.over)return;const I=SI();
  if(siStormWeek()){
    if(S.t>=SI_PWR.start&&S.t<SI_PWR.end&&!(S.power&&S.power.si)){siPowerOn();if(!I.storm.out){I.storm.out=true;if(L[S.loc].side==='I')say('⚡ 8 PM: a blue flash over the trees, a bang, and the whole island goes dark. The wind is screaming in the firs.');try{showTile('⚡','The power is out','The whole island, for days','bad')}catch(e){}}}

// ======================= the story framework hook =======================
const STORY_ISLAND_HOOK={id:'island',
  chapterStart(ch,notes){if(!siOn())return;const I=SI(),n=notes||[];
    if(ch===0)n.push(`🏪 The co-op’s big goal: <b>${$(STORY_COOP_GOAL)}</b> by spring to reopen the old General Store, with groceries and gas pumps. Neighbors chip in every night; pledge at the old store.`);
    if(ch===1)n.push('🪪 The co-op’s fall membership drive is on: $25 to join, 5% off once the store opens.');
    if(ch===3)n.push(`🏪 Spring: the co-op members meet Thursday night at the Legion to decide on the reopening. The fund is at ${$(siFund())} of ${$(STORY_COOP_GOAL)}.`);
    if(!notes)n.forEach(s=>say(s))},
  chapterEnd(ch,notes){if(!siOn())return;const I=SI(),n=notes||[];
    if(ch===2&&!I.storm.lights){S.story.flags.storm={helped:I.storm.helped||0};if(I.storm.out)siLightsBack(n)}
    if(ch<3)n.push(`🏪 Co-op fund: ${$(siFund())} of ${$(STORY_COOP_GOAL)}.`);
    if(ch===3&&S.story.flags.coopOpen==null)S.story.flags.coopOpen=!!S.coop.open},
  ending(flags){flags=flags||{};const out=[];
    if(flags.storm){const h=flags.storm.helped||0;
      out.push(h>=3?`🌬️ In the storm of the decade, you were the neighbor people still talk about: ${h} times you showed up for someone.`:h>=1?'🌬️ When the storm of the decade knocked the island dark, you showed up for a neighbor or two.':'🌬️ You rode out the storm of the decade behind your own front door.')}
    if(flags.coopOpen===true)out.push(`🏪 The co-op reopened the old General Store${flags.coopRibbon?', and you cut the ribbon':''}.${flags.coopMember?' Your member card gets you 5% off.':''} Groceries and gas are back on the island.`);
    else if(flags.coopOpen===false)out.push(`🏪 The co-op came up short this year and the store stays closed.${flags.coopMember?' You’re still a member, and':' But'} the fund carries on, and so does the island.`);
    return out}};
window.STORY_ISLAND_HOOK=STORY_ISLAND_HOOK;
if(typeof storyHooks!=='undefined')storyHooks.push(STORY_ISLAND_HOOK);
