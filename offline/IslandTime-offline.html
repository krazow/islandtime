<style>
:root{
  --sound:#1d4b5a; --deep:#12313b; --fir:#2f5d4a; --moss:#6f8f5a; --sand:#f3ecdc; --paper:#fbf8f1;
  --buoy:#e3642e; --ink:#1b2326; --mute:#6b7478; --line:#ddd4c0; --good:#2f7d4f; --bad:#b8402a; --warn:#c98a12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--deep);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px;font-weight:700;font-size:16px}
.hint{font-size:13px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;line-height:1.45}
/* title */
.title{flex:1;display:flex;flex-direction:column;background:linear-gradient(#1d4b5a,#12313b);color:#fff}
.title .art{height:250px}
.title .body{padding:18px 22px 28px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:40px;line-height:1;letter-spacing:-.5px}
.title h1 span{display:block;font-size:17px;font-family:"DM Sans";font-weight:500;letter-spacing:.3px;opacity:.85;margin-top:8px}
.title p{margin:0;line-height:1.5;opacity:.92;font-size:15px}
.title ul{margin:0;padding-left:18px;line-height:1.55;font-size:14.5px;opacity:.92}
.big{background:var(--buoy);color:#fff;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 #a9441b}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a9441b}
.small-note{font-size:12px;opacity:.7}
/* hud */
.hud{background:var(--deep);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:5}
.hud-top{display:flex;justify-content:space-between;align-items:baseline}
.hud-day{font-family:"Fraunces";font-size:20px;font-weight:800}
.hud-time{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-sub{font-size:12px;opacity:.75;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.stat{background:rgba(255,255,255,.08);border-radius:9px;padding:5px 4px 6px;text-align:center}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%}
/* scene */
.scene{position:relative;height:170px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:12px;bottom:10px;background:rgba(251,248,241,.94);border-radius:10px;padding:6px 10px;max-width:80%}
.place h2{font-size:18px}
.place div{font-size:12px;color:var(--mute)}
.alertbar{background:var(--bad);color:#fff;font-size:13px;padding:8px 14px;font-weight:500}
.alertbar.fog{background:#6c7a80}
/* content */
.content{flex:1;padding:12px 14px 90px}
.narr{background:var(--sand);border-left:4px solid var(--fir);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.narr p{margin:0 0 6px}.narr p:last-child{margin:0}
.sect{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink)}
.act:active{background:var(--sand)}
.act .ic{font-size:22px;width:30px;text-align:center;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;font-size:15px}
.act .tx span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.act.primary{border-color:var(--fir);background:#eef4ee}
.act.danger{border-color:#e2b3a7}
.act[disabled]{opacity:.45}
.dest{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dest .dn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dest .dn b{font-size:15px}.dest .dn span{font-size:11.5px;color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--fir);color:var(--fir);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip:active{background:#e3eee5}
.chip[disabled]{border-color:var(--line);color:#aaa}
/* tabs */

const DI={home:{aiDock:12,store:7,lake:6},aiDock:{store:6,lake:11},store:{lake:5},dale:{home:9,aiDock:14,store:8,lake:10,food:8},food:{home:7,aiDock:11,store:6,lake:2}};
const MP={wholesale:[7.5,3.5],motel:[4,2.5],gas:[1.5,1.5],stDock:[0,0],work:[6,3],market:[5,4],pharmacy:[6,5.5],warehouse:[12,6],clinic:[14,8],urgent:[-4,-6]};
function dist(a,b){

  const p=MP[a],q=MP[b];return Math.round(Math.hypot(p[0]-q[0],p[1]-q[1])*2.6+4);
}
const FLAVOR_MORNING=[

  'The island is very quiet. You can hear the boat horn from across the water.',

];

// ---------------- state ----------------

function genWeek(){
  const b=[];const r=Math.random;
  if(r()<0.9){const day=1+Math.floor(r()*4);const start=day*1440+Math.floor((7+r()*11)*60);

// ---------------- ferry engine ----------------
function sailing(side,d,dep,mode,knownOnly){
  const abs=d*1440+dep;
  if(d===0&&FUEL_CANCEL[side].includes(dep)) return {abs,dep,d,cancel:true,reason:'Monday fuel run (hazmat: crew & tanker driver only)',known:true};

  const n=S.week.news[d];if(n>=0){const e=NEWS[n];if(!e.task&&e.side===side&&e.g===g)m*=e.m}

function waitFerry(mode){
  const side=L[S.loc].side;
  if(mode==='walk'&&!canWalkCarry()){modal('Too much to carry',`<p>On foot you can carry 4 days of groceries and ${CAP_FOOT} items in total. You’ve got ${S.carried} days of groceries and ${cargoN()} trade items.</p><p>Drive on, or lighten the load.</p>`,[{l:'OK',fn:()=>{}}]);return}
  const known=findNext(side,mode,true), actual=findNext(side,mode,false);
  if(!known){say('No sailings in sight. Something is very wrong with the ferry system.');return render()}
  if(known.d>day()){
    if(side==='M'){say(`The last boat has gone. The next one you could make is ${DAYS[known.d]} at ${fmt(known.dep)}.`);adj('stress',8);}
    else say(`No more sailings you can make tonight. Next: ${DAYS[known.d]} ${fmt(known.dep)}. Might as well go home.`);
    return render();
  }
  if(!actual||actual.abs!==known.abs){
    // surprise breakdown during the wait
    const b=S.week.b.filter(b=>b.start>S.t&&b.start<=known.abs).sort((x,y)=>x.start-y.start)[0];
    const at=b?b.start:known.abs-25;
    S.stats.waited+=at-S.t;S.t=at;adj('stress',12);
    buzz([90,50,90,50,90]);
    showTile('🚨','Rider alert: sailings suspended',b?b.cause[0].toUpperCase()+b.cause.slice(1):'Mechanical issue','bad');
    say(`🚨 RIDER ALERT (${fmt(S.t)}): Sailings suspended due to ${b?b.cause:'a mechanical issue'}. No estimate for restoration.`);
    say('The people in line groan in unison. Someone starts calling their boss.');
    return modal('🚨 Rider Alert',`<p>Service is suspended: <b>${b?b.cause:'a mechanical issue'}</b>.</p><p>The county hasn’t said when it’ll be back. Check the Ferry board, look for the sailboat water taxi, or change your plans.</p>`,[{l:'Ugh. OK.',fn:()=>{}}]);
  }
  const s=known;
  const wait=s.abs-S.t;S.stats.waited+=wait;
  adj('stress',Math.min(10,wait/12));
  S.t=s.abs+(s.delay||0);
  if(s.delay) say(`Fog on the water. The boat is ${s.delay} minutes late.`);
  if(mode==='drive'&&!S.priority&&Math.random()<fullProb(side,s.d,s.dep)){
    showTile('🚗','Boat’s full','You’re first in line for the next one','bad');buzz(120);S.stats.bumps++;adj('stress',12);
    say(`The deckhand waves the car ahead of you on and then raises the hand. Boat’s full. You’re first in line for the next one.`);
    const nxt=(()=>{const save=S.t;S.t=s.abs-19;const n=findNext(side,'drive',true);S.t=save;return n})();
    return modal('Boat’s full 😩',`<p>The ${fmt(s.dep)} sailing filled up right in front of you.</p><p>Next drive-on: <b>${nxt?fmtAbs(nxt.abs):'unknown'}</b> (you’ll be first in line).</p>`,[
      {l:'Wait for the next boat',s:'Keep your car with you',fn:()=>{S.priority=true;S.t=s.abs-21>S.t?S.t:S.t;S.t=Math.max(S.t,s.abs+1);waitFerryFrom(side)}},
      ...(canWalkCarry()?[{l:'Park it and walk on this boat',s:`Car stays at this landing. ${side==='M'?'Walk-on fare '+$(FARE_WALK):'Free from the island'}`,fn:()=>board(side,s,'walk')}]:[])
    ]);
  }
  board(side,s,mode);
}
function waitFerryFrom(side){ // after a bump, find next from current time ignoring the 20-min rule for first-in-line
  S.t-=20; const n=findNext(side,'drive',false); S.t+=20;
  if(!n||n.d>day()){say('No more drive-on sailings tonight.');S.priority=false;return render()}
  S.stats.waited+=n.abs-S.t; adj('stress',6); S.t=n.abs+(n.delay||0); S.priority=false; board(side,n,'drive');
}
function arrest(where,missed){

function board(side,s,mode){
  if(contraband(mode)){

        say(`🚫 A deckhand spots your gas can${g>1?'s':''}. You have to dispose of ${g*5} gallons and you get a citation for unlawful transit conduct. You miss the ${fmt(s.dep)}.`);

        return modal('Busted at the ferry',`<p>Gasoline is allowed aboard only in a vehicle’s own tank. Spare cans, <b>full or empty</b>, are prohibited.</p><p>Your ${g>1?g+' cans are':'can is'} confiscated, you get a citation, and the boat leaves without you. The citation will cost you about $150.</p><p><b>Repeat violations can get you banned from riding the ferry.</b> Next time, that’s the game.</p>`,[{l:'Lesson learned. Probably.',fn:()=>{}}]);

  if(side==='M'){const f=mode==='drive'?FARE_CAR:FARE_WALK;money(-f);S.stats.fares+=f;}
  const car=carHere();
  const dur=20+(s.ketron?10:0);

    afterAction();
  });
}
function waterTaxi(){
  if(!canWalkCarry()) return modal('Too much to carry',`<p>The sailboat has room for you and maybe ${CAP_FOOT} bags or cans. Not your whole haul.</p>`,[{l:'OK',fn:()=>{}}]);

// =====================================================================
// ISLAND EVENTS FRAMEWORK (non-ferry life on the island)
// ---------------------------------------------------------------------
// defEvent({id, hook, chance, cond(ctx), run(ctx), priority, cooldown, max})
//   hook      (a hook name, or an array of them)
//             'arrive'    just arrived somewhere (ctx.at, ctx.from; 'ferry' when stepping off the boat)
//             'night'     while going to bed (ctx.where, ctx.notes[] for the night summary)
//             'wake'      start of a day, if you woke up at home
//             'tripStart' before an island trip leaves (can block it with choices)
//             'tripMid'   during an island trip (ctx.add(min), or block and later ctx.finish(extra))
//   chance    number or fn(ctx) -> 0..1, rolled each time the hook runs
//   cond      fn(ctx) -> bool, must be true for the event to fire (even when chained)
//   priority  higher runs first; an event returning {block:true} or {stop:true} ends the hook
//   cooldown  days before it can fire again; max = times per week
// chain(id)   guarantees an event fires the next time its hook runs (if its cond passes):
//             this is how one event sets off others (a power outage -> the alarm doesn't go off).
// =====================================================================
// ---- acknowledgement tiles: a small card every time an event fires ----
const TILE_META={
  power_outage:['⚡','Power outage','bad'],starry:['✨','Starry night','good'],alarm_fail:['⏰','Your alarm didn’t go off','bad'],
  no_water:['🚿','No water','bad'],garage_stuck:['🚪','Garage door is dead','bad'],neighbor_ride:['🚪','A new neighbor knocks','good'],
  friend_coffee:['☕','Coffee from Sam','good'],bingo_reminder:['🎱','Bingo tonight at the Riv','info'],
  table_taken:['🪧','Someone took your table','bad'],no_seat:['🪑','No seat at bingo','bad'],bar_argument:['🗯️','Argument at the bar','bad'],
  order_late:['⏳','Your order is late','bad'],pajama_fred:['🩴','Pajama Fred','info'],dead_battery:['🔋','Dead car battery','bad'],
  garage_release:['🚪','Manual garage door','bad'],tree_down:['🌲','Tree down on the road','bad'],flat_tire:['🛞','Flat tire','bad'],
  stranded_neighbor:['🚩','Someone needs a jump','info'],deer:['🦌','Deer on the road','info'],eagle:['🦅','Eagle sighting','good'],
};
let tileQ=[];const TILE_MAX=3;
function tileBox(){let el=document.getElementById('tiles');if(!el){el=document.createElement('div');el.id='tiles';el.setAttribute('role','status');el.setAttribute('aria-live','polite');document.body.appendChild(el)}return el}
function showTile(ic,title,sub,kind){
  if(!S||S.over) return;
  const box=tileBox();
  if(box.children.length>=TILE_MAX){tileQ.push([ic,title,sub,kind]);return}
  const t=document.createElement('div');t.className='tile '+(kind||'info');
  t.innerHTML=`<span class="ti">${ic}</span><span class="tt"><small>${kind==='good'?'Good news':kind==='bad'?'Event':kind==='warn'?'Heads up':'Island life'} · ${DAYS[day()].slice(0,3)} ${fmt(S.t)}</small><b>${title}</b>${sub?`<span>${sub}</span>`:''}</span><button class="ok" aria-label="Got it">✓</button>`;
  let gone=false;const close=()=>{if(gone)return;gone=true;t.classList.add('out');setTimeout(()=>{t.remove();if(tileQ.length){const q=tileQ.shift();showTile(...q)}},260)};
  t.querySelector('.ok').onclick=close;t.onclick=e=>{if(e.target===t)close()};
  setTimeout(close,6500);box.appendChild(t);
}
function eventTile(e,ctx){
  const m=TILE_META[e.id]||[e.tile&&e.tile[0]||'📍',e.tile&&e.tile[1]||e.id.replace(/_/g,' '),e.tile&&e.tile[2]||'info'];
  const cause=S.ev.cause&&S.ev.cause[e.id];
  const sub=cause?`Caused by: ${(TILE_META[cause]||[0,cause])[1]}`:(ctx.hook==='bingo'?'At Bingo, the Riv':ctx.hook==='tripStart'||ctx.hook==='tripMid'?`On the way to ${L[ctx.to]?L[ctx.to].name:'…'}`:ctx.hook==='arrive'?`At ${L[ctx.at].name}`:ctx.hook==='night'?'Overnight':ctx.hook==='wake'?'This morning':'');
  showTile(m[0],m[1],sub,m[2]);
}
window.showTile=showTile;
let EV_RUNNING=null;
const EV=[];
function defEvent(e){EV.push(Object.assign({chance:0,priority:0,cooldown:0,max:99},e))}
function chain(id,cause){if(!S.ev.force.includes(id))S.ev.force.push(id);S.ev.cause=S.ev.cause||{};S.ev.cause[id]=cause||EV_RUNNING||null}
window.forceEvent=id=>chain(id);
function fireHook(hook,ctx={}){
  ctx.hook=hook;let res=null;
  const list=EV.filter(e=>e.hook===hook||(Array.isArray(e.hook)&&e.hook.includes(hook))).sort((a,b)=>b.priority-a.priority);
  for(const e of list){
    const forced=S.ev.force.includes(e.id);
    if(e.cond&&!e.cond(ctx)) continue;
    if(!forced){
      if((S.ev.count[e.id]||0)>=e.max) continue;
      if(S.ev.last[e.id]!=null&&day()-S.ev.last[e.id]<e.cooldown) continue;
      const p=typeof e.chance==='function'?e.chance(ctx):e.chance;
      if(!(Math.random()<p)) continue;
    } else S.ev.force=S.ev.force.filter(x=>x!==e.id);
    S.ev.last[e.id]=day();S.ev.count[e.id]=(S.ev.count[e.id]||0)+1;S.ev.history.push({id:e.id,t:S.t});
    EV_RUNNING=e.id;let r;try{r=e.run(ctx)||{}}finally{EV_RUNNING=null}
    eventTile(e,ctx);if(S.ev.cause)delete S.ev.cause[e.id];
    if(r.block||r.stop){res=r;break}
    res=res||r;
  }
  return res;
}

defEvent({id:'pajama_fred',hook:['arrive','bingo'],priority:2,max:3,cooldown:1,

function bingoCard(){const cols=[];for(let c=0;c<5;c++){const pool=[];for(let n=c*15+1;n<=c*15+15;n++)pool.push(n);const col=[];for(let i=0;i<5;i++)col.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);cols.push(col)}cols[2][2]=0;return cols}
function hasLine(card,called){const m=(c,r)=>card[c][r]===0||called.has(card[c][r]);
  for(let i=0;i<5;i++){let row=true,col=true;for(let j=0;j<5;j++){if(!m(j,i))row=false;if(!m(i,j))col=false}if(row||col)return true}
  let a=true,b=true;for(let i=0;i<5;i++){if(!m(i,i))a=false;if(!m(i,4-i))b=false}return a||b}
function bingoGame(mine,others){
  const balls=[...Array(75)].map((_,i)=>i+1);for(let i=74;i>0;i--){const j=Math.floor(Math.random()*(i+1));[balls[i],balls[j]]=[balls[j],balls[i]]}
  const called=new Set();
  for(const b of balls){called.add(b);const w=mine.filter(c=>hasLine(c,called));const t=others.filter(c=>hasLine(c,called)).length;if(w.length||t)return {called,ball:b,winners:w,others:t}}
}
const ballName=n=>'BINGO'[Math.floor((n-1)/15)]+'-'+n;
function cardHTML(card,called){
  let h='<table style="border-collapse:collapse;margin:6px auto 10px;font-variant-numeric:tabular-nums"><tr>'+[...'BINGO'].map(L=>`<th style="width:42px;height:28px;background:var(--sound);color:#fff;font-family:Fraunces">${L}</th>`).join('')+'</tr>';
  for(let r=0;r<5;r++){h+='<tr>';for(let c=0;c<5;c++){const n=card[c][r],hit=n===0||called.has(n);
    h+=`<td style="width:42px;height:38px;text-align:center;border:1px solid var(--line);font-weight:700;${hit?'background:#e3642e;color:#fff;border-radius:50%':''}">${n===0?'★':n}</td>`}h+='</tr>'}
  return h+'</table>';
}
const BINGO_GAMES=[{n:'Regular',pot:40},{n:'Regular',pot:40},{n:'Early Bird Special',pot:50},{n:'The Big One',pot:100}];
function playBingo(cards,price){
  money(-price);S.bingo.nights++;S.bingo.cards+=cards;S.bingo.donated+=Math.round(price*0.5);
  S.t=Math.max(S.t,day()*1440+1080);
  const free=S.friends.walt&&!S.ev.flags.waltCard?1:0;if(free)S.ev.flags.waltCard=1;
  const mine=[...Array(cards+free)].map(bingoCard);const others=[...Array(34)].map(bingoCard);
  const crowd=Math.round(34*12/3+price);
  let gi=0,won=0;
  S.bingo.order=null;S.bingo.delay=0;S.bingo.comped=0;S.bingo.playing=day();
  // the 'bingo' hook: stage 'start' (before game 1) and 'between' (after games 1-3)
  const between=(stage,cont)=>{const r=fireHook('bingo',{stage,game:gi,cont});if(!(r&&r.block))cont()};
  const order=(what,cost)=>{money(-cost);S.bingo.order=what;S.bingo.orderCost=cost;if(what==='both')S.ateOut=day();
    if(what)say(what==='both'?'🍔 You order a burger and a beer from the Riv’s kitchen.':'🍺 You order a drink.');
    between('start',next)};
  const next=()=>{
    if(gi>=BINGO_GAMES.length){
      S.t=day()*1440+1080+150+S.bingo.delay;adj('stress',-14);if(S.friends.sam)adj('stress',-4);
      S.bingo.won+=won;S.bingo.playing=-1;S.ev.history.push({id:'bingo',t:S.t});
      const raised=crowd+Math.round(Math.random()*120);
      say(`🎱 Bingo night ${won?`paid off: you won <b>${$(won)}</b>`:'was a bust, but a fun one'}. The Legion raised about ${$(raised)} for the ${BINGO_FOR[S.week.bingo]}.`);
      return modal('🎱 That’s a wrap',`<p>${won?`You walk out <b>${$(won)}</b> richer.`:'No wins tonight.'} The American Legion announces tonight raised about <b>${$(raised)}</b> for the <b>${BINGO_FOR[S.week.bingo]}</b>.</p><p>${S.friends.walt?'Walt':'Someone'} is already stacking chairs. ${S.friends.sam?'Sam drives you home.':'You know half the room by name now.'}</p>`,[{l:'Head home',fn:()=>{afterAction()}}]);
    }
    const g=BINGO_GAMES[gi++],res=bingoGame(mine,others),n=res.winners.length+res.others;
    let prize=0,msg;
    if(res.winners.length){prize=Math.round(g.pot*res.winners.length/n);won+=prize;money(prize);msg=`<b style="color:var(--good);font-size:20px">BINGO!</b> You win ${$(prize)}${n>1?` (split ${n} ways)`:''}.`;buzz([60,40,60,40,200])}
    else msg=pick(['A woman two tables over yells BINGO. So close.','“BINGO!” from the back. The room groans.','A kid at the Booster Club table wins it. Everyone claps.','You needed one more. Of course you did.']);
    const show=res.winners[0]||mine.slice().sort((a,b)=>[...b.flat()].filter(x=>res.called.has(x)).length-[...a.flat()].filter(x=>res.called.has(x)).length)[0];
    modal(`🎱 Game ${gi} of ${BINGO_GAMES.length}: ${g.n} · ${$(g.pot)} pot`,`<p style="text-align:center;margin:0">Last ball: <b style="font-size:20px">${ballName(res.ball)}</b> · ${res.called.size} called</p>${cardHTML(show,res.called)}<p style="text-align:center">${msg}</p><p style="font-size:12px;color:var(--mute);text-align:center">You have ${mine.length} card${mine.length>1?'s':''}${free?' (one courtesy of Walt)':''}. About ${others.length} other cards in play.</p>`,
      [{l:gi<BINGO_GAMES.length?'Next game':'Finish the night',fn:()=>gi<BINGO_GAMES.length?between('between',next):next()}]);
  };
  const reserved=S.bingo.reserved===day();
  modal('🎱 Bingo at the Riv',`<p>The room is packed: Legion volunteers selling cards, the Booster Club running the 50/50, and a line at the bar.${reserved?' Your reserved table has a little paper RESERVED tent on it.':''}</p><p>Order anything before the first game? Dinner counts as tonight’s food.</p>`,[
    {l:'Dinner and a drink: $24',s:S.ateOut===day()?'You already ate, but sure.':'Counts as tonight’s food.',fn:()=>order('both',24)},
    {l:'Just a drink: $6',fn:()=>order('drink',6)},
    {l:'Nothing, thanks',fn:()=>order(null,0)}]);
}

function travelOpts(dest){
  const base=dist(S.loc,dest), side=L[S.loc].side, car=carHere(), o=[];
  const inj=S.injury&&!S.injury.treated?1.5:1;
  const fueled=car&&car.fuel>=base*FUEL_RATE;
  if(fueled) o.push({m:'car',l:`🚗 ${base} min`,min:base});
  else if(car) o.push({m:'car',l:'🚗 Out of gas',dis:true});
  if(side==='I'){
    if(S.friends.sam&&S.ev.flags.samRide===day()&&S.loc==='home'&&dest==='aiDock') o.unshift({m:'friend',l:`🤝 Ride with Sam ${base} min`,min:base});
    if(!fueled){o.push({m:'walk',l:`🚶 ${Math.round(base*4*inj)} min`,min:Math.round(base*4*inj),dis:!canWalkCarry()});
      o.push({m:'hitch',l:'👍 Hitch a ride',min:base+15,dis:!canWalkCarry()});}
  } else if(!fueled){
    const c=Math.round(8+base*0.8);
    o.push({m:'ride',l:`📱 Rideshare ${base+8}m · $${c}`,min:base+8,cost:c});
    o.push({m:'walk',l:`🚶 ${Math.round(base*5*inj)} min`,min:Math.round(base*5*inj),dis:!canWalkCarry()});
    if(tod()<1260) o.push({m:'bus',l:`🚌 Bus ${Math.round(base*2.5+10)}m · $2.75`,min:Math.round(base*2.5+10),cost:2.75,dis:!canWalkCarry()});
  }
  return o;
}
function go(dest,o){
  const car=carHere(),from=S.loc,island=L[from].side==='I';
  if(island&&!o.started&&!o.midDone){const r=fireHook('tripStart',{from,to:dest,mode:o.m,o,car});if(r&&r.block){render();return}}
  let min=o.min;
  if(o.m==='friend'&&!o.midDone){S.ev.flags.samRide=-1;say('🤝 Sam drives you down to the landing, talking the whole way about their chickens.');adj('stress',-3);}
  if(o.m==='hitch'&&!o.midDone){S.t+=15;if(Math.random()<0.45){adj('stress',4);say('You stand by the road with your thumb out. Two cars pass. Both wave. Neither stops.');return afterAction()}
    say('A neighbor in a pickup with a dog in the back stops. “Hop in.” Island rules.');min=dist(S.loc,dest);adj('stress',-3);}
  if(o.cost) money(-o.cost);
  if((o.m==='car'||o.m==='ride')&&L[S.loc].side==='M'){const m=tod();if(((m>=420&&m<=540)||(m>=960&&m<=1110))&&Math.random()<0.3){min+=15;say('I-5 near JBLM is a parking lot. Of course it is.');adj('stress',4)}}
  if(island&&!o.midDone){let extra=0;
    const r=fireHook('tripMid',{from,to:dest,mode:o.m,o,car:o.m==='car'?car:null,add:n=>{extra+=n},finish:n=>{go(dest,Object.assign({},o,{min:min+extra+(n||0),midDone:true,started:true,cost:0}))}});
    if(r&&r.block){render();return}
    min+=extra;}
  S.t+=min;
  if(car&&o.m==='car'){car.loc=dest;car.fuel=Math.max(0,Math.round((car.fuel-min*FUEL_RATE)*10)/10);if(car.fuel<1.5&&car.fuel>0)say(`⛽ The low-fuel light is on in the ${car.name.split(' (')[0].toLowerCase()}. ${car.fuel} gallons left.`);if(car.fuel===0)say('⛽ The engine coughs and dies as you pull in. Totally empty.');}
  S.loc=dest;
  if(car&&car.id==='beat'&&dest==='stDock'&&Math.random()<0.25){S.t+=10;say('The terminal lot is full. You park way up the hill and hike down.');}
  if(dest==='home'&&S.carried>0){S.pantry+=S.carried;say(`You unload ${S.carried} day${S.carried>1?'s':''} of groceries into the pantry.`);S.carried=0;}
  if(dest==='home') stash();
  if(o.m==='walk') say(`You walk to ${L[dest].name}. It takes ${min} minutes.`);
  fireHook('arrive',{at:dest,from});
  afterAction();
}

// ---------------- day cycle ----------------
function stash(){

}
function processTimed(){
  if(S.power&&S.t>=S.power.end){S.power=null;if(L[S.loc].side==='I')say('💡 The power’s back on. Every appliance in the house beeps at once.')}
  const dl=S.delivery;
  if(dl&&S.t>=dl.due){
    const out=S.week.b.find(b=>dl.due>=b.start&&dl.due<b.end);
    if(out){dl.due=out.end+90;if(!dl.warned){dl.warned=true;say('📦 Your grocery delivery is stuck on the mainland. The ferry’s down.');}}
    else {S.pantry+=dl.n;S.delivery=null;say(`📦 Your island grocery delivery made it to the porch: +${dl.n} days of food.`);}
  }
}
function stormNight(d){const st=S.week.storm;if(!st)return false;const n=d*1440+1380;return n>=st.start&&n<st.end}
function startDay(){
  const d=day();
  if(S.week.storm&&S.week.storm.day===d) say(`🌬️ Gale warning for this afternoon and tonight. Expect the ferry to stop and the island’s power to go out. A generator needs gas…`);
  if(S.week.fog[d]) say(`🌫️ Fog advisory: expect morning sailings to run ${S.week.fog[d]}+ minutes late.`);
  if(d===0) say('⛽ Monday fuel run: with a fuel tanker aboard, federal hazmat rules let only crew and the tanker driver ride. The 9:35 AM from Steilacoom and the 11:30 AM from the island are canceled.');
  if(S.loc==='home'&&!S.injuryRolled&&d>=1&&d<=4&&Math.random()<(d===4?1:0.3)){
    S.injuryRolled=true;
    if(Math.random()<0.7){S.injury={day:d,treated:false};adj('health',-15);
      say('🤕 Hauling firewood in the dark, you slip on wet cedar needles. Your ankle swells up like a grapefruit. There’s no clinic on the island. You need Urgent Care on the mainland.');}
  }
  if(S.week.news[d]>=0) say('📰 '+NEWS[S.week.news[d]].t);
  if(S.loc==='home') fireHook('wake',{});
  S.ev.force=[];
  if(d>0) say(FLAVOR_MORNING[Math.floor(Math.random()*FLAVOR_MORNING.length)]);
}
function endDay(where){
  processTimed();
  const d=day(), notes=[];
  if(where==='home') stash();
  // island events while you sleep (random outages etc.)
  const nctx={where,notes};fireHook('night',nctx);
  // storm power outage
  if(stormNight(d)){
    S.stats.outageNights++;S.power={start:d*1440+1380,end:(d+1)*1440+330+240,cause:'the gale'};if(Math.random()<0.8){EV_RUNNING='storm';outageChain(where);EV_RUNNING=null}
    if(where==='home'&&S.homeGas>=3){S.homeGas-=3;notes.push('⚡ The wind knocks out the island’s power. Your generator burns 3 gallons of gas keeping the fridge and the heat on.')}
    else {if(S.pantry>0){S.pantry--;}adj('health',-6);adj('stress',8);notes.push(where==='home'?'⚡ The power goes out and you have no gas for the generator. The house gets cold and a day of food spoils in the fridge.':'⚡ The island’s power went out while you were away. A day of food spoiled in your dead fridge.')}
  }
  // eat
  if(S.ateOut===d){notes.push('🍔 Dinner was from the Riv. The pantry gets a night off.')}
  else if(where!=='home'&&S.carried>0){S.carried--;notes.push('You eat from your grocery bags.')}
  else if(S.pantry>0){S.pantry--;}
  else {adj('health',-15);adj('stress',10);notes.push('🍽️ You went to bed hungry. The pantry is empty.')}
  if(where!=='home'&&S.carried>0&&!S.cooler){const lost=Math.ceil(S.carried/2);S.carried-=lost;notes.push(`🥛 ${lost} day${lost>1?'s':''} of groceries spoiled overnight. No cooler.`)}
  if(d<5&&!S.worked[d]){adj('job',-15);notes.push('💼 You missed work today. Your boss’s text just says “??”.')}
  if(d===2&&!S.appt&&!S.apptMissed){S.apptMissed=true;adj('health',-15);notes.push('🩺 You missed your doctor’s appointment. Next opening: three weeks out.')}
  if(d>=5&&!S.rx){adj('health',-8);notes.push('💊 You’re out of your prescription. You don’t feel right.')}
  if(S.injury&&!S.injury.treated){adj('health',-8);notes.push('🤕 Your untreated ankle throbs all night.')}
  if(where==='home'){adj('stress',-14);adj('health',3)}
  else if(where==='terminal'){S.stats.stranded++;adj('stress',15);adj('health',-6);notes.push('🪑 You sleep sitting up in the Steilacoom terminal waiting room. The vending machine hums all night.')}
  else {S.stats.stranded++;money(-115);adj('stress',4);notes.push('🏨 $115 for a Lakewood motel room that smells like carpet cleaner.')}
  if(S.stress>=100){adj('job',-8);adj('health',-8);S.stress=65;notes.push('🔥 Burnout. You spend an hour staring at the water instead of sleeping.')}
  notes.forEach(n=>S.log.push({t:S.t,s:n}));
  if(S.health<=0) return gameOver('health');
  if(S.job<=0) return gameOver('fired');
  if(d===6) return finish();
  S.cur=d+1; S.t=(d+1)*1440+330; S.priority=false;
  if(where!=='home') S.loc='stDock';
  uiNarr=[];
  say(`${DAYS[d+1]}, 5:30 AM.`);
  modal(`Good night, ${DAYS[d]}`,`${notes.length?notes.map(n=>'<p>'+n+'</p>').join(''):'<p>A quiet night. The ferry horn sounds once, far off.</p>'}<p>${S.pantry} day${S.pantry===1?'':'s'} of food left in the pantry.</p>`,[{l:`Wake up: ${DAYS[d+1]}`,fn:()=>{}}]);
  startDay();
  render();
}
function afterAction(){
  processTimed();
  const late=day()*1440+23*60+30;
  if(S.t>=late&&S.loc!=='home'){
    if(L[S.loc].side==='I'){S.loc='home';const c=S.cars.find(c=>c.id==='isl');say('It’s late. You make it home somehow.');if(S.carried){S.pantry+=S.carried;S.carried=0}return endDay('home')}
    return strandedModal();
  }
  render();
}

  const lateBy=Math.max(0,m-540);

  a.push({ic:'💼',l:'Work a full shift (until 5:00)',s:`${lateTxt} Pay ${$(pay)}.`,cls:'primary',fn:()=>doShift(1020,pay,0,lateBy?'You slink in late and work through lunch to make up for it.':'You clock in on time. Your coworkers from the mainland have no idea what that took.')});
  if(start<825) a.push({ic:'🩺',l:'Work until 1:45, then leave',s:`Half day. ${d===2?'For your doctor’s appointment (job −2).':'Boss won’t love it (job −8).'} Pay ${$(Math.round(pay*0.55))}.`,fn:()=>doShift(825,Math.round(pay*0.55),d===2?-2:-8,'You leave at 1:45 with a mumbled explanation.')});

  if(c.gas>0) a.push({ic:'🛢️',l:`Store a gas can in the shed (${c.gas} in cargo)`,s:'+5 gal for the generator or the car.',fn:()=>{c.gas--;S.homeGas+=5;S.t+=5;say('5 gallons of gas into the shed, far from the woodstove.');afterAction()}});

function trade(g,dir){
  const side=L[S.loc].side,pr=price(g,side),mk=MARKETS[S.loc];
  if(dir==='buy'){money(-pr.buy);S.cargo[g]++;S.stats.bought+=pr.buy}else{money(pr.sell);S.cargo[g]--;S.stats.sold+=pr.sell}
  S.t+=g==='drugs'?15:5;
  if(g==='drugs'){
    adj('stress',dir==='sell'?8:6);
    if(Math.random()<(mk.sting||0)+(taskForce()?0.1:0)) return arrest(S.loc==='dale'?'outside Dale’s place':'in a Lakewood motel parking lot',false);
  }
  const verb=dir==='buy'?'Bought':'Sold';
  say(`${GOODS[g].ic} ${verb} 1 ${GOODS[g].n.toLowerCase()} for ${$(dir==='buy'?pr.buy:pr.sell)}.`);
  afterAction();
}
window.TRADE=(g,dir)=>{uiNarr=[];trade(g,dir)};
function marketView(){
  const mk=MARKETS[S.loc];if(!mk)return '';
  const side=L[S.loc].side,m=tod(),open=m>=mk.hours[0]&&m<mk.hours[1];
  let h=`<div class="sect">Trade: ${mk.who}</div>`;
  const n=S.week.news[day()];if(n>=0) h+=`<div class="news">📰 ${NEWS[n].t}</div>`;
  if(side==='I'&&activeOutage()) h+=`<div class="news">🚨 Ferry’s down: island prices for food, medicine and fuel are up 50%.</div>`;
  if(!open) return h+`<div class="news">🔒 Not trading right now. Hours: ${fmt(mk.hours[0])}–${fmt(mk.hours[1])}.</div>`;
  const cap=capNow(),load=cargoN()+S.carried;
  h+=`<div class="mkt">`;
  for(const g of mk.goods){const G=GOODS[g],pr=price(g,side),other=price(g,side==='I'?'M':'I');
    const badge=G.law==='ok'?'<span class="badge ok">Legal</span>':G.law==='lim'?'<span class="badge lim">Ferry limit 2</span>':G.law==='no-ferry'?'<span class="badge no">Not on ferry</span>':'<span class="badge no">Illegal</span>';
    h+=`<div class="mrow"><span class="ic">${G.ic}</span><div class="mi"><b>${G.n}${badge}</b><span>${G.d}</span><div class="px">Buy <b>${$(pr.buy)}</b> · Sell <b>${$(pr.sell)}</b> · ${side==='I'?'mainland':'island'} ~${$(other.buy)}</div></div>
    <div class="mbtns"><button onclick="TRADE('${g}','sell')" ${S.cargo[g]<=0?'disabled':''}>Sell</button><span class="own">${S.cargo[g]}</span><button class="buy" onclick="TRADE('${g}','buy')" ${S.money<pr.buy||load>=cap?'disabled':''}>Buy</button></div></div>`}
  h+=`</div><div style="font-size:12px;color:var(--mute);margin:-2px 2px 6px">Cargo: ${load}/${cap} ${carHere()?'(car)':'(on foot)'}. Groceries in hand count too.</div>`;
  return h;
}
function daleBuy(g,how){
  money(-(g*DALE_PRICE+(how==='can'?10:0)));S.daleStock[day()]-=g;S.stats.daleGal+=g;S.t+=15;
  const lines=['“Cash only. And you didn’t get it from me.”','Dale pours it from a jerry can that smells like a lawnmower. He won’t say how it got here.','“Price went up. Risk premium.” He taps his nose.','Dale’s dog watches you the whole time like you’re a narc.'];
  say('🛢️ '+lines[Math.floor(Math.random()*lines.length)]);

  if(Math.random()<0.12){adj('stress',5);say('A sheriff’s deputy’s SUV rolls slowly past Dale’s driveway. Everyone suddenly gets very interested in the sky.')}
  afterAction();
}

// The save is mirrored under the older key names so an older copy of the game (old install, cached phone app) still finds it.
function saveGame(){const ls=store();if(!ls||!S)return;const keys=[SAVE_KEY,...LEGACY_KEYS];
  try{if(S.over)keys.forEach(k=>ls.removeItem(k));else{const v=JSON.stringify(packSave());keys.forEach(k=>{try{ls.setItem(k,v)}catch(e){}})}}catch(e){}}
// Fill in anything an older (or newer) save is missing, without touching what it has.
function fillDefaults(obj,def){
  for(const k in def){
    if(obj[k]===undefined||obj[k]===null&&def[k]!==null&&typeof def[k]==='object'&&!Array.isArray(def[k])) obj[k]=JSON.parse(JSON.stringify(def[k]));
    else if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])&&obj[k]&&typeof obj[k]==='object') fillDefaults(obj[k],def[k]);
  }
  return obj;
}
const num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d;
function migrate(d){
  if(!d||typeof d!=='object'||!d.S||typeof d.S!=='object') throw new Error('not an Island Time save');
  const from=d.schema||(d.S.cargo?2:1), x=d.S, notes=[];
  // v1 (game 1.1): loose gas/diesel cans instead of trade cargo
  if(from<2){
    x.cargo=x.cargo||{food:0,med:0,gas:0,diesel:0,drugs:0};
    if(x.canGal>0){x.cargo.gas+=Math.max(1,Math.round(x.canGal/5));notes.push('your gas can moved into trade cargo')}
    if(x.dieselCans>0){x.cargo.diesel+=Math.max(1,Math.round(x.dieselCans/5));notes.push('your diesel cans moved into trade cargo')}
    delete x.canGal;delete x.dieselCans;
  }
  fillDefaults(x,baseState());
  // 1.4.2 -> 1.4.3: Pajama Mike was renamed Pajama Fred
  if(x.friends&&x.friends.mike){x.friends.fred=Object.assign(x.friends.mike,{name:'Pajama Fred'});delete x.friends.mike}
  if(x.ev){for(const k of ['count','last'])if(x.ev[k]&&x.ev[k].pajama_mike!=null){x.ev[k].pajama_fred=x.ev[k].pajama_mike;delete x.ev[k].pajama_mike}
    if(Array.isArray(x.ev.history))x.ev.history.forEach(h=>{if(h.id==='pajama_mike')h.id='pajama_fred'});
    if(Array.isArray(x.ev.force))x.ev.force=x.ev.force.map(i=>i==='pajama_mike'?'pajama_fred':i)}
  if(Array.isArray(x.log))x.log.forEach(e=>{if(typeof e.s==='string')e.s=e.s.replace(/Pajama Mike/g,'Pajama Fred').replace(/\bMike\b/g,'Fred')});
  if(Array.isArray(d.uiNarr))d.uiNarr=d.uiNarr.map(t=>typeof t==='string'?t.replace(/Pajama Mike/g,'Pajama Fred').replace(/\bMike\b/g,'Fred'):t);
  // core fields must be sane numbers
  x.t=num(x.t,330);x.cur=num(x.cur,Math.floor(x.t/1440));x.cur=Math.max(0,Math.min(6,x.cur));
  for(const k of ['money','pantry','carried','health','stress','job']) x[k]=num(x[k],baseState()[k]);
  if(!L[x.loc]){notes.push('a place from another version doesn’t exist here, so you’re back home');x.loc='home';}
  // cars
  if(!Array.isArray(x.cars)||!x.cars.length) x.cars=baseState().cars;
  x.cars.forEach(c=>{c.tank=num(c.tank,c.diesel?20:c.id==='beat'?12:14);c.fuel=num(c.fuel,Math.min(8,c.tank));c.diesel=!!c.diesel;if(!L[c.loc])c.loc=L[x.loc].side==='I'?'home':'stDock';c.name=c.name||'Car'});
  // cargo: unknown goods from a newer version are kept but ignored
  for(const g in GOODS) x.cargo[g]=Math.max(0,num(x.cargo[g],0));
  // week: regenerate whatever is missing
  const w=x.week&&typeof x.week==='object'?x.week:{}, fresh=genWeek();
  if(!Array.isArray(w.b)) w.b=fresh.b;
  if(!Array.isArray(w.fog)) w.fog=fresh.fog;
  if(w.storm===undefined) w.storm=null;
  if(!Array.isArray(w.px)||w.px.length<7) w.px=fresh.px;
  w.px.forEach((o,i)=>{for(const g in GOODS) if(!o[g]) o[g]=fresh.px[i][g]});
  if(!Array.isArray(w.news)) w.news=fresh.news.map((n,i)=>i<x.cur?-1:n);
  if(typeof w.bingo!=='number'||!BINGO_FOR[w.bingo]) w.bingo=fresh.bingo;
  if(!Array.isArray(x.ev.force)) x.ev.force=[];
  w.news=w.news.map(n=>typeof n==='number'&&n<NEWS.length?n:-1);
  x.week=w;
  if(from>SAVE_SCHEMA) notes.push(`this save is from a newer version (${d.app||'unknown'}). Anything this version doesn’t know about is kept but ignored`);
  else if(from<SAVE_SCHEMA) notes.push(`upgraded from an older version${d.app?' ('+d.app+')':''}`);
  return {schema:Math.max(from,SAVE_SCHEMA),app:d.app,S:x,uiNarr:Array.isArray(d.uiNarr)?d.uiNarr:[],tab:['act','ferry','todo','log'].includes(d.tab)?d.tab:'act',at:d.at,notes};
}
function rawSave(){const ls=store();if(!ls)return null;
  let best=null;
  for(const k of [SAVE_KEY,...LEGACY_KEYS]){const v=ls.getItem(k);if(!v)continue;let at=0;try{at=JSON.parse(v).at||0}catch(e){}
    if(!best||at>best.at)best={k,v,at}}
  return best}
function loadSave(){
  const r=rawSave();if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));return d.S.over?null:d}
  catch(e){try{const ls=store();ls.setItem('islandtime.save.broken',r.v);[SAVE_KEY,...LEGACY_KEYS].forEach(k=>ls.removeItem(k))}catch(_){}
    saveNotice='Your saved game couldn’t be read, so it was set aside. Start a new week.';return null}
}
function adopt(d){
  S=d.S;uiNarr=d.uiNarr;tab=d.tab;

  if(S.t>=day()*1440+1410&&L[S.loc].side==='M') strandedModal();
}
function resumeGame(){const d=loadSave();if(!d)return titleScreen();
  try{adopt(d)}catch(e){saveNotice='That save couldn’t be loaded in this version.';titleScreen()}}

function b64enc(str){return btoa(unescape(encodeURIComponent(str)))}
function b64dec(b){return decodeURIComponent(escape(atob(b)))}
function exportCode(){const d=rawSave();if(!d&&!S)return '';const obj=d?JSON.parse(d.v):packSave();return 'ISLANDTIME:'+b64enc(JSON.stringify(obj))}
window.openTransfer=()=>{
  const code=exportCode();
  modal('Transfer a saved game',`<p>Copy this code to move your week to another device or version (the web page, the phone app, or Windows).</p>
  ${code?`<textarea id="exp" readonly style="width:100%;height:70px;font-size:11px;border-radius:8px;border:1.5px solid var(--line);padding:6px">${code}</textarea>
  <button class="act" style="margin-top:6px" onclick="copyCode()"><span class="tx"><b id="cpl">📋 Copy code</b></span></button>`:'<p><i>No game in progress to export.</i></p>'}
  <p style="margin-top:12px">Or paste a code here to load it. It replaces your current save.</p>
  <textarea id="imp" oninput="window.IMPV=this.value" placeholder="ISLANDTIME:…" style="width:100%;height:70px;font-size:12px;border-radius:8px;border:1.5px solid var(--line);padding:6px"></textarea>
  <div id="imperr" style="color:var(--bad);font-size:13px"></div>`,
  [{l:'Load pasted code',fn:importCode},{l:'Close',fn:()=>{if(!S||S.over)titleScreen()}}]);
};
window.copyCode=async()=>{const t=document.getElementById('exp');t.select();try{await navigator.clipboard.writeText(t.value);document.getElementById('cpl').textContent='✅ Copied'}catch(e){document.getElementById('cpl').textContent='Selected: press Ctrl+C / Copy'}};
function importCode(){
  const raw=(window.IMPV||document.getElementById('imp')?.value||'').trim();window.IMPV='';
  try{
    const body=raw.replace(/^ISLANDTIME:/,'').replace(/\s+/g,'');
    const d=migrate(JSON.parse(b64dec(body)));
    if(d.S.over) throw new Error('that week is already over');
    setTimeout(()=>adopt(d),0);
  }catch(e){setTimeout(()=>{openTransfer();const el=document.getElementById('imperr');if(el)el.textContent=/already over/.test(e.message)?'That week is already finished.':'That code didn’t work. Make sure you copied all of it, starting with ISLANDTIME:';const i=document.getElementById('imp');if(i)i.value=raw},0)}
}

  let h=`<div class="board"><h3>⛴️ Today’s sailings · ${DAYS[d]}</h3><div style="font-size:12px;color:#9fc0c8">Status as of ${fmt(S.t)}. Things can change without warning.</div>
   <div class="cols"><div><div class="colh">Leave Anderson Is.</div>${col('I',AI_DEPS)}</div><div><div class="colh">Leave Steilacoom</div>${col('M',ST_DEPS)}</div></div></div>`;
  const alerts=S.week.b.filter(b=>b.start<=S.t).map(b=>`<p>🚨 <b>${fmtAbs(b.start)}</b>: service suspended, ${b.cause}. ${S.t>=b.end?`<span style="color:var(--good)">Restored ${fmtAbs(b.end)}.</span>`:'<b>No restoration estimate.</b>'}</p>`).join('');
  h+=`<div class="sect">Rider alerts</div><div class="rules">${alerts||'<p>No active alerts. Enjoy it while it lasts.</p>'}${d===0?'<p>⛽ Monday fuel run: 9:35 AM Steilacoom and 11:30 AM Anderson Island sailings canceled.</p>':''}</div>`;
  h+=`<div class="sect">Fuel & the ferry (current situation)</div><div class="rules">
  <p>⛽ <b>No gas or diesel is sold on Anderson Island.</b> The General Store, the island’s only gas station, closed Feb 2, 2026. A food co-op hopes to reopen it and the pumps in 2027.</p>
  <p>🚫 <b>Gasoline:</b> allowed aboard only in a vehicle’s or boat’s own built-in tank. Spare gas cans, <b>full or empty</b>, are prohibited. County policy cites federal hazmat rules for ferries (49 CFR 176.76) and state law (RCW 9.91.025, unlawful transit conduct). Violators must dispose of the fuel and container, can be cited, and repeat offenders can be barred from the ferry.</p>
  <p>✅ <b>Exemptions the county allows:</b></p>
  <p>• <b>Diesel:</b> up to two 5-gallon DOT-approved containers in a vehicle, marked as diesel, sealed, upright and secured. A DOT-approved slip tank fastened in a pickup bed is also allowed.<br>• <b>Trailered boats:</b> two Coast Guard-approved outboard fuel tanks, up to 6 gallons each.<br>• <b>Propane:</b> up to two portable tanks (each ≤100 lb water capacity), shut off and secured, plus RV tanks.<br>• <b>Fuel runs:</b> tankers cross on Monday runs. With hazmat aboard, only essential personnel (crew and the tanker driver) may ride, so those sailings are closed to the public.</p>
  <p>⚖️ <b>Status:</b> Washington State Ferries carries gas cans under a federal hazmat special permit. Pierce County’s ferry has none. In January 2026 the island’s citizens’ advisory board petitioned to allow cans, and the Coast Guard reportedly signaled it might approve 2-gallon cans if the county applied. On Feb 28, 2026, the County Executive refused, citing about $250K in startup costs, $300–500K a year, and passenger capacity dropping from 325 to 16 on sailings carrying cans. As of mid-2026 the ban stands and the advisory board is still working on a permit approach.</p>
  <p class="small-note" style="color:var(--mute)">In the game, Dale and “smuggled gas” are fiction. Smuggling gas on a passenger ferry is illegal and a real fire hazard.</p></div>`;
  h+=`<div class="sect">Trading: what’s legal on the boat</div><div class="rules">
  <p>🥫🩹 <b>Food and medical supplies:</b> legal to buy, sell and carry.</p>
  <p>🟨 <b>Diesel:</b> two 5-gal DOT cans per vehicle. Extras, or diesel carried on foot, get left on the dock.</p>
  <p>🟥 <b>Gasoline cans:</b> legal to sell, banned on the ferry. Caught: $150 citation, can seized. Second time: barred from the ferry.</p>
  <p>📦 <b>Illicit drugs:</b> illegal everywhere. Caught at the ferry or by an undercover buyer: arrest, $750 bail, five hours lost, and a big hit to your job. A second arrest ends the game.</p>
  <p>Inspection odds go up with every contraband item you carry, and way up when the sheriff’s task force rides the boat. The neighbor’s sailboat isn’t inspected.</p></div>`;
  h+=`<div class="sect">How the ferry works</div><div class="rules">
  <p>🕐 <b>Be in line 20 minutes before departure</b>, cars and walk-ons alike, or you don’t board.</p>
  <p>💵 Fares are collected at Steilacoom only (round trip): ${$(FARE_CAR)} with a car, ${$(FARE_WALK)} on foot. Leaving the island is free.</p>
  <p>🚗 Commute-hour boats fill up with cars. Friday afternoon and Sunday evening are the worst. Walk-ons always fit.</p>
  <p>🔧 When the boat breaks down there’s no second boat this time of year. Long outages eventually get a passenger-only backup.</p>
  <p class="small-note" style="color:var(--mute)">This is a game schedule, inspired by the real Steilacoom–Anderson Island–Ketron route. For real sailings, check Pierce County’s ferry page.</p></div>`;
  return h;
}
function todoItems(){
  const d=day(),m=tod(),it=[];
  for(let i=0;i<5;i++) it.push({ok:!!S.worked[i],fail:(i<d&&!S.worked[i])||(i===d&&m>=780&&!S.worked[i]),l:`Work: ${DAYS[i]}`,s:S.worked[i]?(S.late[i]?`Done, ${S.late[i]} min late`:'Done, on time'):'9:00–5:00, Lakewood',urgent:i===d&&!S.worked[i]&&m<780});
  it.push({ok:S.appt,fail:S.apptMissed||(d>2)||(d===2&&m>885&&!S.appt),l:'Doctor’s appointment',s:'Wednesday 2:30 PM, Medical Clinic (Tacoma). Arrive 2:00–2:45.',urgent:d===2&&!S.appt&&m<=885});
  it.push({ok:S.rx,fail:false,l:'Pick up prescription refill',s:d<3?'Ready Thursday at the Lakewood pharmacy. Run out Saturday night.':'Ready now at the Lakewood pharmacy.',urgent:d>=3&&!S.rx});
  it.push({ok:S.pantry>=2,fail:false,l:'Keep the pantry stocked',s:`${S.pantry} day${S.pantry===1?'':'s'} at home${S.carried?`, ${S.carried} in hand`:''}. You eat 1 per night.`,urgent:S.pantry<1});
  const isl=S.cars.find(c=>c.id==='isl');
  it.push({ok:isl.fuel>=3,fail:false,l:`Keep gas in the ${isl.diesel?'truck':'island car'}`,s:`${isl.fuel}/${isl.tank} gal. No gas on the island: fill up on the mainland, or pay Dale.`,urgent:isl.fuel<1.5});
  if(S.week.storm&&S.week.storm.day>=d) it.push({ok:S.homeGas>=3,fail:false,l:'Generator gas for the storm',s:`Gale on ${DAYS[S.week.storm.day]}. You need 3 gal in the shed or the fridge dies.`,urgent:S.week.storm.day===d&&S.homeGas<3});
  if(d<=2) it.push({ok:S.bingo.nights>0,fail:d===2&&tod()>=1200&&!S.bingo.nights,l:'Optional: Bingo at the Riv',s:`Wednesday 6:00 PM, American Legion. Benefits the ${BINGO_FOR[S.week.bingo]}.`,urgent:false});
  if(S.battery==='weak') it.push({ok:false,fail:false,l:'Replace the car battery',s:'Gas station in Steilacoom. Until then, mornings are a gamble.',urgent:false});
  if(S.injury) it.push({ok:S.injury.treated,fail:false,l:'Get your ankle treated',s:'Urgent Care in DuPont, 8 AM–8 PM. Nothing on the island.',urgent:!S.injury.treated});
  return it;
}
function todoView(){
  const fr=Object.values(S.friends);
  return `<div class="sect">This week</div>`+todoItems().map(x=>`<div class="todo"><span class="ck">${x.ok?'✅':x.fail?'❌':x.urgent?'⚠️':'⬜'}</span><div><b>${x.l}</b><span>${x.s}</span></div></div>`).join('')+
  (fr.length?`<div class="sect">Island friends</div>`+fr.map(f=>`<div class="todo"><span class="ck">🤝</span><div><b>${f.name}</b><span>Met ${DAYS[f.day]}: ${f.how}.</span></div></div>`).join(''):'')+
  `<div class="sect">Survive until Sunday night</div><div class="rules"><p>Out of cash? Ferry fares, rideshares and motels go on the credit card, and it counts against your score.</p><p>Health 0: medevac off the island. Job 0: fired. Stress is everything.</p><p>Score: cash + health + job − stress, plus bonuses for not getting stranded.</p></div>`;
}
function logView(){return `<div class="log">${S.log.slice().reverse().map(e=>`<p><em>${DAYS[Math.floor(e.t/1440)].slice(0,3)} ${fmt(e.t)}</em>${e.s}</p>`).join('')}</div>`}

// ---------------- modal & crossing ----------------
let MB=[];
let MQ=[];
function modal(title,body,btns,noClose){
  if(document.getElementById('mbg')){MQ.push([title,body,btns,noClose]);return}
  MB=btns;
  const el=document.createElement('div');el.className='modal-bg';el.id='mbg';
  el.innerHTML=`<div class="modal"><h2>${title}</h2><div class="mb">${body}</div>${btns.map((b,i)=>`<button class="act ${i===0?'primary':''}" onclick="MBTN(${i})"><span class="tx"><b>${b.l}</b>${b.s?'<span>'+b.s+'</span>':''}</span></button>`).join('')}</div>`;
  document.body.appendChild(el);
}
window.MBTN=i=>{const el=document.getElementById('mbg');el&&el.remove();const f=MB[i]&&MB[i].fn;f&&f();
  if(!document.getElementById('mbg')&&MQ.length&&S&&!S.over){const q=MQ.shift();modal(...q)}
  if(S&&!S.over&&!document.querySelector('.title,.end'))render()};
function crossing(side,cap,cap2,done,sail){
  const el=document.createElement('div');el.className='cross';
  const rev=side==='M';
  const boat=sail?`<g><path d="M0 40 h70 l-10 14 h-50 z" fill="#f4f1ea"/><path d="M34 38 V-30 L70 34 Z" fill="#fff"/><path d="M32 36 V-10 L6 34 Z" fill="#e3e0d6"/></g>`
    :`<g><rect x="0" y="20" width="120" height="20" rx="4" fill="#f4f1ea"/><rect x="0" y="34" width="120" height="8" fill="#2f5d4a"/><rect x="42" y="4" width="36" height="17" fill="#f4f1ea"/><rect x="46" y="8" width="28" height="6" fill="#2a3d45"/><rect x="56" y="-8" width="7" height="12" fill="#e3642e"/></g>`;
  el.innerHTML=`<svg viewBox="0 0 480 260"><rect width="480" height="260" fill="#12313b"/><rect y="150" width="480" height="110" fill="#1d4b5a"/>
   <path d="M0 150 q40 -30 90 -20 l20 20z" fill="#2f5d4a"/><path d="M380 150 q50 -40 100 -25 v25z" fill="#2f5d4a"/>
   <text x="20" y="180" fill="#9fc0c8" font-size="12" font-family="DM Sans">${rev?'Anderson Is.':'Anderson Is.'}</text><text x="460" y="180" text-anchor="end" fill="#9fc0c8" font-size="12" font-family="DM Sans">${rev?'Steilacoom':'Steilacoom'}</text>
   <g transform="translate(40,${sail?100:110})"><g class="boat ${rev?'rev':''}"><g class="bob">${boat}</g></g></g>
   <path d="M0 200 h480 M0 222 h480" stroke="#fff" stroke-opacity=".08"/></svg>
   <div class="cap">${cap}</div><div class="cap2">${cap2}</div><div class="cap2" style="margin-top:18px">tap to skip</div>`;
  document.body.appendChild(el);
  let fin=false;const end=()=>{if(fin)return;fin=true;el.remove();done()};
  el.onclick=end;setTimeout(end,2900);
}

// ---------------- endings ----------------
function scoreOf(){
  const s=S.stats;
  const cargoVal=Object.keys(GOODS).reduce((a,g)=>a+S.cargo[g]*price(g,'M').sell,0);
  const bonus=Object.keys(S.friends).length*60+S.bingo.won+S.bingo.donated+cargoVal-S.drugCharges*300-S.citations*200+(s.stranded===0?150:0)+(S.appt?100:0)+(S.rx?60:0)+(Object.keys(S.worked).length*40);
  return Math.round(S.money+S.health*4+S.job*4-S.stress*3+bonus);
}
function gradeOf(sc){
  if(sc>=2000) return ['A','Born & Raised Islander','You read the boat like the tide. The General Store regulars nod at you now.'];
  if(sc>=1650) return ['B','Ferry-Hardened','You’ve got a cooler in the trunk and the schedule memorized. Mostly.'];
  if(sc>=1300) return ['C','Still Figuring It Out','You survived. The ferry won a few rounds.'];
  if(sc>=900) return ['D','Considering Lakewood Apartments','You’ve started browsing mainland rentals “just to look.”'];
  return ['F','Moving Back to the Mainland','The island is beautiful. You’ll visit. On a Tuesday. Not a Friday.'];
}
function finish(){clearTiles();S.over=true;endScreen('You made it to Sunday night','You survived a week of island life.')}
function gameOver(why){S.over=true;MQ=[];tileQ=[];document.querySelectorAll('#tiles .tile').forEach(t=>t.remove());document.querySelectorAll('.modal-bg').forEach(e=>e.remove());
  const T={health:['Medevac off the island','Your health gave out. The fire department calls for the medevac helicopter.'],fired:['You’re fired','Your boss has run out of patience with “the ferry broke down again.”'],convicted:['Second arrest','Your second drug arrest. You won’t be going home to the island for a long time.'],banned:['Barred from the ferry','Second gas-can violation. You’re barred from riding the Pierce County ferry. On an island with no bridge, that’s checkmate.']}[why];
  endScreen(T[0],T[1],true)}
function endScreen(h1,sub,lost){
  const sc=scoreOf(),g=lost?['F',h1,sub]:gradeOf(sc),s=S.stats;
  saveGame();let best=null;const ls=store();try{best=ls?Number(ls.getItem(BEST_KEY)||'NaN'):NaN;if(!lost&&(isNaN(best)||sc>best)){ls&&ls.setItem(BEST_KEY,String(sc));best=isNaN(best)?null:best;var newBest=true}}catch(e){}
  app.innerHTML=`<div class="end"><div class="small-note" style="color:var(--mute)">${lost?'GAME OVER':'WEEK COMPLETE'}</div><h1>${h1}</h1><p>${sub}</p>
  <div style="display:flex;gap:16px;align-items:center;margin:16px 0"><div class="grade">${g[0]}</div><div><b style="font-family:Fraunces;font-size:20px">${g[1]}</b><div style="color:var(--mute);font-size:14px">${g[2]}</div></div></div>
  <div class="kv"><span>Score</span><b>${sc}${typeof newBest!=='undefined'&&newBest?' 🏆 new best':''}</b></div>${best!=null&&!isNaN(best)?`<div class="kv"><span>Previous best</span><b>${best}</b></div>`:''}
  <div class="kv"><span>Cash left</span><b style="${S.money<0?'color:#ff8a70':''}">${S.money<0?'−':''}$${Math.abs(Math.round(S.money))}</b></div>
  <div class="kv"><span>Health / Job / Stress</span><b>${S.health} / ${S.job} / ${S.stress}</b></div>
  <div class="kv"><span>Workdays completed</span><b>${Object.keys(S.worked).length} of 5</b></div>
  <div class="kv"><span>Doctor’s appointment</span><b>${S.appt?'Made it':'Missed'}</b></div>
  <div class="kv"><span>Ferry crossings</span><b>${s.crossings}</b></div>
  <div class="kv"><span>Hours spent waiting for the boat</span><b>${(s.waited/60).toFixed(1)}</b></div>
  <div class="kv"><span>Times the boat was full</span><b>${s.bumps}</b></div>
  <div class="kv"><span>Nights stranded</span><b>${s.stranded}</b></div>
  <div class="kv"><span>Spent on fares</span><b>${$(s.fares)}</b></div>
  <div class="kv"><span>Gallons bought from Dale</span><b>${s.daleGal}</b></div>
  <div class="kv"><span>Gallons you smuggled / citations</span><b>${s.smuggled} / ${S.citations}</b></div>
  <div class="kv"><span>Nights without power</span><b>${s.outageNights}</b></div>
  <div class="kv"><span>Island friends made</span><b>${Object.keys(S.friends).length?Object.values(S.friends).map(f=>f.name.split(',')[0].split(' from')[0]).join(', '):'none'}</b></div>
  ${S.bingo.comped?`<div class="kv"><span>Comped by the Riv</span><b>${$(S.bingo.comped)}</b></div>`:''}
  <div class="kv"><span>Bingo nights / winnings</span><b>${S.bingo.nights} / ${$(S.bingo.won)}</b></div>${S.bingo.nights?`<div class="kv"><span>Your bingo money that went to the ${BINGO_FOR[S.week.bingo]}</span><b>${$(S.bingo.donated)}</b></div>`:''}
  <div class="kv"><span>Trading: bought / sold</span><b>${$(s.bought)} / ${$(s.sold)}</b></div>
  <div class="kv"><span>Drug runs / arrests</span><b>${s.drugRuns} / ${s.arrests}</b></div>
  <div class="kv"><span>Ferry outages this week</span><b>${S.week.b.filter(b=>b.start<S.t).length}</b></div>
  <button class="big" style="width:100%;margin-top:22px" onclick="newGame();tab='act';render()">Play another week</button><button class="act" style="margin-top:10px;justify-content:center" onclick="titleScreen()"><span class="tx" style="text-align:center"><b>Back to title</b></span></button></div>`;
  window.scrollTo(0,0);
}

// ---------------- title ----------------
function clearTiles(){tileQ=[];document.querySelectorAll('#tiles .tile').forEach(t=>t.remove())}
function titleScreen(){clearTiles();
  app.innerHTML=`<div class="title"><div class="art"><svg viewBox="0 0 480 250" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%"><defs><linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbcc4"/><stop offset="1" stop-color="#e2e6dc"/></linearGradient></defs><rect width="480" height="250" fill="url(#ts)"/><rect y="96" width="480" height="154" fill="#1d4b5a"/>
   <polygon points="250,95 330,25 345,36 356,28 440,95" fill="#e9eef0"/><polygon points="310,43 330,25 345,36 356,28 375,45 355,42 342,48 328,40" fill="#fff"/>
   ${Array.from({length:16},(_,i)=>{const x=i*32-10,h=50+((i*29)%45);return `<polygon points="${x},96 ${x+16},${96-h} ${x+32},96" fill="#2f5d4a"/>`}).join('')}
   <g transform="translate(150,150)"><g class="bob"><rect x="0" y="20" width="170" height="24" rx="4" fill="#f4f1ea"/><rect x="0" y="38" width="170" height="9" fill="#2f5d4a"/><rect x="60" y="2" width="50" height="20" fill="#f4f1ea"/><rect x="65" y="6" width="40" height="7" fill="#2a3d45"/><rect x="80" y="-12" width="9" height="16" fill="#e3642e"/></g></g>
   <path d="M0 210 h480 M0 230 h480" stroke="#fff" stroke-opacity=".1"/></svg></div>
  <div class="body"><h1>Island Time<span>A week of living on Anderson Island, WA</span></h1>
  <p>There’s no bridge. One small county ferry connects your island home to your job, the grocery store, the gas pump and your doctor. This week it has to get you through all of it.</p>
  <ul><li>Work in Lakewood Mon–Fri. Clock in by 9:00.</li><li>Keep food in the pantry. The island’s only store closed this year.</li><li>Keep gas in the car. There’s no gas on the island, and gas cans are banned on the ferry.</li><li>Make your Wednesday doctor’s appointment in Tacoma and pick up your prescription.</li><li>Be in the ferry line 20 minutes early. Watch for fog, full boats and breakdowns.</li><li>Trade on the side: import food, medicine and fuel to the island, or take a bigger risk.</li></ul>
  ${(()=>{const d=loadSave();return d?`<button class="big" onclick="resumeGame()">Continue: ${DAYS[d.S.cur]} ${fmt(d.S.t)} ⛴️</button><button class="ghost" onclick="newGame();tab='act';render()">Start a new week</button>`:`<button class="big" onclick="newGame();tab='act';render()">Start Monday ⛴️</button>`})()}
  <button class="ghost" onclick="openTransfer()">🔁 Transfer a saved game</button>
  ${saveNotice?`<div class="hint">⚠️ ${saveNotice}</div>`:''}
  <button id="installBtn" class="ghost" style="display:${deferredInstall&&!isStandalone()?'block':'none'}" onclick="doInstall()">📲 Install as an app</button>
  ${!isStandalone()&&isIOS()?'<div class="hint">📲 <b>Play it like an app:</b> tap the Share button in Safari, then <b>Add to Home Screen</b>. It works offline, too.</div>':''}
  <div class="small-note">Version ${APP_VERSION}. Fictionalized for fun. The schedule, prices and people are made up. The store closure and the fuel rules are real as of mid-2026.</div></div></div>`;
}
titleScreen();
</script>
