const msgLine=(id,k)=>pick(((MSG_P[id]||{})[k])||MSG_GEN[k]||MSG_GEN.inc);

// replies to requests: built when the reply arrives, so they use what’s true then
function msgReplyText(it){const id=it.id,lv=flv(id);
  if(it.k==='ride')return it.ride==='yes'?pick(['Yes! Leaving in 10. I’ll honk. The chickens send their regards. 🐔','Sure thing! Gotta be back for feeding anyway. Ready when you are.','Yep! Bring your coffee, my cup holder’s full of feed.']):
    pick(['Ah, sorry! I’m stuck here today. Hen emergency. Long story.','Can’t this morning, my truck’s doing the thing again. Sorry!!','Oh no, I already went over on the early boat. Next time!']);
  if(it.k==='boat'){
    if(lv>=2){const b=msgNextOutage();
      if(!b)return pick(['Deck crew says smooth sailing through tomorrow. Which means nothing, but still.','Nothing from my guy. Boat’s behaving. For now.','All quiet on the deck. Captain even smiled. Weird.']);
      if(b.start<=S.t)return `Boat’s down right now: ${b.cause}. My buddy figures back around ${fmtAbs(b.end)}. Maybe. 🩴`;
      return pick([`Heads up: deck crew says they’ll be pulling the boat around ${fmtAbs(b.start)}. ${b.cause[0].toUpperCase()+b.cause.slice(1)}. You didn’t hear it from me.`,`My guy on the deck says trouble around ${fmtAbs(b.start)}: ${b.cause}. Plan around it. 🩴`]);}
    return pick(['Something about the boat maybe? Or was it the bus. Ask me when we’re closer, I protect my sources.','Eh, heard a rumor. Can’t say. Buy me a coffee sometime.','I hear stuff. Not telling stuff. Yet. 🩴']);}
  if(it.k==='bingo')return id==='walt'?pick(['Six sharp. Legion’s calling. First card’s on me.','Wouldn’t miss it. Bring quarters.','Of course. Somebody has to keep Rusty honest.']):
    lv>=2?pick(['Saving you a seat at the bar. Don’t be late, the stool police are vicious.','Yep. Your seat’s saved. Don’t make me defend it again.']):pick(['Wouldn’t miss it. Come early, seats go fast.','Yeah. Walt’s calling, so it’ll be loud.']);
  if(it.k==='mainland')return pick(['Oh, would you? A rotisserie chicken from the store, if it’s no trouble. Don isn’t allowed to choose anymore. – Ruth','Aren’t you sweet. Don wants the good crackers. You’ll know them. They’re expensive. – Ruth','Just come home safe, dear. And maybe a lemon. One lemon. – Ruth']);
  return msgLine(id,it.k);
}
// the next ferry outage today or tomorrow (Pajama Fred’s deck-crew perk), including one going on now
function msgNextOutage(){const lim=(day()+2)*1440;return S.week.b.filter(b=>b.end>S.t&&b.start<lim).sort((a,b)=>a.start-b.start)[0]||null}

// when the reply comes: 3–25 min (close friends 2–10), next morning if asleep, later if busy
function msgDelay(id,k){const av=phoneFriendAvail(id),m=tod();
  if(av==='asleep'){const wake=msgRnd(390,480);return (m>=1350?1440-m+wake:wake-m)}
  let d=k==='ride'?msgRnd(2,8):flv(id)>=3?msgRnd(2,10):msgRnd(3,25);
  if(av==='busy'&&k!=='ride')d+=msgRnd(30,90);return d}

// ---- sending ----
function msgSend(id,k,text){if(!phoneCan()||!S.friends[id])return;const M=MSG();phoneUse(1);msgPush(id,1,text);
  if(M.inc[id]===dayKey()){delete M.inc[id];phoneSocial(id,1)}         // answering their text the same day
  const it={id,k,at:S.t+msgDelay(id,k),d:dayKey(),soc:k==='how'||k==='mainland'};
  if(k==='ride'){it.ride=phoneAskRide();if(it.ride==='not-now')return;if(it.ride==='yes')delete S.ev.flags.samRide}  // the 🤝 option appears when Sam answers
  M.q.push(it)}
function msgDeliver(it){const M=MSG();
  if(it.k==='ride'&&it.ride==='yes'&&it.d===dayKey())S.ev.flags.samRide=day();
  if(it.soc)phoneSocial(it.id,1);
  const x=msgReplyText(it);const T=msgPush(it.id,0,x,Math.min(S.t,it.at));T.u++;
  phoneNotify('💬',msgFirst(it.id),x.length>70?x.slice(0,68)+'…':x)}

// ---- friends text first: about one text a day once you have friends ----
const MSG_INC=[
  {who:['sam'],x:()=>pick(['The chickens laid NINE eggs today. Nine! Want some? 🥚','Henrietta escaped again. If you see a judgmental chicken on your porch, she’s mine.','Made too much cornbread. Porch drop incoming.'])},

];
function msgIncoming(){const ids=Object.keys(S.friends);if(!ids.length)return;
  const w=ids.map(id=>flv(id)+(MSG_P[id]?1:0));let r=Math.random()*w.reduce((a,b)=>a+b,0),id=ids[0];
  for(let i=0;i<ids.length;i++){r-=w[i];if(r<0){id=ids[i];break}}
  const own=MSG_INC.filter(c=>c.who&&c.who.includes(id));const c=own.length&&Math.random()<0.75?pick(own):MSG_INC[MSG_INC.length-1];
  const x=c.x(),M=MSG();const T=msgPush(id,0,x);T.u++;M.inc[id]=dayKey();
  phoneNotify('💬',msgFirst(id),x.length>70?x.slice(0,68)+'…':x)}
function msgPlan(M){const r=Math.random(),n=r<0.3?0:r<0.78?1:2,from=Math.max(tod(),480)+20,at=[];
  for(let i=0;i<n&&from<1260;i++)at.push(day()*1440+msgRnd(from,1260));M.plan={d:dayKey(),at:at.sort((a,b)=>a-b)}}

phoneOnTime(()=>{if(!S||S.over)return;const M=MSG();
  for(const it of M.q.slice().sort((a,b)=>a.at-b.at)){if(it.at>S.t)break;M.q=M.q.filter(x=>x!==it);if(S.friends[it.id])msgDeliver(it)}
  if(!M.plan||M.plan.d!==dayKey()){if(!Object.keys(S.friends).length)return;msgPlan(M)}
  while(M.plan.at.length&&M.plan.at[0]<=S.t){M.plan.at.shift();msgIncoming()}
});

// ---- screens ----
function msgList(){const M=MSG(),ids=Object.keys(S.friends);
  if(!ids.length)return `<p style="color:var(--mute);text-align:center;margin-top:30px">No one to text yet.<br>Make friends on the island and they’ll show up here.</p>`;
  const last=id=>{const T=M.th[id];return T&&T.m.length?T.m[T.m.length-1]:null};
  ids.sort((a,b)=>((last(b)||{t:-1}).t)-((last(a)||{t:-1}).t));
  return ids.map(id=>{const l=last(id),u=(M.th[id]||{}).u||0;
    return `<button class="ph-row msg-row${u?' msg-unread':''}" onclick="phoneGo('msg','${id}')"><span class="ph-av">${msgAv(id)}</span><span class="msg-mid"><b>${esc(msgFirst(id))}</b><span>${l?(l.f?'You: ':'')+esc(l.x):'Say hi 👋'}</span></span><span class="msg-side">${l?`<small>${fmtAbs(l.t)}</small>`:''}${u?'<i class="msg-dot" aria-label="unread"></i>':''}</span></button>`}).join('')}
function msgView(id){const M=MSG(),f=S.friends[id];if(!f)return msgList();
  const T=msgThread(id);T.u=0;
  const pend=M.q.find(it=>it.id===id),av=phoneFriendAvail(id),first=msgFirst(id);
  let h=`<div class="msg-head"><span class="ph-av">${msgAv(id)}</span><div><b>${esc(first)}</b><span>${esc(f.name)} · ${LVL_NAME[flv(id)]||'Friend'}</span></div></div><div class="msg-thread">`;
  h+=T.m.length?T.m.map(m=>`<div class="ph-msg ${m.f?'me':'them'}">${esc(m.x)}<small>${fmtAbs(m.t)}</small></div>`).join(''):`<p class="msg-empty">No messages yet. Say hi.</p>`;
  if(pend)h+=`<div class="msg-status">${av==='asleep'?`Delivered. ${esc(first)} is probably asleep.`:'Delivered. Waiting for a reply…'}</div>`;
  h+='</div><div class="ph-sect">Write…</div>';
  const send=(k,txt,sub,dis)=>phBtn(txt,()=>msgSend(id,k,txt),{sub,dis:dis||!!pend});
  if(id==='sam'){const P=PH(),asked=P.rideAsk===dayKey();if(S.loc==='home'&&tod()<630)h+=send('ride','Any chance of a ride to the ferry?',asked?'You already asked today.':'Sam might drive you to the landing.',asked);}
  if(id==='fred')h+=send('boat','Hear anything about the boat today?',flv(id)>=2?'Fred’s deck-crew buddy knows things.':'Fred might not tell you much yet.');
  if((id==='walt'||id==='rusty')&&msgWed()&&tod()<1140)h+=send('bingo','Bingo tonight?','6:00 PM at the Riv.');
  if(id==='hendersons'&&L[S.loc].side==='M')h+=send('mainland','Need anything from the mainland?','They’re retirees. They always need something.');
  h+=send('how','How’s it going?',M.inc[id]===dayKey()?'Answer their text: good for the friendship.':'Keeping in touch is good for a friendship.');
  h+=send('otw','On my way!')+send('late','Running late. Ferry’s a mess.')+send('thanks','Thanks again!');
  h+=`<p class="msg-foot">Each text uses a little battery.${pend?' One text at a time: wait for the reply.':''}</p>`;
  setTimeout(()=>{const b=document.querySelector('#phoneUI .ph-body'),t=document.querySelector('#phoneUI .msg-thread');if(b&&t)b.scrollTop=Math.max(0,t.offsetTop+t.offsetHeight-b.offsetTop-b.clientHeight*0.6)},0);
  return h}
definePhoneApp({id:'msg',name:'Messages',ic:'💬',builtin:true,order:10,badge:msgUnread,view:arg=>arg?msgView(arg):msgList()});
// ---------------- 📱 phone: calls (contacts, island numbers, recents, incoming calls) ----------------
// State: PH().calls = {log:[], ring:null, next:abs time of the next incoming call, vm:{id:dayKey}, dinner:dayKey}
// Created lazily, so older saves just work. The live call screen is transient (CALL_NOW), not saved.
let CALL_TAB='contacts', CALL_NOW=null;

const callPick=(m,id,any)=>pick((m[id]&&m[id].length?m[id]:any));

function callLog(e){const c=CL();c.log.unshift(Object.assign({t:S.t},e));if(c.log.length>20)c.log.length=20}
function callBadge(){if(!S)return 0;const c=CL();return (callRinging()?1:0)+c.log.filter(e=>(e.dir==='missed'&&!e.seen)||(e.vm&&!e.heard)).length}
function callRinging(){const c=CL();return c.ring&&S.t<=c.ring.until&&phoneCan()?c.ring:null}
// a call takes time and battery: 1% per 5 minutes on top of the usual drain
function callTime(min){S.t+=min;phoneUse(Math.max(1,Math.round(min/5)));processTimed()}

function callStart(id){
  const av=phoneFriendAvail(id),w=callWho(id,1);
  callTime(1);
  CALL_NOW={id,t:S.t,lines:[],done:{}};
  if(av==='asleep'||av==='busy'){CALL_NOW.st='out';CALL_NOW.lines.push(`It rings and rings. ${av==='asleep'?'It’s late.':`${w} must be busy.`}`,CALL_GREET[id]||'“Leave a message after the beep.”');callLog({id,dir:'out',ans:false})}
  else {CALL_NOW.st='on';CALL_NOW.lines.push(`${w} picks up. “Hey, {{name}}!”`);callLog({id,dir:'out',ans:true})}
}
function callSay(s){CALL_NOW.lines.push(s)}
function callEnd(){CALL_NOW=null}
// friend-specific asks: [label, sub, show?, fn]
function callAsks(id){
  const w=callWho(id,1),d=day(),out=[];
  if(id==='sam'&&S.loc==='home'&&tod()<630) out.push(['🚗 Ride to the ferry?','Sam’s headed that way some mornings.',()=>{const r=phoneAskRide();callTime(2);
    if(r==='yes'){callSay('“Sure thing. Holler when you’re ready and I’ll pull the truck around. Mind the egg cartons.”');say('📞 Sam will drive you to the ferry landing today. Look for 🤝 <b>Ride with Sam</b>.')}
    else if(r==='no')callSay('“Ah, not today. I’ve got a chicken situation. Long story. Next time!”');
    else callSay('“Bit late for that, isn’t it?”')}]);
  if(id==='fred') out.push(['⛴️ Any word on the boat?','Fred hears things from the deck crew.',()=>{callTime(3);
    const b=S.week.b.filter(b=>b.end>S.t&&Math.floor(b.start/1440)<=d+1).sort((x,y)=>x.start-y.start)[0];
    if(b&&flv('fred')>=2){const cause=b.cause.split(' (')[0],when=b.start<=S.t?`It’s down right now. Back maybe around ${fmtAbs(b.end)}.`:`${Math.floor(b.start/1440)===d?'Today':'Tomorrow'}, from about ${fmt(b.start)}.`;
      callSay(`“Okay, you didn’t hear this from me. My buddy on the deck crew says ${cause}. ${when} Plan around it.”`);say(`📞 Fred’s deck-crew tip: <b>${cause}</b>. ${when}`)}
    else if(b)callSay('“Something’s brewing with the boat. Couldn’t get details. My buddy clams up unless he knows you. Get to know me better and I’ll get to know him better.”');
    else callSay('“Quiet on the wire. Which, honestly, makes me nervous. But quiet.” He yawns. You hear flannel.')}]);
  if(id==='walt'&&!S.emp) out.push(['💼 Any work going?','Walt knows everybody.',()=>{callTime(5);adj('stress',-3);phoneSocial('walt',1);
    callSay(flv('walt')>=2?`“I’ll make some calls. Get an interview lined up and I’ll put in a good word. People listen to the Legion.”`:'“Check the listings and the bulletin board by the old store. And stand up straight in the interview. That’s free advice.”')}]);
  if(id==='hendersons'&&d%7>=4&&CL().dinner!==dayKey()) out.push(['🍲 Dinner this weekend?','They love company. Stress −4.',()=>{callTime(5);CL().dinner=dayKey();adj('stress',-4);
    if(S.ateOut!==d){S.ateOut=d;callSay('“Tonight! Pot roast. We’ll bring a plate if you can’t make it over.” Mr. Henderson: “Two plates.” Dinner tonight is handled.');say('🍲 The Hendersons have tonight’s dinner covered: pot roast.')}
    else{S.pantry+=1;callSay('“You’ve eaten? Then we’ll drop leftovers on your porch. Don’t argue.” +1 day of food.');say('🍲 The Hendersons drop pot roast leftovers on your porch: +1 day of food.')}}]);
  return out.map(([l,s,fn])=>({l,s,fn}));
}
function callScreen(){

  let h=`<div class="ph-call"><div class="ph-call-av">${CALL_AV[id]||'🙂'}</div><b>${C.st==='out'?'Calling':C.st==='vm'?'Voicemail':'On a call with'} ${esc(callWho(id,1))}${C.st==='out'?'…':''}</b><span>${f?esc(f.name):''}</span></div>`;
  h+=`<div class="ph-call-log">${C.lines.map(s=>`<p>${s}</p>`).join('')}</div>`;
  if(!phoneCan()) return h+`<p>Your phone dies mid-sentence.</p>`+phBtn('OK',()=>{callEnd()});
  if(C.st==='out'){
    h+=phBtn('🎙️ Leave a voicemail',()=>{callTime(2);const c=CL();if(c.vm[id]!==dayKey()){c.vm[id]=dayKey();friendPts(id,0.5)}
      C.st='vm';callSay('You leave a message: “Hey, it’s {{name}}. Just calling to say hi. Call me back.” Beep.')},{cls:'primary',sub:'Two minutes. They’ll like hearing from you.'});
    h+=phBtn('📵 Hang up',callEnd);
  } else if(C.st==='vm') h+=phBtn('📵 Hang up',callEnd,{cls:'primary'});
  else {
    if(!C.done.chat) h+=phBtn('💬 Just catching up',()=>{callTime(15);C.done.chat=1;const first=phoneSocial(id,1);adj('stress',first?-5:-2);callSay(callPick(CALL_CHAT,id,CALL_CHAT_ANY))},{cls:'primary',sub:'15 minutes. Stress −5.'});
    for(const a of callAsks(id)) if(!C.done[a.l]) h+=phBtn(a.l,()=>{C.done[a.l]=1;a.fn()},{sub:a.s});
    h+=phBtn(C.lines.length>1?'📵 Hang up':'📵 Never mind',callEnd);
  }
  return h;
}
function callIncoming(r){

    phBtn('📞 Answer',()=>{const c=CL();c.ring=null;callLog({id:r.id,dir:'in',ans:true});callTime(1);CALL_NOW={id:r.id,t:S.t,st:'on',lines:[`${w}: ${callPick(CALL_IN,r.id,['“Hey, {{name}}! Just calling to say hi.”'])}`],done:{}}},{cls:'primary'})+

}

  return `<div class="ph-tabs">${t('contacts','Contacts')}${t('services','Island numbers')}${t('recents','Recents'+(n?` (${n})`:''))}</div>`}
function callView(){

      if(d===2&&m<1080&&!res){S.bingo.reserved=d;S.t+=5;phoneUse(1);processTimed();say('📞 “Table for {{name}}, bingo tonight? You got it, hon.” Reserved.')}
      else {callTime(1);say(d===2&&res?'📞 “Yes, hon, you’re on the list. RESERVED tent and everything.”':'📞 “Riv. Bingo’s Wednesday, hon. Call that day before six and we’ll hold you a table.”')}},'<span class="ph-dial">📞</span>');
  } else {
    c.log.forEach(e=>{if(e.dir==='missed')e.seen=true});
    if(!c.log.length) return h+'<p style="color:var(--mute)">No calls yet.</p>';
    h+=c.log.map(e=>{const w=esc(callWho(e.id,1)),when=`${DAYS[((Math.floor(e.t/1440)%7)+7)%7].slice(0,3)} ${fmt(e.t)}`;
      const sub=e.dir==='missed'?`Missed call · ${when}`:e.dir==='in'?`Incoming · ${when}`:`Outgoing${e.ans?'':' · no answer'} · ${when}`;
      let row=callRow(CALL_AV[e.id]||'🙂',e.dir==='missed'?`<span style="color:#c0392b">${w}</span>`:w,sub,()=>{if(S.friends[e.id])callStart(e.id)},'<span class="ph-dial">📞</span>');
      if(e.vm) row+=`<div class="ph-vm">${e.heard?`<p>🎙️ ${e.vm}</p>`:phBtn('▶️ Play voicemail',()=>{e.heard=true;phoneUse(1)},{sub:'New voicemail'})}</div>`;

// Friends call you sometimes: every few days, during waking hours, only when the phone has battery.
function callSchedule(c,from){let t=from+Math.floor((1.5+Math.random()*2.5)*1440);const m=((t%1440)+1440)%1440;if(m<540||m>1200)t=Math.floor(t/1440)*1440+540+Math.floor(Math.random()*600);c.next=t}
phoneOnTime(()=>{
  if(!S||!S.friends)return;const c=CL();
  if(c.ring&&S.t>c.ring.until){const r=c.ring;c.ring=null;const vm=Math.random()<0.7&&CALL_VM[r.id];callLog({id:r.id,t:r.t,dir:'missed',seen:false,vm:vm||null,heard:false});
    if(phoneCan())phoneNotify('📞',`Missed call: ${callWho(r.id,1)}`,vm?'New voicemail · Phone → Recents':'Phone → Recents')}
  if(c.next==null){callSchedule(c,S.t);return}
  if(S.t<c.next||c.ring||CALL_NOW)return;
  const m=tod();if(m<540||m>1230){c.next=(day()+(m<540?0:1))*1440+540+Math.floor(Math.random()*600);return}   // too early or late: later
  const ids=Object.keys(S.friends).filter(id=>phoneFriendAvail(id)==='ok');
  callSchedule(c,S.t);
  if(!ids.length||!phoneCan())return;
  const id=pick(ids);c.ring={id,t:S.t,until:S.t+30};
  phoneNotify('📞',`${callWho(id,1)} ${/^the /i.test(callWho(id,1))?'are':'is'} calling`,'Open your 📱 phone to answer');
});

function phoneSailings(side,n){   // the next n sailings you could still make from this side (known outages only)

  for(let d=day();d<day()+3&&out.length<n;d++)for(const dep of deps){if(out.length>=n)break;
    const s=sailing(side,d,dep,'walk',true);if(S.t>s.abs-20||s.cancel)continue;out.push(s)}
  return out}

// ======== 3. ambient sound (WebAudio, synthesized; shares sfx()'s AudioContext) ========
// prefs().amb: 'off' (default) | 'low' | 'med'. Silent when 🔊 Sound is off, when the page is hidden,
// and until the player has touched or typed something.
const AMB_LV={off:0,low:0.22,med:0.5},AMB_TXT={off:'Off',low:'Low',med:'Medium'},AMB_NEXT={off:'low',low:'med',med:'off'};
const AMB={gesture:false,on:false,ctx:null,master:null,rain:null,forest:null,gull:null,ferry:null,srcs:[],gullT:null,tick:null,noise:null,seed:0x9e3779b9,want:{rain:0,forest:0,gulls:false}};
function ambRnd(){let x=AMB.seed;x^=x<<13;x^=x>>>17;x^=x<<5;AMB.seed=x>>>0;return AMB.seed/4294967296}   // own PRNG: leaves Math.random alone

function ambNoise(a){if(AMB.noise&&AMB.noise.sampleRate===a.sampleRate)return AMB.noise;
  const n=Math.floor(a.sampleRate*2),b=a.createBuffer(1,n,a.sampleRate),d=b.getChannelData(0);let last=0;
