<style>
:root{
  --sound:#1d4b5a; --deep:#12313b; --fir:#2f5d4a; --moss:#6f8f5a; --sand:#f3ecdc; --paper:#fbf8f1;
  --buoy:#e3642e; --ink:#1b2326; --mute:#6b7478; --line:#ddd4c0; --good:#2f7d4f; --bad:#b8402a; --warn:#c98a12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--deep);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px;font-weight:700;font-size:16px}
.hint{font-size:13px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;line-height:1.45}
/* title */
.title{flex:1;display:flex;flex-direction:column;background:linear-gradient(#1d4b5a,#12313b);color:#fff}
.title .art{height:250px}
.title .body{padding:18px 22px 28px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:40px;line-height:1;letter-spacing:-.5px}
.title h1 span{display:block;font-size:17px;font-family:"DM Sans";font-weight:500;letter-spacing:.3px;opacity:.85;margin-top:8px}
.title p{margin:0;line-height:1.5;opacity:.92;font-size:15px}
.title ul{margin:0;padding-left:18px;line-height:1.55;font-size:14.5px;opacity:.92}
.big{background:var(--buoy);color:#fff;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 #a9441b}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a9441b}
.small-note{font-size:12px;opacity:.7}
/* hud */
.hud{background:var(--deep);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:5}
.hud-top{display:flex;justify-content:space-between;align-items:baseline}
.hud-day{font-family:"Fraunces";font-size:20px;font-weight:800}
.hud-time{white-space:nowrap;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-sub{font-size:12px;opacity:.75;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.stat b{overflow-wrap:anywhere}
html.fs-xl .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:360px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.08);border-radius:9px;padding:5px 4px 6px;text-align:center}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%}
/* scene */
.scene{position:relative;height:170px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:12px;bottom:10px;background:rgba(251,248,241,.94);border-radius:10px;padding:6px 10px;max-width:80%}
.place h2{font-size:18px}
.place div{font-size:12px;color:var(--mute)}
.alertbar{background:var(--bad);color:#fff;font-size:13px;padding:8px 14px;font-weight:500}
.alertbar.fog{background:#6c7a80}
/* content */
.content{flex:1;padding:12px 14px 90px}
.narr{background:var(--sand);border-left:4px solid var(--fir);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.narr p{margin:0 0 6px}.narr p:last-child{margin:0}
.sect{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink)}
.act:active{background:var(--sand)}
.act .ic{font-size:22px;width:30px;text-align:center;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;font-size:15px}
.act .tx span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.act.primary{border-color:var(--fir);background:#eef4ee}
.act.danger{border-color:#e2b3a7}
.act[disabled]{opacity:.45}
.dest{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dest .dn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dest .dn b{font-size:15px}.dest .dn span{font-size:11.5px;color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}

.tabs .dot{display:inline-block;width:7px;height:7px;background:var(--bad);border-radius:50%;margin-left:3px;vertical-align:top}
/* market */
.mkt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{font-size:22px;width:28px;text-align:center}
.mrow .mi{flex:1;min-width:0}.mrow .mi b{font-size:14.5px;display:block}
.mrow .mi span{font-size:12px;color:var(--mute)}
.mrow .px{font-size:11.5px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.mrow .px b{display:inline;color:var(--ink);font-size:12.5px}
.mbtns{display:flex;gap:6px;align-items:center}
.mbtns button{border:1.5px solid var(--fir);background:#fff;color:var(--fir);border-radius:9px;font-weight:700;font-size:13px;padding:7px 9px;min-width:44px}
.mbtns button.buy{background:var(--fir);color:#fff}
.mbtns button[disabled]{opacity:.35}
.mbtns .own{font-weight:700;font-size:14px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px;text-transform:uppercase;letter-spacing:.3px}
.badge.ok{background:#dcefe2;color:var(--good)}.badge.lim{background:#f8ecd0;color:#8a5d00}.badge.no{background:#f6ddd5;color:var(--bad)}
.news{font-size:13px;background:#eef1f2;border-radius:10px;padding:8px 11px;margin-bottom:8px;line-height:1.4}
/* ferry board */
.board{background:#0f2a32;color:#f4d27a;border-radius:12px;padding:12px;font-variant-numeric:tabular-nums}
.board h3{color:#fff;font-size:16px;margin-bottom:2px}
.board .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.board .colh{font-size:11px;color:#9fc0c8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}

.row .st{font-size:11px}
.st.ok{color:#8fd19e}.st.x{color:#ff8a70}.st.d{color:#f4d27a}.st.p{color:#9fc0c8}

.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}

.todo .pin{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:8px;padding:4px 7px;font-size:13px;color:var(--mute);cursor:pointer}
.prio{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prio .rk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink,#2a3d45);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prio.done .rk{background:var(--line);color:var(--mute)}
.prio .pt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;cursor:pointer}

.prio .pb{display:flex;gap:4px;flex:none}
.prio .pb button,.prio-add button{border:1px solid var(--line);background:none;border-radius:8px;min-width:32px;height:32px;font-size:14px;cursor:pointer;color:inherit}
.prio .pb button:disabled{opacity:.3;cursor:default}
.prio-add{display:flex;gap:6px;margin:8px 0 2px}
.prio-add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
.prio-add button{padding:0 12px;font-weight:700}
.prio-empty{font-size:13px;color:var(--mute);padding:6px 2px}
.log p{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.log p em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12px}
/* event acknowledgement tiles */
#tiles{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);width:calc(100% - 20px);max-width:460px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tile{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fffdf8;border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 8px 24px rgba(8,25,30,.28),0 1px 0 rgba(0,0,0,.05);border-left:6px solid #6b7478;animation:tileIn .32s cubic-bezier(.2,.9,.3,1.2)}

.tile .ti{font-size:26px;width:32px;text-align:center;flex:none}
.tile .tt{flex:1;min-width:0}
.tile .tt small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--mute)}
.tile .tt b{display:block;font-size:15px;line-height:1.25}
.tile .tt span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.tile .ok{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;color:var(--fir);font-weight:700}
.tile.out{animation:tileOut .25s ease-in forwards}
@keyframes tileIn{from{transform:translateY(-16px) scale(.96);opacity:0}}
@keyframes tileOut{to{transform:translateY(-12px);opacity:0;height:0;margin:0;padding-top:0;padding-bottom:0}}
.chip.almc.on{background:var(--fir);color:#fff}
.gear{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;font-size:19px;color:#fff;flex:none}
.title{position:relative}.tgear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;background:rgba(18,49,59,.55);border:0;border-radius:12px;width:44px;height:44px;font-size:21px;z-index:2}
.nm-in{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.nm-in:focus{outline:2px solid var(--fir);border-color:var(--fir)}
/* grouped actions, collapsible destinations, tips, planner */
details.go{margin-top:14px}
.upk-n{color:#c2562a;letter-spacing:.5px}
.act.due{border-left:5px solid #e3642e}.act.due b::after{content:' · due';color:#c2562a;font-size:12px;font-weight:700}html.hc .upk-n{color:#a33}
details.go>summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 2px;display:flex;justify-content:space-between}
details.go>summary::-webkit-details-marker{display:none}
details.go>summary::after{content:'▸ show';letter-spacing:.3px;text-transform:none}
details.go[open]>summary::after{content:'▾ hide'}
.dest.compact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px}
.dest.compact .dn{flex:1 1 150px;display:block}
.dest.compact .dn span{display:block;text-align:left}
.dest.compact .chips{margin-top:0}
.tip{background:#fff5d6;border:1.5px solid #e6c97a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .tb{display:flex;gap:8px;margin-top:8px}
.tip button{border:1.5px solid #c9a24a;background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;color:#6b4e0e}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.plan h3{font-size:16px;margin-bottom:6px}
.plan select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;max-width:100%}
.plan .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:14px}
.plan .res{background:var(--sand);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.55}
.plan .res b{font-variant-numeric:tabular-nums}
.plan .warn{color:#8a5d00}.plan .bad{color:var(--bad)}.plan .ok2{color:var(--good)}
/* accessibility */
html.fs-l{zoom:1.12}html.fs-xl{zoom:1.25}
html.hc{--mute:#2b3336;--line:#7d7462;--paper:#ffffff;--sand:#efe5cc}
html.hc .hud-sub,html.hc .stat small{opacity:1}html.hc .act,html.hc .dest{border-width:2px}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
.today{background:#eef3f4;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.today b{display:block;font-family:Fraunces;font-size:15px;margin-bottom:2px}
/* pinned "Next up" card on the Here tab */
.nextup{display:flex;align-items:flex-start;gap:6px;background:#fff;border:1.5px solid var(--line);border-left:5px solid var(--sound);border-radius:12px;padding:7px 4px 7px 10px;margin-bottom:10px;font-size:14px;line-height:1.4}
.nextup .nu-b{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.nextup .nu-l{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}

.nextup .nu-k{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--sound);font-weight:700;margin-right:4px}
.nextup .nu-p{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mute);font-size:13px}
.nextup .nu-x{flex:none;border:0;background:none;color:var(--mute);font-size:12px;padding:2px 6px;min-width:32px;min-height:28px;border-radius:8px}
.nextup .nu-x:focus-visible,.nextup .nu-b:focus-visible{outline:2px solid var(--fir)}
html.hc .nextup{border-width:2px;border-left-width:5px;border-color:var(--ink);border-left-color:var(--deep)}html.hc .nextup .nu-k{color:var(--deep)}html.hc .nextup .nu-p,html.hc .nextup .nu-x{color:var(--ink)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .mb{font-size:15px;line-height:1.5;margin-bottom:14px}
.modal .mb p{margin:0 0 8px}
.modal .act{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sand);color:var(--ink);margin:0 4px 4px 0}
.tag.bad{background:#f6ddd5;color:var(--bad)}.tag.good{background:#dcefe2;color:var(--good)}
/* crossing */
.cross{position:fixed;inset:0;z-index:30;background:#12313b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cross svg{width:100%;max-width:480px;height:260px}
.cross .cap{font-family:"Fraunces";font-size:22px;margin-top:6px;text-align:center;padding:0 20px}
.cross .cap2{font-size:13px;opacity:.75;margin-top:6px}
.boat{animation:sail 2.6s ease-in-out forwards}
@keyframes sail{from{transform:translateX(0)}to{transform:translateX(300px)}}
.boat.rev{animation-name:sailrev}
@keyframes sailrev{from{transform:translateX(300px)}to{transform:translateX(0)}}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
/* end */
.end{padding:22px 18px 40px}
.end h1{font-size:30px;margin:6px 0 4px}
/* 📖 story mode */
.story-end{margin:14px 0 6px;padding:12px 14px;border-radius:12px;background:#fff;border:1.5px solid var(--line)}
.story-end p{margin:6px 0;font-size:14.5px}
.story-badge{font-weight:700;font-size:13px;letter-spacing:.02em;margin-bottom:6px;opacity:.9}
.story-recap{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--mute)}
.story-when{font-weight:700;font-size:13px;color:var(--mute);margin-bottom:2px}
.story-skip{font-family:Fraunces,serif;font-size:18px;margin:14px 0 4px}
.story-night{font-size:13.5px;border-left:3px solid var(--line);padding-left:10px;margin-bottom:10px}
.story-night p{margin:4px 0}
.story-sum{margin:8px 0}
.grade{font-family:"Fraunces";font-size:58px;font-weight:800;color:var(--buoy);line-height:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
.phbtn{position:relative}
.ph-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#e3642e;color:#fff;font:700 11px/18px system-ui,sans-serif;font-style:normal;padding:0 4px;text-align:center}
.ph-bg{position:fixed;inset:0;z-index:40;background:rgba(10,25,30,.55);display:flex;align-items:flex-end;justify-content:center;padding:10px}
.ph{width:100%;max-width:380px;height:min(88vh,720px);background:#111;border-radius:34px 34px 26px 26px;padding:10px 10px 8px;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.ph-anim{animation:phUp .22s ease-out}html.rm .ph-anim{animation:none}
@keyframes phUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

function tone(f,dur,type,vol,when,slide){const a=audio();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
function sfx(n){if(!prefs().sound)return;try{
  if(n==='horn'){tone(110,1.5,'triangle',0.16);tone(138.6,1.5,'triangle',0.12);tone(220,1.5,'sine',0.04)}
  else if(n==='good'){tone(784,0.18,'sine',0.09);tone(1175,0.28,'sine',0.07,0.12)}
  else if(n==='bad'){tone(233,0.22,'triangle',0.12);tone(175,0.35,'triangle',0.1,0.15)}
  else if(n==='info'){tone(660,0.16,'sine',0.06)}
  else if(n==='ball'){[0,0.09,0.18].forEach(w=>tone(1400,0.04,'square',0.025,w))}
  else if(n==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,0.28,'sine',0.09,i*0.1))}
  else if(n==='tap'){tone(520,0.05,'sine',0.03)}
}catch(e){}}

const NAME_KEY='islandtime.name';
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function profileName(){try{return localStorage.getItem(NAME_KEY)||''}catch(e){return ''}}
function currentName(){return (typeof S!=='undefined'&&S&&S.name)||profileName()||'Islander'}
function withName(t){return typeof t==='string'?t.replace(/\{\{name\}\}/g,esc(currentName())):t}
function cleanName(raw){const n=String(raw||'').replace(/\s+/g,' ').trim();
  if(!n) return {err:'Please enter a name.'};
  if(n.length>20) return {err:'Keep it to 20 characters or fewer.'};
  if(!/^[\p{L}\p{N}][\p{L}\p{N} '’.\-]*$/u.test(n)) return {err:'Letters, numbers, spaces, apostrophes, periods and hyphens only.'};
  return {name:n}}
function setPlayerName(n){
  const old=currentName();
  try{localStorage.setItem(NAME_KEY,n)}catch(e){}
  if(S&&!S.over){S.name=n;if(old!==n)say('✏️ From now on, everyone on the island calls you {{name}}.');saveGame()}
  else{ // on the title screen: update the saved week too, so Continue uses the new name
    const ls=store();if(ls)try{for(const k of slotKeys()){const v=ls.getItem(k);if(!v)continue;const d=JSON.parse(v);if(d&&d.S){d.S.name=n;ls.setItem(k,JSON.stringify(d))}}}catch(e){}
    if(S&&S.over) S.name=n}
}

function genWeek(diffKey,sea){
  const b=[];const r=Math.random;const D=DIFFS[diffKey||(S&&S.diff)||'normal']||DIFFS.normal;sea=sea||seasonId(); // season
  for(let k=0;k<(D.major2&&r()<D.major2?2:1);k++) if(r()<D.major){const day=1+Math.floor(r()*4);const start=day*1440+Math.floor((7+r()*11)*60);
    const durs=[300,480,900,1500,2200];b.push({start,end:start+durs[Math.floor(r()*durs.length)],cause:CAUSES[Math.floor(r()*CAUSES.length)]});}
  for(let d=0;d<7;d++){ if(r()<D.minor){const start=d*1440+Math.floor((d===0?10:6)*60+r()*10*60);
      if(!b.some(x=>start<x.end+120&&start>x.start-240)) b.push({start,end:start+90+Math.floor(r()*150),cause:CAUSES[Math.floor(r()*CAUSES.length)]});}}
  const fog=[];for(let d=0;d<7;d++) fog.push(r()<D.fog*seasonMul('fog',sea)?10+Math.floor(r()*20):0);
  const px=[],news=[];for(let d=0;d<7;d++){const o={};for(const g in GOODS)o[g]={M:0.85+r()*0.3,I:0.8+r()*0.4};px.push(o);news.push(r()<(d===0?0:0.55)?Math.floor(r()*NEWS.length):-1)}
  let storm=null;
  if(r()<D.storm*seasonMul('storm',sea)){const sd=1+Math.floor(r()*5);const st=sd*1440+Math.floor((15+r()*4)*60);storm={day:sd,start:st,end:st+(r()<0.5?960:2280)}; // season
    const ws=st+20;if(!b.some(x=>ws<x.end&&ws+200>x.start)) b.push({start:ws,end:ws+120+Math.floor(r()*120),cause:'high winds (gale warning)'});}
  const wk={b,fog,storm,px,news,bingo:Math.floor(r()*BINGO_FOR.length)};
  return sea==='fall'?wk:seasonWeek(wk,sea,(S&&S.weekNo)||0); // season
}

// ---------------- ferry engine ----------------
function sailing(side,d,dep,mode,knownOnly){
  const abs=d*1440+dep;
  if(d===0&&!ferryHoliday(d)&&FUEL_CANCEL[side].includes(dep)) return {abs,dep,d,cancel:true,reason:'Monday fuel run (hazmat: crew & tanker driver only)',known:true};
  for(const b of S.week.b){
    if(knownOnly&&b.start>S.t) continue;
    if(abs>=b.start&&abs<b.end){
      if(b.end-b.start>=1200&&abs>=b.start+960) return {abs,dep,d,passenger:true,delay:0,reason:'Passenger-only backup boat'};
      return {abs,dep,d,cancel:true,reason:b.cause,b};
    }
  }
  const delay=dep<660?S.week.fog[d]||0:0;
  const sd=seasonDelay(side,d,dep);if(sd)return {abs,dep,d,delay:delay+sd.min,why:sd.why,ketron:KETRON[side].includes(dep)}; // season
  return {abs,dep,d,delay,ketron:KETRON[side].includes(dep)};
}
function findNext(side,mode,knownOnly){
  for(let d=day();d<day()+4;d++) for(const dep of deps(side,d)){
    const s=sailing(side,d,dep,mode,knownOnly);
    if(S.t>s.abs-20) continue;
    if(s.cancel) continue;
    if(s.passenger&&mode==='drive') continue;
    return s;
  }
  return null;
}
function activeOutage(){return S.week.b.find(b=>b.start<=S.t&&S.t<b.end)}
function fullProb(side,d,dep){
  let p=0.05;
  if(d<5){ if(side==='I'&&(dep===380||dep===455)) p=0.35; if(side==='M'&&(dep===1035||dep===1105)) p=0.35;}
  if(d===4&&side==='M'&&dep>=875&&dep<=1175) p=0.55;
  if(d===5&&side==='I'&&dep<=690) p=0.3;
  if(d===6&&side==='M'&&dep>=875) p=0.45;
  p=seasonFull(p,side,d,dep); // season
  // backlog after an outage
  if(S.week.b.some(b=>S.t>=b.end&&S.t<b.end+180)) p=Math.max(p,0.7);
  return Math.min(0.95,p*DF().full);
}
function cargoN(){return Object.values(S.cargo).reduce((a,b)=>a+b,0)}
function canWalkCarry(){return S.carried<=4&&S.carried+cargoN()<=CAP_FOOT}
function capNow(){return carHere()?CAP_CAR:CAP_FOOT}
function contraband(mode){const c=S.cargo;return c.gas>0||c.drugs>0||c.diesel>(mode==='drive'?2:0)}
function taskForce(){const n=S.week.news[day()];return n>=0&&NEWS[n].task}
function price(g,side){
  const d=day(),base=GOODS[g].base[side]*S.week.px[d][g][side];let m=1;
  const n=S.week.news[d];if(n>=0){const e=NEWS[n];if(!e.task&&e.side===side&&e.g===g)m*=e.m}
  if(side==='I'&&activeOutage()&&g!=='drugs') m*=1.5;
  if(side==='I'&&S.week.storm&&S.week.storm.day===d&&(g==='gas'||g==='med')) m*=1.4;
  if(g==='drugs'&&taskForce()) m*=1.25;
  const buy=Math.round(base*m);return {buy,sell:Math.round(buy*0.82)};
}

// what boarding here will cost: the cash fare, or a ride from a ⛴️ Ferry Pass book when that's what board() will use
function fareTxt(mode){const k=mode==='drive'?'car':'walk';
  if(typeof phoneInstalled==='function'&&phoneInstalled('ferrypass')&&phoneCan()){const n=(S.ph&&S.ph.fp&&S.ph.fp[k])||0;if(n>0)return `🎟️ ticket (${n} left)`}
  return $(mode==='drive'?fareCar():(typeof fareWalk==='function'?fareWalk():FARE_WALK))}
function waitFerry(mode){
  if(mode==='drive'){const c=carHere();if(!c||c.fuel<0.1){say('⛽ The tank is empty. The deckhands won’t load a car that can’t drive.');return render()}}
  const side=L[S.loc].side;
  if(mode==='walk'&&!canWalkCarry()){modal('Too much to carry',`<p>On foot you can carry 4 days of groceries and ${CAP_FOOT} items in total. You’ve got ${S.carried} days of groceries and ${cargoN()} trade items.</p><p>Drive on, or lighten the load.</p>`,[{l:'OK',fn:()=>{}}]);return}
  const known=findNext(side,mode,true), actual=findNext(side,mode,false);
  if(!known){say('No sailings in sight. Something is very wrong with the ferry system.');return render()}
  if(known.d>day()){
    if(mode==='drive'){const kw=findNext(side,'walk',true);if(kw&&kw.d===day()&&canWalkCarry())
      return modal('🚗 No more car sailings tonight',`<p>The next boat that takes cars is <b>${DAYS[known.d]} at ${fmt(known.dep)}</b>.</p><p>You can still <b>walk on</b> the ${fmt(kw.dep)}${kw.passenger?' (passenger-only boat)':''}. Your car would stay here.</p>`,[{l:`Walk on the ${fmt(kw.dep)}`,s:side==='M'?'Walk-on fare '+fareTxt('walk'):'Free from the island',fn:()=>waitFerry('walk')},{l:'Not yet',fn:()=>render()}]);}
    const first=S.lastBoatNote!==S.weekNo*7+day();S.lastBoatNote=S.weekNo*7+day();
    if(side==='M'){if(first){say(`The last boat has gone. The next one you could make is ${DAYS[known.d]} at ${fmt(known.dep)}.`);adj('stress',8)}

// ISLAND EVENTS FRAMEWORK (non-ferry life on the island)
// ---------------------------------------------------------------------
// defEvent({id, hook, chance, cond(ctx), run(ctx), priority, cooldown, max})
//   hook      (a hook name, or an array of them)
//             'arrive'    just arrived somewhere (ctx.at, ctx.from; 'ferry' when stepping off the boat)
//             'night'     while going to bed (ctx.where, ctx.notes[] for the night summary)
//             'wake'      start of a day, if you woke up at home
//             'tripStart' before an island trip leaves (can block it with choices)
//             'tripMid'   during an island trip (ctx.add(min), or block and later ctx.finish(extra))
//   chance    number or fn(ctx) -> 0..1, rolled each time the hook runs
//   cond      fn(ctx) -> bool, must be true for the event to fire (even when chained)
//   priority  higher runs first; an event returning {block:true} or {stop:true} ends the hook
//   cooldown  days before it can fire again; max = times per week
// chain(id)   guarantees an event fires the next time its hook runs (if its cond passes):
//             this is how one event sets off others (a power outage -> the alarm doesn't go off).
// =====================================================================

let EV_RUNNING=null;
// Global frequency dial per hook: the chance that a hook call lets ANY event through (one roll per call).
// wake:0.8 means 20% of mornings are event-free; chained events are dropped too. Per-event chances are unchanged.
// Events with noScale:true (announcements like the bingo reminder) are exempt.
const HOOK_SCALE={wake:0.8};
const EV=[];
function defEvent(e){EV.push(Object.assign({chance:0,priority:0,cooldown:0,max:99},e))}
function chain(id,cause){if(!S.ev.force.includes(id))S.ev.force.push(id);S.ev.cause=S.ev.cause||{};S.ev.cause[id]=cause||EV_RUNNING||null}
window.forceEvent=id=>chain(id);
function fireHook(hook,ctx={}){
  ctx.hook=hook;let res=null;const popItems=[];
  const scale=HOOK_SCALE[hook]??1,open=scale>=1||Math.random()<scale; // one roll per hook call
  const list=EV.filter(e=>e.hook===hook||(Array.isArray(e.hook)&&e.hook.includes(hook))).sort((a,b)=>b.priority-a.priority);
  for(const e of list){
    const forced=S.ev.force.includes(e.id);
    if(e.cond&&!e.cond(ctx)) continue;
    if(!open&&!e.noScale){if(forced)S.ev.force=S.ev.force.filter(x=>x!==e.id);continue}
    if(!forced){
      if((S.ev.count[e.id]||0)>=e.max) continue;
      if(S.ev.last[e.id]!=null&&day()-S.ev.last[e.id]<e.cooldown) continue;
      const p=(typeof e.chance==='function'?e.chance(ctx):e.chance)*homeEventMul(e.id);
      if(!(Math.random()<p)) continue;
    } else S.ev.force=S.ev.force.filter(x=>x!==e.id);
    S.ev.last[e.id]=day();S.ev.count[e.id]=(S.ev.count[e.id]||0)+1;S.ev.history.push({id:e.id,t:S.t});
    const nBefore=uiNarr.length,mBefore=MQ.length+(document.getElementById('mbg')?1:0);
    EV_RUNNING=e.id;let r;try{r=e.run(ctx)||{}}finally{EV_RUNNING=null}
    // events that didn't open their own window get an OK pop-up (collected, shown once per hook call)
    if(MQ.length+(document.getElementById('mbg')?1:0)===mBefore) popItems.push({id:e.id,lines:uiNarr.slice(nBefore)});
    eventTile(e,ctx);if(S.ev.cause)delete S.ev.cause[e.id];
    if(r.block||r.stop){res=r;break}
    res=res||r;
  }
  eventPopup(hook,popItems);
  return res;
}

  const rate=gusRate(),book=(pay,how)=>{pay();S.t+=10;phoneTick();const days=sure?1:1+(Math.random()<0.5?1:0);
    UP().jobs.push({k:'gus',due:(day()+days)*1440+(sure?540:600)+Math.floor(Math.random()*(sure?60:120)),sure});
    say(sure?`📱 You call Gus. ${how} “For you? Tomorrow morning. First thing. Well, first-ish.”`:`📱 You call Gus. ${how} “I’ll swing by ${days===1?'tomorrow':'the day after tomorrow'}, late morning. Maybe.” Island time.`);afterAction()};
  modal('🧰 Call Gus, the island handyman',`<p>Gus has fixed half the houses on the island and lives on it, so the ferry doesn’t matter. He’ll do the 3 jobs that need it most.</p>${sure?'<p>💛 <b>First call:</b> you’ve helped enough neighbors that Gus comes tomorrow morning, and he actually shows up.</p>':'<p>He works on island time: tomorrow or the day after, late morning. Probably.</p>'}`,[
    {l:`💵 Cash — $${rate}`,s:rate<90?'The friends rate.':'His going rate.',dis:S.money<rate,fn:()=>book(()=>money(-rate),`$${rate}, cash on arrival. You set it aside.`)},
    {l:'🛢️ 5 gallons of gas from your shed',s:S.homeGas>=5?`You have ${S.homeGas} gal. On this island, gas is better than money.`:'You need 5 gal in the shed.',dis:S.homeGas<5,fn:()=>book(()=>{S.homeGas=Math.round((S.homeGas-5)*10)/10},'You offer 5 gallons of gas. A long pause. “Deal.”')},
    {l:'🥫 2 days of groceries',s:S.pantry>=3?`Pantry: ${S.pantry} days. He takes 2.`:'You need at least 3 days in the pantry.',dis:S.pantry<3,fn:()=>book(()=>{S.pantry-=2},'You offer two days of groceries. “Do you have the good coffee?” You do.')},
    {l:'Never mind',fn:()=>{}}]);
}
function postModal(){
  const ks=upPressing(4);
  const go=k=>postWhenModal(k);
  modal('📣 Post asking for help',`<p>${COMM_NAME[0].toUpperCase()+COMM_NAME.slice(1)}: lost dogs, ferry complaints, free firewood, and neighbors who show up. Replies usually come in a few hours.</p><p style="font-size:13px;color:var(--mute)">Next you pick a day and time for someone to come by. Be home then: standing up a neighbor costs a little reputation. The better known you are for helping others, the better your odds.</p>`,
    ks.map(k=>({l:`${UP_TASKS[k].ic} ${UP_TASKS[k].d}`,s:UP_TASKS[k].sc(UP())>=1?'Due now.':'Coming due.',fn:()=>go(k)}))
      .concat([{l:'🏠 General help around the house',s:'Chores, a tidy-up, a second pair of hands.',fn:()=>go('general')},{l:'Never mind',fn:()=>{}}]));
}
// ---- scheduled help: you pick the day and time; a helper comes then (if anyone answers) ----
const POST_TIMES=[540,780,1020],POST_GRACE=30;   // 9 AM, 1 PM, 5 PM; they wait half an hour
function postOdds(){const fr=Object.keys(S.friends).length;return Math.max(0.05,Math.min(0.75,0.25+0.08*(Math.max(0,S.rep||0)/7.5+fr)+Math.min(0,S.rep||0)/400-0.1*(typeof repEnemies==='function'?repEnemies().length:0)))}
function postSlots(){const out=[],now=S.t,last=S.mode==='month'?day()+2:Math.min(6,day()+2);
  for(let d=day();d<=last;d++)for(const m of POST_TIMES){const at=d*1440+m;if(at>=now+120)out.push(at)}return out.slice(0,6)}
const postWhen=at=>{const d=Math.floor(at/1440);return `${d===day()?'Today':d===day()+1?'Tomorrow':DAYS[d%7]} ${fmt(at%1440)}`};
function postWhenModal(k){const sl=postSlots(),what=k==='general'?'help around the house':UP_TASKS[k].d.toLowerCase();
  if(!sl.length)return modal('📣 No good times left','<p>There’s no time left this week for someone to come by. Post again tomorrow, or next week.</p>',[{l:'OK',fn:()=>{}}]);
  modal('📣 When should they come?',`<p>Pick a time for someone to come by for ${what}. You need to be home: they’ll wait half an hour.</p>`,
    sl.map(at=>({l:postWhen(at),s:at%1440<720?'Morning':at%1440<960?'Afternoon':'Late afternoon',fn:()=>{S.t+=10;phoneTick();COMM().post=dayKey();
      UP().jobs.push({k:'post',due:at+POST_GRACE,at,task:k,sched:true});
      say(`📣 You post in ${COMM_NAME}: “${k==='general'?'Anyone have a couple of hours to help around the house? Will pay in cookies.':`Anyone able to help? ${UP_TASKS[k].d}. I can’t get to it.`} ${postWhen(at)} works for me.” Be home then.`);
      try{showTile('📣','Help scheduled',`${postWhen(at)} at your place. Be home.`,'info')}catch(e){}afterAction()}})).concat([{l:'Never mind',fn:()=>{}}]));
}
// cancel a scheduled visit: free with 2+ hours' notice, reputation −2 if it's last-minute
function postCancel(){const j=upJob('post');if(!j||!j.sched||!phoneCan())return;const late=S.t>=j.at-120;
  UP().jobs=UP().jobs.filter(x=>x!==j);S.t+=5;phoneTick();
  say(`📣 You edit your post: “All set, no need to come by ${postWhen(j.at)}. Thanks everyone!”${late?' Two people were already putting their boots on.':''}`);
  if(late&&typeof repAdd==='function')repAdd(-2,'cancelled on a neighbor at the last minute');afterAction()}
// at the time: home → the usual replies; out → whoever came finds an empty house (if anybody came)
function postArrive(j){
  if(!j.sched||S.loc==='home')return postReplies(j);
  if(Math.random()<postOdds()){adj('stress',2);
    say(`📣 Someone from ${COMM_NAME} drove out at ${fmt((j.at||j.due)%1440)}, knocked, waited half an hour and left. The comment under your post: “Came by. Nobody home. 🤷”`);
    try{showTile('📣','You weren’t home','A neighbor came by to help','bad')}catch(e){}}
  else say(`📣 Nobody answered your help post for ${fmt((j.at||j.due)%1440)}. Just as well: you weren’t home.`)}
function postReplies(j){
  const c=COMM(),p=postOdds(),gen=j.task==='general'||!UP_TASKS[j.task];
  const what=gen?'the chores':'the '+UP_TASKS[j.task].o,home=S.loc==='home';
  const fix=()=>{if(gen){upChoresDone();homeAdj(10)}else upFix([j.task])};
  const tile=(t,s,k)=>showTile('📣',t,s,k);
  if(Math.random()<p){const r=Math.random();
    if(r<0.55){fix();adj('stress',-3);say(`📣 A neighbor from ${COMM_NAME} answers your post and just shows up, gloves on. ${gen?'An hour later the dishes are done, the laundry’s folded and the floors are swept.':`They ${UP_TASKS[j.task].n}.`} They won’t take money. “Next time it’s you.”`);
      tile('A neighbor showed up to help',gen?'Chores done · Home +10':`Done: ${what}`,'good');if(Math.random()<0.4)newNeighbor()}
    else if(r<0.85){fix();if(home)S.t+=45;say(`📣 Nobody can come, but someone in ${COMM_NAME} leaves ${gen?'a carpet cleaner and a box of rags':'exactly the right tool'} on your porch. ${home?`45 minutes later, ${gen?'the house is clean':'it’s done'}.`:`You get to it ${gen?'when you’re home':'later'}.`} Return it clean or you’ll hear about it.`);
      tile('Someone lent you the tool',home?'Done · 45 minutes of your time':`Done: ${what}`,'good')}
    else {fix();adj('stress',2);say(`📣 Twelve replies in four minutes. Three people tag someone named Barb. Two argue about the 2019 ferry schedule. One actually comes over and does ${what}. Your phone won’t stop buzzing.`);
      tile('12 replies at once','One of them actually helped','good')}
  } else {const r=Math.random();
    if(r<0.4){adj('stress',1);say(`📣 Your post in ${COMM_NAME} gets two likes and a thumbs-up emoji. Nobody answers. Everyone must be on the mainland.`);tile('Nobody answered','Two likes, though','info')}
    else if(r<0.75){adj('stress',4);say(`📣 Your post turns into a 41-comment thread about the “right” way to do ${what}. Someone says it was better in the ’80s. Nobody offers to help.`);tile('A know-it-all comment thread','Stress +4 · nothing fixed','bad')}
    else {say(`📣 The only reply is a DM: “Hi neighbor! Have you heard about gutter guards? 🙂 Financing available.” It’s a guy from Puyallup.`);tile('Someone tried to sell you something','Nothing fixed','info')}
  }
}
function helpActions(a,d,m){
  const c=COMM(),dk=dayKey(),phoneOK=S.phone>0,gj=upJob('gus');
  a.push({cat:'yard',ic:'🧰',l:gj?'Gus is coming (probably)':'Call Gus from your 📱 phone (Phone → Island numbers)',due:false,s:gj?`He said ${fmtAbs(gj.due)}. Ish. He lives here, so the ferry can’t stop him.`:!phoneOK?'Your phone is dead.':`The island handyman fixes the 3 most pressing jobs. $${gusRate()} cash, 5 gal of gas, or 2 days of groceries.`,
    dis:true,fn:gusModal});
  const ok=m>=480&&m<1140;
  a.push({cat:'here',ic:'🤲',l:c.help===dk?'Helped a neighbor today ✓':'Help a neighbor from the community group',s:c.help===dk?`Island reputation: ${S.rep||0}.`:!ok?'People ask for help between 8 AM and 7 PM.':`1 hour. Someone always needs a hand. Island reputation: ${S.rep||0}. Stress −2.`,
    dis:c.help===dk||!ok,fn:()=>{S.t+=60;c.help=dk;repAdd(5,'helped a neighbor from the community group');adj('stress',-2);
      say(pick(['🤲 You help a guy from the group haul a chest freezer up his porch steps. He thanks you three times.','🤲 You spend an hour helping someone near Lake Josephine find their escaped chickens. You find four of five.','🤲 You hold a ladder while a neighbor clears her gutters, and hear the whole history of her septic system.','🤲 You drive a bag of groceries to an older neighbor who can’t make the ferry this week. She sends you home with jam.']));
      if(Math.random()<0.15)newNeighbor('you helped them out');afterAction()}});
}

// A friendly island fixture in flannel pajama pants and slippers, whatever the weather. Knows everything about the boat.
const FRED_SPOTS={aiDock:'In the ferry line',store:'By the bulletin board outside the old store',food:'Out front of the Riv'};
function fredTip(){
  const soon=S.week.b.find(b=>b.start>S.t&&b.start<S.t+1440);
  if(soon&&(flv('fred')>=2||Math.random()<0.8)) return say(`🩴 Fred leans in: “Buddy of mine on the deck crew says there’s a ${soon.cause.split(' (')[0]} problem brewing. If I were you, I’d catch an early boat ${Math.floor(soon.start/1440)===day()?'today':'tomorrow'}.”`);
  say('🩴 Fred: “'+pick(['The 5:50 out of Steilacoom is never full. Nobody wants to be up that early.','Friday after three? Forget about driving on. Walk on or don’t go.','When the boat’s down, the fella with the sailboat runs people across. Tip him in diesel.','Sunday night everybody comes home at once. Plan around it.','Fog burns off by eleven. Usually. Mostly.'])+'”');
}
defEvent({id:'pajama_fred',hook:['arrive','bingo'],priority:2,max:3,cooldown:1,
  cond:ctx=>{const m=tod();if(m<360||m>=1320)return false;return ctx.hook==='bingo'?ctx.stage==='between':!!FRED_SPOTS[ctx.at]},
  chance:ctx=>ctx.hook==='bingo'?0.12:(S.friends.fred?0.09:0.06),
  run(ctx){
    const done=()=>{if(ctx.cont)ctx.cont()};
    const where=ctx.hook==='bingo'?'Between games, out on the Riv’s porch':FRED_SPOTS[ctx.at];
    const friend=!!S.friends.fred;
    const btns=[];
    if(S.cigs>0) btns.push({l:'Give him a cigarette',s:`You have ${S.cigs} left.`,fn:()=>{S.cigs--;adj('stress',-2);
      if(!meet('fred','Pajama Fred','you gave him a cigarette'))say('🩴 “You’re a good egg.” Fred tucks it behind his ear for later.');
      fredTip();done()}});
    btns.push({l:S.cigs>0?'“Not today, Fred”':friend?'“Sorry, Fred, I’m out”':'“Sorry, I don’t smoke”',s:S.cigs>0?'Keep the pack for yourself.':friend?'He’s used to it.':'Fair enough.',fn:()=>{
      if(friend||Math.random()<0.25){say('🩴 “No worries, no worries.” He lingers to chat anyway.');fredTip()}
      else say('🩴 “No worries! Have a good one.” He shuffles off in his slippers.');
      done()}});
    btns.push({l:'Give him a couple bucks instead',s:'$2',dis:S.money<2,fn:()=>{money(-2);adj('stress',-2);
      if(Math.random()<0.5&&meet('fred','Pajama Fred','you spotted him a couple bucks'));else say('🩴 “Hey, thanks. Appreciate you.”');
      fredTip();done()}});
    modal('🩴 Pajama Fred',`<p>${where}, a guy in flannel pajama pants, slippers and a rain jacket gives you a little wave. ${friend?'It’s your pal Fred.':'Everybody on the island seems to know him.'}</p><p>“Hey${friend?', {{name}}':''}! You wouldn’t happen to have a cigarette, would you?”</p>`,btns);
    return ctx.hook==='bingo'?{block:true}:{stop:true};
  }});

  else if(m<=to) acts.forEach(x=>a.push(Object.assign({cat:'here'},x)));

// friend story arcs: 3 beats each, S.arcs[id] = {b: beats done, k: dayKey of the last beat, h: times you helped}
// beat 1: once you know them (a day later); beat 2: good friend or week 3; beat 3: close friend or week 4. At least 2 days apart, one arc beat a day.
function arcReady(id){
  const A=S.arcs[id],f=S.friends[id];if(!A||!f||A.b>=3) return false;
  if(S.arcs.day===dayKey()||dayKey()-A.k<2) return false;
  if(A.b===0) return f.day!==day()||S.weekNo>0;
  if(A.b===1) return flv(id)>=2||S.weekNo>=2;
  return flv(id)>=3||S.weekNo>=3;
}
function arcBeat(id){const A=S.arcs[id];A.b++;A.k=dayKey();S.arcs.day=dayKey();return A}

function bingoCard(){const cols=[];for(let c=0;c<5;c++){const pool=[];for(let n=c*15+1;n<=c*15+15;n++)pool.push(n);const col=[];for(let i=0;i<5;i++)col.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);cols.push(col)}cols[2][2]=0;return cols}
function hasLine(card,called){const m=(c,r)=>card[c][r]===0||called.has(card[c][r]);
  for(let i=0;i<5;i++){let row=true,col=true;for(let j=0;j<5;j++){if(!m(j,i))row=false;if(!m(i,j))col=false}if(row||col)return true}
  let a=true,b=true;for(let i=0;i<5;i++){if(!m(i,i))a=false;if(!m(i,4-i))b=false}return a||b}
function bingoGame(mine,others){
  const balls=[...Array(75)].map((_,i)=>i+1);for(let i=74;i>0;i--){const j=Math.floor(Math.random()*(i+1));[balls[i],balls[j]]=[balls[j],balls[i]]}
  const called=new Set();
  for(const b of balls){called.add(b);const w=mine.filter(c=>hasLine(c,called));const t=others.filter(c=>hasLine(c,called)).length;if(w.length||t)return {called,ball:b,winners:w,others:t}}
}
const ballName=n=>'BINGO'[Math.floor((n-1)/15)]+'-'+n;
function cardHTML(card,called){
  let h='<table style="border-collapse:collapse;margin:6px auto 10px;font-variant-numeric:tabular-nums"><tr>'+[...'BINGO'].map(L=>`<th style="width:42px;height:28px;background:var(--sound);color:#fff;font-family:Fraunces">${L}</th>`).join('')+'</tr>';
  for(let r=0;r<5;r++){h+='<tr>';for(let c=0;c<5;c++){const n=card[c][r],hit=n===0||called.has(n);
    h+=`<td style="width:42px;height:38px;text-align:center;border:1px solid var(--line);font-weight:700;${hit?'background:#e3642e;color:#fff;border-radius:50%':''}">${n===0?'★':n}</td>`}h+='</tr>'}
  return h+'</table>';
}
const BINGO_GAMES=[{n:'Regular',pot:40},{n:'Regular',pot:40},{n:'Early Bird Special',pot:50},{n:'The Big One',pot:100}];
function playBingo(cards,price){
  if(S.friends.walt)friendPts('walt',1);if(S.friends.rusty)friendPts('rusty',1);
  money(-price);S.bingo.nights++;S.bingo.cards+=cards;S.bingo.donated+=Math.round(price*0.5);
  S.t=Math.max(S.t,day()*1440+1080);
  const free=S.friends.walt&&!S.ev.flags.waltCard?1:0;if(free)S.ev.flags.waltCard=1;
  const mine=[...Array(cards+free)].map(bingoCard);const others=[...Array(34)].map(bingoCard);
  const crowd=Math.round(34*12/3+price);
  let gi=0,won=0;
  S.bingo.order=null;S.bingo.delay=0;S.bingo.comped=0;S.bingo.playing=day();
  // the 'bingo' hook: stage 'start' (before game 1) and 'between' (after games 1-3)
  const between=(stage,cont)=>{const r=fireHook('bingo',{stage,game:gi,cont});if(!(r&&r.block))cont()};
  const order=(what,cost)=>{money(-cost);S.bingo.order=what;S.bingo.orderCost=cost;if(what==='both')S.ateOut=day();
    if(what)say(what==='both'?'🍔 You order a burger and a beer from the Riv’s kitchen.':'🍺 You order a drink.');
    between('start',next)};
  const next=()=>{
    if(gi>=BINGO_GAMES.length){
      S.t=day()*1440+1080+150+S.bingo.delay;adj('stress',-14);if(S.friends.sam)adj('stress',-4);
      S.bingo.won+=won;S.bingo.playing=-1;S.ev.history.push({id:'bingo',t:S.t});
      const raised=crowd+Math.round(Math.random()*120);
      say(`🎱 Bingo night ${won?`paid off: you won <b>${$(won)}</b>`:'was a bust, but a fun one'}. The Legion raised about ${$(raised)} for the ${BINGO_FOR[S.week.bingo]}.`);
      return modal('🎱 That’s a wrap',`<p>${won?`You walk out <b>${$(won)}</b> richer.`:'No wins tonight.'} The American Legion announces tonight raised about <b>${$(raised)}</b> for the <b>${BINGO_FOR[S.week.bingo]}</b>.</p><p>${S.friends.walt?'Walt':'Someone'} is already stacking chairs. ${S.friends.sam?'Sam drives you home.':'You know half the room by name now.'}</p>`,(won?[{l:`Donate your ${$(won)} to the ${BINGO_FOR[S.week.bingo]}`,s:'The room cheers. Island reputation +5.',fn:()=>{money(-won);S.bingo.won-=won;S.bingo.donated+=won;say(`🎱 You hand your ${$(won)} back to the Legion for the ${BINGO_FOR[S.week.bingo]}. Walt salutes.`);repAdd(5,'donated your bingo winnings');afterAction()}}]:[]).concat([{l:won?'Keep it and head home':'Head home',fn:()=>{afterAction()}}]));
    }
    const g=BINGO_GAMES[gi++],res=bingoGame(mine,others);sfx(res.winners.length?'win':'ball');const n=res.winners.length+res.others;
    let prize=0,msg;
    if(res.winners.length){prize=Math.round(g.pot*res.winners.length/n);won+=prize;money(prize);msg=`<b style="color:var(--good);font-size:20px">BINGO!</b> You win ${$(prize)}${n>1?` (split ${n} ways)`:''}.`;buzz([60,40,60,40,200])}
    else msg=pick(['A woman two tables over yells BINGO. So close.','“BINGO!” from the back. The room groans.','A kid at the Booster Club table wins it. Everyone claps.','You needed one more. Of course you did.']);
    const show=res.winners[0]||mine.slice().sort((a,b)=>[...b.flat()].filter(x=>res.called.has(x)).length-[...a.flat()].filter(x=>res.called.has(x)).length)[0];
    modal(`🎱 Game ${gi} of ${BINGO_GAMES.length}: ${g.n} · ${$(g.pot)} pot`,`<p style="text-align:center;margin:0">Last ball: <b style="font-size:20px">${ballName(res.ball)}</b> · ${res.called.size} called</p>${cardHTML(show,res.called)}<p style="text-align:center">${msg}</p><p style="font-size:12px;color:var(--mute);text-align:center">You have ${mine.length} card${mine.length>1?'s':''}${free?' (one courtesy of Walt)':''}. About ${others.length} other cards in play.</p>`,
      [{l:gi<BINGO_GAMES.length?'Next game':'Finish the night',fn:()=>gi<BINGO_GAMES.length?between('between',next):next()}]);
  };
  const reserved=S.bingo.reserved===day();
  modal('🎱 Bingo at the Riv',`<p>The room is packed: Legion volunteers selling cards, the Booster Club running the 50/50, and a line at the bar.${reserved?' Your reserved table has a little paper RESERVED tent on it.':''}</p><p>Order anything before the first game? Dinner counts as tonight’s food.</p>`,[
    {l:'Dinner and a drink: $24',s:S.ateOut===day()?'You already ate, but sure.':'Counts as tonight’s food.',fn:()=>order('both',24)},
    {l:'Just a drink: $6',fn:()=>order('drink',6)},
    {l:'Nothing, thanks',fn:()=>order(null,0)}]);
}

function travelOpts(dest){
  const base=dist(S.loc,dest), side=L[S.loc].side, car=carHere(), o=[];
  const inj=S.injury&&!S.injury.treated?1.5:1;
  const fueled=car&&car.fuel>=base*FUEL_RATE;
  if(fueled) o.push({m:'car',l:`🚗 ${base} min`,min:base});
  else if(car) o.push({m:'car',l:'🚗 Out of gas',dis:true});
  if(side==='I'){
    if(S.friends.sam&&S.loc==='home'&&dest==='aiDock'&&S.ev.flags.samRide===day()) o.unshift({m:'friend',l:`🤝 Ride with Sam ${base} min`,min:base});
    if(!fueled){o.push({m:'walk',l:`🚶 ${Math.round(base*4*inj)} min`,min:Math.round(base*4*inj),dis:!canWalkCarry()});
      o.push({m:'hitch',l:'👍 Hitch a ride',min:base+15,dis:!canWalkCarry()});}
  } else if(!fueled){
    const c=Math.round(8+base*0.8);
    o.push({m:'ride',l:S.phone>0?`📱 Rideshare ${base+8}m · $${c}`:'📵 Rideshare (phone dead)',min:base+8,cost:c,dis:S.phone<=0});
    o.push({m:'walk',l:`🚶 ${Math.round(base*5*inj)} min`,min:Math.round(base*5*inj),dis:!canWalkCarry()});
    if(tod()<1260) o.push({m:'bus',l:`🚌 Bus ${Math.round(base*2.5+10)}m · $2.75`,min:Math.round(base*2.5+10),cost:2.75,dis:!canWalkCarry()});
  }
  return o;
}
function go(dest,o){
  const car=carHere(),from=S.loc,island=L[from].side==='I';
  if(island&&!o.started&&!o.midDone){const r=fireHook('tripStart',{from,to:dest,mode:o.m,o,car});if(r&&r.block){render();return}}
  let min=o.min;
  if(o.m==='friend'&&!o.midDone&&S.ev.flags.samRide!==day()&&Math.random()<0.2){S.ev.flags.samNo=day();S.t+=5;say('📱 Sam texts back: “Already on the boat, sorry!” You’re on your own.');return afterAction()}
  if(o.m==='friend'&&!o.midDone){S.ev.flags.samRide=-1;say('🤝 Sam drives you down to the landing, talking the whole way about their chickens.');adj('stress',-3);}
  if(o.m==='hitch'&&!o.midDone){S.t+=15;if(Math.random()<0.45){adj('stress',4);say('You stand by the road with your thumb out. Two cars pass. Both wave. Neither stops.');return afterAction()}
    say('A neighbor in a pickup with a dog in the back stops. “Hop in.” Island rules.');min=dist(S.loc,dest);adj('stress',-3);}
  if(o.cost) money(-o.cost);
  if((o.m==='car'||o.m==='ride')&&L[S.loc].side==='M'){const m=tod();if(((m>=420&&m<=540)||(m>=960&&m<=1110))&&Math.random()<0.3){min+=15;say('I-5 near JBLM is a parking lot. Of course it is.');adj('stress',4)}}
  if(island&&!o.midDone){let extra=0;
    const r=fireHook('tripMid',{from,to:dest,mode:o.m,o,car:o.m==='car'?car:null,add:n=>{extra+=n},finish:n=>{go(dest,Object.assign({},o,{min:min+extra+(n||0),midDone:true,started:true,cost:0}))}});
    if(r&&r.block){render();return}
    min+=extra;}
  S.t+=min;
  if(o.m==='car'||o.m==='friend'||o.m==='ride'){phoneTick();S.phone=Math.min(100,S.phone+Math.round(min*0.8))}
  if(car&&o.m==='car'){car.loc=dest;car.fuel=Math.max(0,Math.round((car.fuel-min*FUEL_RATE)*10)/10);if(car.fuel<1.5&&car.fuel>0)say(`⛽ The low-fuel light is on in the ${car.name.split(' (')[0].toLowerCase()}. ${car.fuel} gallons left.`);if(car.fuel===0)say('⛽ The engine coughs and dies as you pull in. Totally empty.');}
  S.loc=dest;
  if(car&&car.id==='beat'&&dest==='stDock'&&Math.random()<0.25){S.t+=10;say('The terminal lot is full. You park way up the hill and hike down.');}
  if(dest==='home'&&S.carried>0){S.pantry+=S.carried;say(`You unload ${S.carried} day${S.carried>1?'s':''} of groceries into the pantry.`);S.carried=0;}
  if(dest==='home') stash();
  if(dest==='home'&&S.gen&&S.gen!=='home'&&car&&o.m==='car'&&car.id===S.gen){S.gen='home';say('🔌 You wrestle the generator into the shed and run a cord to the house. If the power goes out, you’re ready, as long as there’s gas stashed.');showTile('🔌','Generator installed','Keep gas in the shed for outages','good')}
  if(o.m==='walk') say(`You walk to ${L[dest].name}. It takes ${min} minutes.`);
  fireHook('arrive',{at:dest,from});
  afterAction();
}

function processTimed(){

  for(const j of UP().jobs.slice()){
    if(S.t<j.due) continue;
    const out=!(UP_JOBS[j.k]||{}).island&&S.week.b.find(b=>j.due>=b.start&&j.due<b.end); // island jobs (Gus, the community group) don’t ride the ferry
    if(out){j.due=out.end+90;if(!j.warned){j.warned=true;say(`🚚 The ${UP_JOBS[j.k].who} is stuck in Steilacoom. The ferry’s down. They’ll come over when it’s running.`)}continue}

  }
  const dl=S.delivery;
  if(dl&&S.t>=dl.due){

// ---------------- save / app shell ----------------
const SAVE_KEY='islandtime.save', LEGACY_KEYS=['islandtime.save.v2','islandtime.save.v1'], BEST_KEY='islandtime.best';
let saveNotice='';
function store(){try{return window.localStorage}catch(e){return null}}
// Three save slots. Slot 1 is the original key (plus its legacy mirrors); slots 2 and 3 have their own keys.
const SLOT_KEY='islandtime.slot', SLOT_N=3;
function curSlot(){let n=1;try{n=parseInt(localStorage.getItem(SLOT_KEY)||'1',10)}catch(e){}return n>=1&&n<=SLOT_N?n:1}
function setSlot(n){try{localStorage.setItem(SLOT_KEY,String(n))}catch(e){}}
function slotKeys(n){n=n||curSlot();return n===1?[SAVE_KEY,...LEGACY_KEYS]:['islandtime.save.slot'+n]}
function packSave(){return {schema:SAVE_SCHEMA,app:APP_VERSION,S,uiNarr,tab,at:Date.now()}}
// The save is mirrored under the older key names so an older copy of the game (old install, cached phone app) still finds it.
function saveGame(){const ls=store();if(!ls||!S)return;const keys=slotKeys();
  try{if(S.over)keys.forEach(k=>ls.removeItem(k));else{const v=JSON.stringify(packSave());keys.forEach(k=>{try{ls.setItem(k,v)}catch(e){}})}}catch(e){}}
// Fill in anything an older (or newer) save is missing, without touching what it has.
function fillDefaults(obj,def){
  for(const k in def){
    if(obj[k]===undefined||obj[k]===null&&def[k]!==null&&typeof def[k]==='object'&&!Array.isArray(def[k])) obj[k]=JSON.parse(JSON.stringify(def[k]));
    else if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])&&obj[k]&&typeof obj[k]==='object') fillDefaults(obj[k],def[k]);
  }
  return obj;
}
const num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d;
// numeric dotted version compare: >0 when a is newer than b ('1.10.0' > '1.9.2')
const verCmp=(a,b)=>{const p=v=>String(v||'').split('.').map(n=>parseInt(n,10)||0),x=p(a),y=p(b);for(let i=0;i<Math.max(x.length,y.length);i++){const k=(x[i]||0)-(y[i]||0);if(k)return k}return 0};
let newerWarned='';
function migrate(d){
  if(!d||typeof d!=='object'||!d.S||typeof d.S!=='object') throw new Error('not an Island Time save');
  const from=d.schema||(d.S.cargo?2:1), x=d.S, notes=[];
  // v1 (game 1.1): loose gas/diesel cans instead of trade cargo
  if(from<2){
    x.cargo=x.cargo||{food:0,med:0,gas:0,diesel:0,drugs:0};
    if(x.canGal>0){x.cargo.gas+=Math.max(1,Math.round(x.canGal/5));notes.push('your gas can moved into trade cargo')}
    if(x.dieselCans>0){x.cargo.diesel+=Math.max(1,Math.round(x.dieselCans/5));notes.push('your diesel cans moved into trade cargo')}
    delete x.canGal;delete x.dieselCans;
  }
  fillDefaults(x,baseState());
  // 1.15: reputation went from 0..~10 to −100..+100
  if(from<7&&typeof x.rep==='number'&&x.rep>0){x.rep=Math.min(100,Math.round(x.rep*7.5));notes.push('island reputation moved to the new −100 to +100 scale')}
  if(from<7&&x.eco&&x.eco.perks){const P=x.eco.perks,M={3:20,5:35,8:60};for(const k in M)if(P[k]){P[M[k]]=true;delete P[k]}}
  // 1.4.2 -> 1.4.3: Pajama Mike was renamed Pajama Fred
  if(x.friends&&x.friends.mike){x.friends.fred=Object.assign(x.friends.mike,{name:'Pajama Fred'});delete x.friends.mike}
  if(x.ev){for(const k of ['count','last'])if(x.ev[k]&&x.ev[k].pajama_mike!=null){x.ev[k].pajama_fred=x.ev[k].pajama_mike;delete x.ev[k].pajama_mike}
    if(Array.isArray(x.ev.history))x.ev.history.forEach(h=>{if(h.id==='pajama_mike')h.id='pajama_fred'});
    if(Array.isArray(x.ev.force))x.ev.force=x.ev.force.map(i=>i==='pajama_mike'?'pajama_fred':i)}
  if(Array.isArray(x.log))x.log.forEach(e=>{if(typeof e.s==='string')e.s=e.s.replace(/Pajama Mike/g,'Pajama Fred').replace(/\bMike\b/g,'Fred')});
  if(Array.isArray(d.uiNarr))d.uiNarr=d.uiNarr.map(t=>typeof t==='string'?t.replace(/Pajama Mike/g,'Pajama Fred').replace(/\bMike\b/g,'Fred'):t);
  // core fields must be sane numbers
  x.t=num(x.t,330);x.cur=num(x.cur,Math.floor(x.t/1440));x.cur=Math.max(0,Math.min(6,x.cur));
  for(const k of ['money','pantry','carried','health','stress','job']) x[k]=num(x[k],baseState()[k]);
  if(!L[x.loc]){notes.push('a place from another version doesn’t exist here, so you’re back home');x.loc='home';}
  // cars
  if(!Array.isArray(x.cars)||!x.cars.length) x.cars=baseState().cars;
  if(x.phoneT<x.cur*1440)x.phoneT=x.t;
  // 1.7.0: one alarm {time,type} became two independent alarms
  if(x.alarm&&x.alarm.type){const t=num(x.alarm.time,330),ty=x.alarm.type;x.alarm={plug:{on:ty==='plug',time:t},phone:{on:ty==='phone',time:t}}}
  // before 1.5.0 every player had a generator at home; keep it
  if(from<5&&x.gen==null){x.gen='home';notes.push('you keep the generator you already had at home')}
  for(const id in x.friends){const f=x.friends[id];f.lvl=f.lvl||1;f.pts=f.pts||0}
  x.cars.forEach(c=>{c.tank=num(c.tank,c.diesel?20:c.id==='beat'?12:14);c.fuel=num(c.fuel,Math.min(8,c.tank));c.diesel=!!c.diesel;if(!L[c.loc])c.loc=L[x.loc].side==='I'?'home':'stDock';c.name=c.name||'Car'});
  // cargo: unknown goods from a newer version are kept but ignored
  for(const g in GOODS) x.cargo[g]=Math.max(0,num(x.cargo[g],0));
  // week: regenerate whatever is missing
  if(!DIFFS[x.diff])x.diff='normal';
  if(!seasonOk(x.season))x.season='fall'; // season
  const w=x.week&&typeof x.week==='object'?x.week:{}, fresh=genWeek(x.diff,x.season); // season
  if(!Array.isArray(w.b)) w.b=fresh.b;
  if(!Array.isArray(w.fog)) w.fog=fresh.fog;
  if(w.storm===undefined) w.storm=null;
  if(!Array.isArray(w.px)||w.px.length<7) w.px=fresh.px;
  w.px.forEach((o,i)=>{for(const g in GOODS) if(!o[g]) o[g]=fresh.px[i][g]});
  if(!Array.isArray(w.news)) w.news=fresh.news.map((n,i)=>i<x.cur?-1:n);
  if(typeof w.bingo!=='number'||!BINGO_FOR[w.bingo]) w.bingo=fresh.bingo;
  if(!Array.isArray(x.ev.force)) x.ev.force=[];
  w.news=w.news.map(n=>typeof n==='number'&&n<NEWS.length?n:-1);
  x.week=w;
  const newer=typeof d.app==='string'&&verCmp(d.app,APP_VERSION)>0?d.app:null;
  if(from>SAVE_SCHEMA&&!newer) notes.push(`this save is from a newer version (${d.app||'unknown'}). Anything this version doesn’t know about is kept but ignored`);
  else if(from<SAVE_SCHEMA) notes.push(`upgraded from an older version${d.app?' ('+d.app+')':''}`);
  return {schema:Math.max(from,SAVE_SCHEMA),app:d.app,S:x,uiNarr:Array.isArray(d.uiNarr)?d.uiNarr:[],tab:['act','ferry','todo','log'].includes(d.tab)?d.tab:'act',at:d.at,notes,newer};
}
function rawSave(n){const ls=store();if(!ls)return null;
  let best=null;
  for(const k of slotKeys(n)){const v=ls.getItem(k);if(!v)continue;let at=0;try{at=JSON.parse(v).at||0}catch(e){}
    if(!best||at>best.at)best={k,v,at}}
  return best}
function loadSave(n){
  const r=rawSave(n);if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));return d.S.over?null:d}
  catch(e){try{const ls=store(),sn=n||curSlot();ls.setItem('islandtime.save.broken'+(sn>1?'.slot'+sn:''),r.v);slotKeys(sn).forEach(k=>ls.removeItem(k))}catch(_){}
    saveNotice='Your saved game couldn’t be read, so it was set aside. Start a new week.';return null}
}
function adopt(d){
  S=d.S;uiNarr=d.uiNarr;tab=d.tab;
  render();
  if(d.newer&&newerWarned!==d.newer){newerWarned=d.newer;modal('⚠️ Save from a newer version',`<p>This save is from Island Time ${esc(d.newer)}, newer than this copy (${APP_VERSION}). Update the game to keep everything: whatever this copy doesn’t know about is ignored, and may be lost once you keep playing here.</p>`,[{l:'Continue anyway',fn:()=>{}}])}
  if(d.notes&&d.notes.length) modal('Save loaded',`<p>Welcome back. Note: ${d.notes.join('; ')}.</p>`,[{l:'Continue',fn:()=>{}}]);
  if(S.t>=day()*1440+1410&&L[S.loc].side==='M') strandedModal();
}
function resumeGame(){const d=loadSave();if(!d)return titleScreen();
  try{adopt(d)}catch(e){saveNotice='That save couldn’t be loaded in this version.';titleScreen()}}

function nextUp(acts){

    const t=here?`${ic} You’re here. ${what} at <b>${fmt(at)}</b>`:m>at?`${ic} Running late: get to ${L[to].name} (${what.toLowerCase()} ${fmt(at)})`:`${ic} Be at ${L[to].name} by <b>${fmt(at)}</b>`;

  if(J&&J.days.includes(d)&&!S.worked[d]&&jobStarted(d)&&m<J.start+240) return meet('💼',J.loc,J.start,'Shift');
  // (b) interview today
  const I=S.interview;
  if(I&&I.day===d&&m<=I.time+20) return meet('📝',I.loc,I.time,'Interview');

  if(apptActive()&&d===APPT_DAY&&!S.appt&&!S.apptMissed&&m<=885) return meet('🩺','clinic',870,'Appointment');

  const dueHere=S.loc==='home'&&acts.some(a=>a.due&&!a.dis); // at home, the specific chore (f) beats the general upkeep item
  const u=todoItems().find(x=>x.urgent&&!x.ok&&!x.fail&&!/^Work:|^Interview:/.test(x.l)&&!(dueHere&&x.l==='House & yard upkeep'));
  if(u) return {t:`⚠️ <b>${u.l}</b> · ${u.s}`,go:()=>setTab('todo')};

  if(S.loc==='home'&&m>=1260) return {t:`🛏️ Go to bed · alarm: ${alarmTxt()}`,go:()=>nextScroll('.sect,details.upk>summary',ACT_CATS.phone)};

  MB=btns;
  const el=document.createElement('div');el.className='modal-bg';el.id='mbg';
  el.innerHTML=withName(`<div class="modal"><h2>${title}</h2><div class="mb">${body}</div>${btns.map((b,i)=>`<button class="act ${i===0&&!b.dis?'primary':''}" ${b.dis?'disabled':''} onclick="MBTN(${i})"><span class="tx"><b>${b.l}</b>${b.s?'<span>'+b.s+'</span>':''}</span></button>`).join('')}</div>`);
  document.body.appendChild(el);
}
window.MBTN=i=>{if(MB[i]&&MB[i].dis)return;const el=document.getElementById('mbg');el&&el.remove();const f=MB[i]&&MB[i].fn;f&&f();
  if(!document.getElementById('mbg')&&MQ.length&&S&&!S.over){const q=MQ.shift();modal(...q)}
  if(S&&!S.over&&!document.querySelector('.title,.end'))render()};
function crossing(side,cap,cap2,done,sail){
  const el=document.createElement('div');el.className='cross';sfx(sail?'info':'horn');
  const rev=side==='M';
  const boat=sail?`<g><path d="M0 40 h70 l-10 14 h-50 z" fill="#f4f1ea"/><path d="M34 38 V-30 L70 34 Z" fill="#fff"/><path d="M32 36 V-10 L6 34 Z" fill="#e3e0d6"/></g>`
    :`<g><rect x="0" y="20" width="120" height="20" rx="4" fill="#f4f1ea"/><rect x="0" y="34" width="120" height="8" fill="#2f5d4a"/><rect x="42" y="4" width="36" height="17" fill="#f4f1ea"/><rect x="46" y="8" width="28" height="6" fill="#2a3d45"/><rect x="56" y="-8" width="7" height="12" fill="#e3642e"/></g>`;
  el.innerHTML=`<svg viewBox="0 0 480 260"><rect width="480" height="260" fill="#12313b"/><rect y="150" width="480" height="110" fill="#1d4b5a"/>
   <path d="M0 150 q40 -30 90 -20 l20 20z" fill="#2f5d4a"/><path d="M380 150 q50 -40 100 -25 v25z" fill="#2f5d4a"/>
   <text x="20" y="180" fill="#9fc0c8" font-size="12" font-family="DM Sans">${rev?'Anderson Is.':'Anderson Is.'}</text><text x="460" y="180" text-anchor="end" fill="#9fc0c8" font-size="12" font-family="DM Sans">${rev?'Steilacoom':'Steilacoom'}</text>
   <g transform="translate(40,${sail?100:110})"><g class="boat ${rev?'rev':''}"><g class="bob">${boat}</g></g></g>
   <path d="M0 200 h480 M0 222 h480" stroke="#fff" stroke-opacity=".08"/></svg>
   <div class="cap">${cap}</div><div class="cap2">${cap2}</div><div class="cap2" style="margin-top:18px">tap to skip</div>`;
  document.body.appendChild(el);
  let fin=false;const end=()=>{if(fin)return;fin=true;el.remove();done()};
  el.onclick=end;setTimeout(end,prefs().rm?900:2900);
}

// ---------------- endings ----------------
function homeScore(){const h=S.home??70;return Math.round((h-50)*2)+(h>=HOME_HIGH?100:0)}
function scoreOf(){
  const s=S.stats;
  const cargoVal=Object.keys(GOODS).reduce((a,g)=>a+S.cargo[g]*price(g,'M').sell,0);
  const mult=DF().score;
  const bonus=Object.values(S.friends).reduce((a,f)=>a+40+20*(f.lvl||1),0)+S.bingo.won+S.bingo.donated+cargoVal-S.drugCharges*300-S.citations*200+(s.stranded===0?150:0)+(S.appt?100:0)+(S.rx?60:0)+((S.stats.workdays||0)*40)+homeScore();
  return Math.round((S.money+(S.emp?S.job*4:-150)+S.health*4-S.stress*3+bonus+Math.round(S.coop.you*0.5)+(S.coop.open?400:0))*mult);
}
function gradeOf(sc){
  if(sc>=2000) return ['A','Born & Raised Islander','You read the boat like the tide. The General Store regulars nod at you now.'];
  if(sc>=1650) return ['B','Ferry-Hardened','You’ve got a cooler in the trunk and the schedule memorized. Mostly.'];
  if(sc>=1300) return ['C','Still Figuring It Out','You survived. The ferry won a few rounds.'];
  if(sc>=900) return ['D','Considering Lakewood Apartments','You’ve started browsing mainland rentals “just to look.”'];
  return ['F','Moving Back to the Mainland','The island is beautiful. You’ll visit. On a Tuesday. Not a Friday.'];
}
function finish(){clearTiles();S.over=true;endScreen(S.mode==='month'?'{{name}}, you made it through the month':'{{name}}, you made it to Sunday night',S.mode==='month'?`Four weeks of island life in ${SEA().month}.${S.coop.open?' And the island has a store again.':''}`:`You survived a week of island life in ${SEA().month}.`)} // season
function gameOver(why){S.over=true;MQ=[];tileQ=[];document.querySelectorAll('#tiles .tile').forEach(t=>t.remove());document.querySelectorAll('.modal-bg').forEach(e=>e.remove());
  const T={health:['Medevac off the island','Your health gave out. The fire department calls for the medevac helicopter.'],fired:['You’re fired','Your boss has run out of patience with “the ferry broke down again.”'],convicted:['Second arrest','Your second drug arrest. You won’t be going home to the island for a long time.'],banned:['Barred from the ferry','Second gas-can violation. You’re barred from riding the Pierce County ferry. On an island with no bridge, that’s checkmate.']}[why];
  endScreen(T[0],T[1],true)}
function endScreen(h1,sub,lost){
  achCheck({end:true,lost});const achNew=(S.achGame||[]).map(id=>ACH.find(a=>a.id===id)).filter(Boolean);
  const sc=scoreOf(),g=lost?['F',h1,sub]:gradeOf(sc),s=S.stats;
  saveGame();let best=null;const ls=store();try{best=ls?Number(ls.getItem(BEST_KEY)||'NaN'):NaN;if(!lost&&(isNaN(best)||sc>best)){ls&&ls.setItem(BEST_KEY,String(sc));best=isNaN(best)?null:best;var newBest=true}}catch(e){}
  // season: the end screen has a Season row; the title Continue button and save slots show the season
  app.innerHTML=withName(`<div class="end"><div style="display:flex;justify-content:space-between;align-items:center"><div class="small-note" style="color:var(--mute)">${lost?'GAME OVER':'WEEK COMPLETE'} · {{name}}</div><button class="gear" style="background:var(--sand);color:var(--ink)" onclick="openSettings()" aria-label="Settings">⚙️</button></div><h1>${h1}</h1><p>${sub}</p>
  <div style="display:flex;gap:16px;align-items:center;margin:16px 0"><div class="grade">${g[0]}</div><div><b style="font-family:Fraunces;font-size:20px">${g[1]}</b><div style="color:var(--mute);font-size:14px">${g[2]}</div></div></div>
  <div class="kv"><span>Difficulty</span><b>${DF().ic} ${DF().n}</b></div>
  <div class="kv season-end"><span>Season</span><b>${seasonBadge(S)} · ${seasonYear(seasonId())}${S.stats.pipes?` · 🧊 ${S.stats.pipes} burst pipe${S.stats.pipes>1?'s':''}`:''}${S.stats.veg?` · 🥒 ${S.stats.veg} garden harvest${S.stats.veg>1?'s':''}`:''}</b></div>
  <div class="kv"><span>Score</span><b>${sc}${typeof newBest!=='undefined'&&newBest?' 🏆 new best':''}</b></div>${best!=null&&!isNaN(best)?`<div class="kv"><span>Previous best</span><b>${best}</b></div>`:''}
  <div class="kv ach-end"><span>🏆 Achievements this game</span><b style="text-align:right">${achNew.length?achNew.map(a=>a.ic+' '+a.n).join(', '):'none new'}</b></div>
  <div class="kv"><span>Cash left</span><b style="${S.money<0?'color:#ff8a70':''}">${S.money<0?'−':''}$${Math.abs(Math.round(S.money))}</b></div>
  <div class="kv"><span>Health / Job / Stress</span><b>${S.health} / ${S.job} / ${S.stress}</b></div>
  <div class="kv"><span>🏠 Home condition</span><b>${S.home} (${homeScore()>=0?'+':'−'}${Math.abs(homeScore())} pts)</b></div>
  <div class="kv"><span>Workdays completed</span><b>${S.stats.workdays||0}</b></div>
  <div class="kv"><span>Job at the end</span><b>${S.emp?JOBS[S.emp].n:'Unemployed'}${S.stats.firings?` (fired ${S.stats.firings}×)`:''}</b></div>
  <div class="kv"><span>Co-op pledges</span><b>${$(S.coop.you)}${S.coop.open?' · 🎉 the co-op opened!':''}</b></div>
  <div class="kv"><span>Doctor’s appointment</span><b>${S.appt?'Made it':'Missed'}</b></div>
  <div class="kv"><span>Ferry crossings</span><b>${s.crossings}</b></div>
  <div class="kv"><span>Hours spent waiting for the boat</span><b>${(s.waited/60).toFixed(1)}</b></div>
  <div class="kv"><span>Times the boat was full</span><b>${s.bumps}</b></div>
  <div class="kv"><span>Nights stranded</span><b>${s.stranded}</b></div>
  <div class="kv"><span>Spent on fares</span><b>${$(s.fares)}</b></div>
  <div class="kv"><span>Gallons bought from Dale</span><b>${s.daleGal}</b></div>
  <div class="kv"><span>Gallons you smuggled / citations</span><b>${s.smuggled} / ${S.citations}</b></div>
  <div class="kv"><span>Nights without power</span><b>${s.outageNights}</b></div>
  <div class="kv"><span>Island friends made</span><b>${Object.keys(S.friends).length?Object.values(S.friends).map(f=>f.name.split(',')[0].split(' from')[0]).join(', '):'none'}</b></div>
  ${S.bingo.comped?`<div class="kv"><span>Comped by the Riv</span><b>${$(S.bingo.comped)}</b></div>`:''}
  <div class="kv"><span>Bingo nights / winnings</span><b>${S.bingo.nights} / ${$(S.bingo.won)}</b></div>${S.bingo.nights?`<div class="kv"><span>Your bingo money that went to the ${BINGO_FOR[S.week.bingo]}</span><b>${$(S.bingo.donated)}</b></div>`:''}
  <div class="kv"><span>Trading: bought / sold</span><b>${$(s.bought)} / ${$(s.sold)}</b></div>
  <div class="kv"><span>Drug runs / arrests</span><b>${s.drugRuns} / ${s.arrests}</b></div>
  <div class="kv"><span>Ferry outages this week</span><b>${S.week.b.filter(b=>b.start<S.t).length}</b></div>
  <button class="big" style="width:100%;margin-top:22px" onclick="startNewWeek()">Play another week</button><button class="act" style="margin-top:10px;justify-content:center" onclick="titleScreen()"><span class="tx" style="text-align:center"><b>Back to title</b></span></button></div>`);
  window.scrollTo(0,0);
}

// Kept per device under their own key, separate from saves: they survive new games, deleted slots and finished weeks.
const ACH_KEY='islandtime.achievements';
const ACH=[
  {id:'never_stranded',ic:'⛴️',n:'Never stranded',d:'Finish a game without a single night stuck on the mainland.',t:c=>c.end&&!c.lost&&S.stats.stranded===0},
  {id:'punctual',ic:'⏰',n:'Clocked in on time',d:'Get to work on time five days in one week.',t:()=>Object.keys(S.worked||{}).filter(i=>S.worked[i]&&!(S.late||{})[i]).length>=5},
  {id:'chimney',ic:'🏚️',n:'Clean flue',d:'Sweep the chimney before it reaches 21 days of creosote.',t:null},
  {id:'well_kept',ic:'🏡',n:'Well-kept home',d:'Finish a game with your home condition at 75 or better.',t:c=>c.end&&!c.lost&&S.home>=75},
  {id:'month',ic:'🗓️',n:'A month on the island',d:'Make it through a whole month (4 weeks).',t:c=>c.end&&!c.lost&&S.mode==='month'},
  {id:'coop',ic:'🛒',n:'Co-op founder',d:'Help the island raise enough to open the co-op store.',t:()=>!!S.coop.open},
  {id:'bingo',ic:'🎱',n:'Bingo!',d:'Win money at American Legion bingo night.',t:()=>S.bingo.won>0},
  {id:'close_friend',ic:'🤝',n:'Close friend',d:'Become close friends (level 3) with someone on the island.',t:()=>Object.values(S.friends||{}).some(f=>(f.lvl||1)>=3)},
  {id:'ferry_hell',ic:'🔥',n:'Ferry Hell survivor',d:'Finish a game on Ferry Hell difficulty.',t:c=>c.end&&!c.lost&&S.diff==='hard'},
  {id:'generator',ic:'🔌',n:'The lights stay on',d:'Have your generator carry the house through a power outage.',t:()=>S.ev.history.some(h=>h.id==='gen_saves')||(S.ev.past||[]).some(h=>h.id==='gen_saves')},
  {id:'ankle',ic:'🩹',n:'Back on your feet',d:'Get a hurt ankle treated.',t:()=>!!(S.injury&&S.injury.treated)},
  {id:'supplier',ic:'🥫',n:'Island supplier',d:'Sell food or medical supplies to neighbors on the island.',t:null},
  {id:'fred',ic:'🩴',n:'Pajama Fred’s friend',d:'Make friends with Pajama Fred.',t:()=>!!S.friends.fred},
  {id:'terminal',ic:'🪑',n:'A night at the ferry dock',d:'Spend a stranded night at the Steilacoom ferry landing.',t:c=>c.where==='terminal'},
  {id:'pantry',ic:'🧺',n:'Fully stocked',d:'Have a week of food (7 days or more) in the pantry.',t:()=>S.pantry>=7},
  {id:'zen',ic:'🧘',n:'Island calm',d:'Bring your stress all the way down to 0.',t:()=>S.stress<=0},
  // phone apps (19-apps-travel.js, 20-apps-money.js): counters live in S.stats, so they're per game
  {id:'commuter_pro',ic:'🎟️',n:'Commuter pro',d:'Ride the ferry 10 times on ⛴️ Ferry Pass tickets in one game.',t:()=>(S.stats.fpRides||0)>=10},
  {id:'autopay',ic:'💳',n:'Never late on a bill',d:'Finish a month with 💳 autopay on since the first week and not one late bill.',
    t:c=>{const I=S.ph&&S.ph.icu;return c.end&&!c.lost&&S.mode==='month'&&!!I&&I.auto&&(I.since??0)<=6&&phoneInstalled('bank')&&!(S.stats.lateBills>0)}},
  {id:'gig_economy',ic:'💼',n:'Gig economy',d:'Earn $100 from 💼 Gig Work tasks in one game.',t:()=>(S.stats.gigPay||0)>=100},
  {id:'weather_wise',ic:'🌦️',n:'Weather-wise',d:'Spend a gale or a hard freeze at home after 🌦️ Tides & Weather warned you the evening before.',t:()=>(S.stats.wxWise||0)>0}];
function achGot(){try{const o=JSON.parse(localStorage.getItem(ACH_KEY)||'{}');return o&&typeof o==='object'&&!Array.isArray(o)?o:{}}catch(e){return {}}}
function achCount(){const g=achGot();return ACH.filter(a=>g[a.id]).length}
function achUnlock(id){const a=ACH.find(x=>x.id===id);if(!a)return;const g=achGot();if(g[id])return;
  g[id]={at:new Date().toISOString()};try{localStorage.setItem(ACH_KEY,JSON.stringify(g))}catch(e){}
  if(S){S.achGame=(S.achGame||[]).filter(x=>x!==id).concat(id);if(!S.over)showTile('🏆','Achievement: '+a.n,a.d,'good')}}
function achCheck(c){if(!S)return;c=c||{};const g=achGot();
  for(const a of ACH){if(g[a.id]||!a.t)continue;let ok=false;try{ok=!!a.t(c)}catch(e){}if(ok)achUnlock(a.id)}}
function achModal(back){const g=achGot();
  modal(`🏆 Achievements (${achCount()}/${ACH.length})`,`<p style="font-size:13px;color:var(--mute)">Saved on this device. They carry over to every new game and save slot.</p>`+ACH.map(a=>{const on=g[a.id];
    return `<div class="ach${on?' on':''}" style="display:flex;gap:10px;align-items:center;padding:8px 10px;margin-bottom:6px;border-radius:10px;border:1.5px solid ${on?'var(--good)':'var(--line)'};background:${on?'#fff':'transparent'}${on?'':';opacity:.55'}"><span style="font-size:24px;width:30px;text-align:center;${on?'':'filter:grayscale(1)'}">${on?a.ic:'🔒'}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14.5px">${a.n}</b><span style="display:block;font-size:12.5px;color:var(--mute)">${on?`Earned ${esc(new Date(on.at).toLocaleDateString())}`:'How: '+a.d}</span></span></div>`}).join(''),
  [{l:back?'Back to settings':'Close',fn:()=>{if(back)back()}}]);
}
window.achModal=achModal;

// ---------------- save slots UI ----------------
function slotInfo(n){const r=rawSave(n);if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));if(d.S.over)return null;const x=d.S,D=DIFFS[x.diff]||DIFFS.normal;
    return {name:x.name||currentName(),diff:`${D.ic} ${D.n} · ${seasonBadge(x)}`,txt:`${x.story?storyWeekTxt(x,true)+' · ':x.mode==='month'?`Week ${(x.weekNo||0)+1} of 4 · `:''}${DAYS[x.cur]} ${fmt(x.t)}`}} // season
  catch(e){return {broken:true,name:'Unreadable save',diff:'',txt:''}}}
const slotLine=i=>i?(i.broken?'Unreadable save':`${esc(i.name)} · ${i.diff} · ${i.txt}`):'Empty';
const SLOTBTN='flex:1;padding:8px 4px;border-radius:10px;font-weight:700;font-size:13px;border:1.5px solid var(--line);background:#fff;color:var(--ink)';
window.slotsModal=()=>{const cur=curSlot();
  modal('💾 Save slots',`<p style="font-size:13px;color:var(--mute)">Keep up to three games going. Continue, a new week, Exit and transfer codes all use the current slot.</p>`+[1,2,3].map(n=>{const i=slotInfo(n);
    return `<div class="slot" style="background:#fff;border:1.5px solid ${n===cur?'var(--buoy)':'var(--line)'};border-radius:12px;padding:10px 12px;margin-bottom:10px"><b>Slot ${n}</b>${n===cur?' <span style="font-size:12px;color:var(--buoy);font-weight:700">· current</span>':''}<div style="font-size:13px;color:var(--mute);margin-top:2px">${slotLine(i)}</div>
    <div style="display:flex;gap:6px;margin-top:8px">${i&&!i.broken?`<button style="${SLOTBTN};background:var(--buoy);color:#fff;border-color:var(--buoy)" onclick="slotAct(${n},'cont')">Continue</button>`:''}<button style="${SLOTBTN}" onclick="slotAct(${n},'new')">Start new here</button>${i?`<button style="${SLOTBTN};color:var(--bad)" onclick="slotAct(${n},'del')">Delete</button>`:''}</div></div>`}).join(''),
  [{l:'Close',fn:()=>{if(!S||S.over||document.querySelector('.title'))titleScreen()}}]);
};
window.slotAct=(n,a)=>{const el=document.getElementById('mbg');el&&el.remove();const i=slotInfo(n);
  if(a==='cont'){setSlot(n);return resumeGame()}
  if(a==='new'){const go=()=>{setSlot(n);titleScreen();startNewWeek()};
    return i?modal(`Start over in slot ${n}?`,`<p>The saved week in slot ${n} (${slotLine(i)}) will be replaced when you start.</p>`,[{l:'Start a new week here',fn:go},{l:'Cancel',fn:()=>slotsModal()}]):go()}
  if(a==='del') modal(`🗑️ Delete slot ${n}?`,`<p>This erases the saved week in slot ${n} (${slotLine(i)}). It can’t be undone.</p>`,[{l:'Delete it',fn:()=>{const ls=store();if(ls)slotKeys(n).forEach(k=>ls.removeItem(k));titleScreen();slotsModal()}},{l:'Cancel',fn:()=>slotsModal()}]);
};
function slotSwitchModal(){const cur=curSlot();
  modal('💾 Save slot',`<p>You’re playing in <b>slot ${cur}</b>. Your week is saved before you switch.</p>`,[
    ...[1,2,3].map(n=>{const i=n===cur?null:slotInfo(n);return {l:`Slot ${n}${n===cur?' (this game)':''}`,s:n===cur?'You’re here.':i&&!i.broken?'Continue: '+slotLine(i):i?'Unreadable save: manage it from the title screen.':'Empty: start a new week here',dis:n===cur||!!(i&&i.broken),
      fn:()=>{saveGame();MQ=[];clearTiles();setSlot(n);if(i)return resumeGame();S=null;titleScreen();startNewWeek()}}}),
    {l:'Back to settings',fn:()=>openSettings()}]);
}

const PHONE_SLOTS=5;

function definePhoneApp(a){const i=PHONE_APPS.findIndex(x=>x.id===a.id);const app=Object.assign({builtin:false,size:'40 MB',order:50,badge:()=>0,desc:''},a);if(i>=0)PHONE_APPS[i]=app;else PHONE_APPS.push(app);PHONE_APPS.sort((x,y)=>x.order-y.order)}

  say(`📲 Installed <b>${a.name}</b>.${min>1?' One bar of signal on the island: it took '+min+' minutes.':''}`);return true}
function phoneUninstall(id){const P=PH();const i=P.apps.indexOf(id);if(i<0)return false;P.apps.splice(i,1);say(`🗑️ Removed ${phoneApp(id).name} from your phone.`);return true}
function phoneBadgeTotal(){if(!S)return 0;return PHONE_APPS.filter(a=>phoneInstalled(a.id)).reduce((n,a)=>{try{return n+(a.badge()||0)}catch(e){return n}},0)}

// ---- shared rules for Messages and Calls ----

function phoneFriendAvail(id){const m=tod();if(m>=1350||m<390)return 'asleep';const f=S.friends[id];if(!f)return 'none';
  const k=`${id}:${dayKey()}:${Math.floor(m/120)}`;let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;   // stable per 2-hour block
  return (h%100)<(f.lvl>=3?8:f.lvl>=2?15:22)?'busy':'ok'}

function phoneSocial(id,n){const P=PH();P.social=P.social||{};if(P.social[id]===dayKey())return false;P.social[id]=dayKey();friendPts(id,n||1);return true}
// Ask Sam for a ride to the ferry landing (from home, morning). Returns 'yes' | 'no' | 'not-now'.
function phoneAskRide(){const P=PH();if(!S.friends.sam||S.loc!=='home'||tod()>=630)return 'not-now';

// the next ferry outage today or tomorrow (Pajama Fred’s deck-crew perk), including one going on now
function msgNextOutage(){const lim=(day()+2)*1440;return S.week.b.filter(b=>b.end>S.t&&b.start<lim).sort((a,b)=>a.start-b.start)[0]||null}

// when the reply comes: 3–25 min (close friends 2–10), next morning if asleep, later if busy
function msgDelay(id,k){const av=phoneFriendAvail(id),m=tod();

  return d}

function msgSend(id,k,text){if(!phoneCan()||!S.friends[id])return;const M=MSG();phoneUse(1);msgPush(id,1,text);
  if(M.inc[id]===dayKey()){delete M.inc[id];phoneSocial(id,1)}         // answering their text the same day

  if(k==='ride'){it.ride=phoneAskRide();if(it.ride==='not-now')return;if(it.ride==='yes')delete S.ev.flags.samRide}  // the 🤝 option appears when Sam answers
  M.q.push(it)}

  if(c.ring&&S.t>c.ring.until){const r=c.ring;c.ring=null;const vm=Math.random()<0.7&&CALL_VM[r.id];callLog({id:r.id,t:r.t,dir:'missed',seen:false,vm:vm||null,heard:false});
