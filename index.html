<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Island Time: An Anderson Island Ferry Game</title>
<meta name="description" content="Survive a week of island life on Anderson Island, WA: ferry breakdowns, groceries, doctor visits and no gas on the island.">
<meta name="theme-color" content="#12313b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>@font-face{font-family:"Fraunces";src:url("fonts/fraunces-latin-600-normal.woff2") format("woff2");font-weight:600 800;font-style:normal;font-display:swap}</style>
<style>
:root{
  --sound:#1d4b5a; --deep:#12313b; --fir:#2f5d4a; --moss:#6f8f5a; --sand:#f3ecdc; --paper:#fbf8f1;
  --buoy:#e3642e; --ink:#1b2326; --mute:#6b7478; --line:#ddd4c0; --good:#2f7d4f; --bad:#b8402a; --warn:#c98a12;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior:none;margin:0;background:var(--deep);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
#app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
h1,h2,h3{font-family:"Fraunces",Georgia,serif;margin:0}
button{font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.ghost{background:rgba(255,255,255,.12);color:#fff;border:1.5px solid rgba(255,255,255,.35);border-radius:14px;padding:13px;font-weight:700;font-size:16px}
.hint{font-size:13px;background:rgba(255,255,255,.1);border-radius:10px;padding:10px 12px;line-height:1.45}
/* title */
.title{flex:1;display:flex;flex-direction:column;background:linear-gradient(#1d4b5a,#12313b);color:#fff}
.title .art{height:250px}
.title .body{padding:18px 22px 28px;display:flex;flex-direction:column;gap:14px}
.title h1{font-size:40px;line-height:1;letter-spacing:-.5px}
.title h1 span{display:block;font-size:17px;font-family:"DM Sans";font-weight:500;letter-spacing:.3px;opacity:.85;margin-top:8px}
.title p{margin:0;line-height:1.5;opacity:.92;font-size:15px}
.title ul{margin:0;padding-left:18px;line-height:1.55;font-size:14.5px;opacity:.92}
.big{background:var(--buoy);color:#fff;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:18px;box-shadow:0 4px 0 #a9441b}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #a9441b}
.small-note{font-size:12px;opacity:.7}
/* hud */
.hud{background:var(--deep);color:#fff;padding:10px 14px 10px;position:sticky;top:0;z-index:5}
.hud-top{display:flex;justify-content:space-between;align-items:baseline}
.hud-day{font-family:"Fraunces";font-size:20px;font-weight:800}
.hud-time{white-space:nowrap;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.hud-sub{font-size:12px;opacity:.75;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.stat b{overflow-wrap:anywhere}
html.fs-xl .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:360px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.stat{background:rgba(255,255,255,.08);border-radius:9px;padding:5px 4px 6px;text-align:center}
.stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
.stat small{font-size:10px;opacity:.75;text-transform:uppercase;letter-spacing:.5px}
.meter{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:4px;overflow:hidden}
.meter i{display:block;height:100%}
/* scene */
.scene{position:relative;height:170px;overflow:hidden}
.scene svg{display:block;width:100%;height:100%}
.place{position:absolute;left:12px;bottom:10px;background:rgba(251,248,241,.94);border-radius:10px;padding:6px 10px;max-width:80%}
.place h2{font-size:18px}
.place div{font-size:12px;color:var(--mute)}
.alertbar{background:var(--bad);color:#fff;font-size:13px;padding:8px 14px;font-weight:500}
.alertbar.fog{background:#6c7a80}
/* content */
.content{flex:1;padding:12px 14px 90px}
.narr{background:var(--sand);border-left:4px solid var(--fir);border-radius:8px;padding:10px 12px;font-size:14.5px;line-height:1.45;margin-bottom:12px}
.narr p{margin:0 0 6px}.narr p:last-child{margin:0}
.sect{font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);margin:14px 2px 6px;font-weight:700}
.act{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;color:var(--ink)}
.act:active{background:var(--sand)}
.act .ic{font-size:22px;width:30px;text-align:center;flex:none}
.act .tx{flex:1;min-width:0}
.act .tx b{display:block;font-weight:700;font-size:15px}
.act .tx span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
.act.primary{border-color:var(--fir);background:#eef4ee}
.act.danger{border-color:#e2b3a7}
.act[disabled]{opacity:.45}
.dest{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.dest .dn{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dest .dn b{font-size:15px}.dest .dn span{font-size:11.5px;color:var(--mute);text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1.5px solid var(--fir);color:var(--fir);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:700}
.chip:active{background:#e3eee5}
.chip[disabled]{border-color:var(--line);color:#aaa}
/* tabs */
.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:6}
.tabs button{background:none;border:0;padding:9px 0 10px;font-size:11px;color:var(--mute);font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .ti{font-size:20px}
.tabs button.on{color:var(--sound)}
.tabs .dot{display:inline-block;width:7px;height:7px;background:var(--bad);border-radius:50%;margin-left:3px;vertical-align:top}
/* market */
.mkt{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow .ic{font-size:22px;width:28px;text-align:center}
.mrow .mi{flex:1;min-width:0}.mrow .mi b{font-size:14.5px;display:block}
.mrow .mi span{font-size:12px;color:var(--mute)}
.mrow .px{font-size:11.5px;color:var(--mute);margin-top:2px;font-variant-numeric:tabular-nums}
.mrow .px b{display:inline;color:var(--ink);font-size:12.5px}
.mbtns{display:flex;gap:6px;align-items:center}
.mbtns button{border:1.5px solid var(--fir);background:#fff;color:var(--fir);border-radius:9px;font-weight:700;font-size:13px;padding:7px 9px;min-width:44px}
.mbtns button.buy{background:var(--fir);color:#fff}
.mbtns button[disabled]{opacity:.35}
.mbtns .own{font-weight:700;font-size:14px;min-width:18px;text-align:center;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:4px;vertical-align:1px;text-transform:uppercase;letter-spacing:.3px}
.badge.ok{background:#dcefe2;color:var(--good)}.badge.lim{background:#f8ecd0;color:#8a5d00}.badge.no{background:#f6ddd5;color:var(--bad)}
.news{font-size:13px;background:#eef1f2;border-radius:10px;padding:8px 11px;margin-bottom:8px;line-height:1.4}
/* ferry board */
.board{background:#0f2a32;color:#f4d27a;border-radius:12px;padding:12px;font-variant-numeric:tabular-nums}
.board h3{color:#fff;font-size:16px;margin-bottom:2px}
.board .cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.board .colh{font-size:11px;color:#9fc0c8;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.row{display:flex;justify-content:space-between;font-size:13.5px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.08)}
.row.past{opacity:.3}.row.next{color:#fff;font-weight:700}
.row .st{font-size:11px}
.st.ok{color:#8fd19e}.st.x{color:#ff8a70}.st.d{color:#f4d27a}.st.p{color:#9fc0c8}
.rules{font-size:13px;line-height:1.5;color:var(--ink);background:var(--sand);border-radius:10px;padding:10px 12px;margin-top:12px}
.rules p{margin:0 0 6px}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo .ck{font-size:20px;width:26px;flex:none;text-align:center}
.todo b{display:block;font-size:15px}.todo span{font-size:12.5px;color:var(--mute)}
.todo .pin{margin-left:auto;flex:none;border:1px solid var(--line);background:none;border-radius:8px;padding:4px 7px;font-size:13px;color:var(--mute);cursor:pointer}
.prio{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prio .rk{flex:none;width:24px;height:24px;border-radius:50%;background:var(--ink,#2a3d45);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.prio.done .rk{background:var(--line);color:var(--mute)}
.prio .pt{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere;cursor:pointer}
.prio.done .pt{text-decoration:line-through;color:var(--mute)}
.prio .pb{display:flex;gap:4px;flex:none}
.prio .pb button,.prio-add button{border:1px solid var(--line);background:none;border-radius:8px;min-width:32px;height:32px;font-size:14px;cursor:pointer;color:inherit}
.prio .pb button:disabled{opacity:.3;cursor:default}
.prio-add{display:flex;gap:6px;margin:8px 0 2px}
.prio-add input{flex:1;min-width:0;font:inherit;font-size:15px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:inherit}
.prio-add button{padding:0 12px;font-weight:700}
.prio-empty{font-size:13px;color:var(--mute);padding:6px 2px}
.log p{margin:0;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.4}
.log p em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums;margin-right:6px;font-size:12px}
/* event acknowledgement tiles */
#tiles{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px);width:calc(100% - 20px);max-width:460px;z-index:60;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.tile{pointer-events:auto;display:flex;align-items:center;gap:11px;background:#fffdf8;border-radius:14px;padding:10px 10px 10px 12px;box-shadow:0 8px 24px rgba(8,25,30,.28),0 1px 0 rgba(0,0,0,.05);border-left:6px solid #6b7478;animation:tileIn .32s cubic-bezier(.2,.9,.3,1.2)}
.tile.good{border-left-color:var(--good)}.tile.bad{border-left-color:var(--bad)}.tile.info{border-left-color:var(--sound)}.tile.warn{border-left-color:var(--warn)}
.tile .ti{font-size:26px;width:32px;text-align:center;flex:none}
.tile .tt{flex:1;min-width:0}
.tile .tt small{display:block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--mute)}
.tile .tt b{display:block;font-size:15px;line-height:1.25}
.tile .tt span{display:block;font-size:12px;color:var(--mute);margin-top:1px}
.tile .ok{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:17px;color:var(--fir);font-weight:700}
.tile.out{animation:tileOut .25s ease-in forwards}
@keyframes tileIn{from{transform:translateY(-16px) scale(.96);opacity:0}}
@keyframes tileOut{to{transform:translateY(-12px);opacity:0;height:0;margin:0;padding-top:0;padding-bottom:0}}
.chip.almc.on{background:var(--fir);color:#fff}
.gear{background:rgba(255,255,255,.12);border:0;border-radius:10px;width:38px;height:38px;font-size:19px;color:#fff;flex:none}
.title{position:relative}.tgear{position:absolute;top:calc(env(safe-area-inset-top) + 12px);right:12px;background:rgba(18,49,59,.55);border:0;border-radius:12px;width:44px;height:44px;font-size:21px;z-index:2}
.nm-in{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:#fff}
.nm-in:focus{outline:2px solid var(--fir);border-color:var(--fir)}
/* grouped actions, collapsible destinations, tips, planner */
details.go{margin-top:14px}
.upk-n{color:#c2562a;letter-spacing:.5px}
.act.due{border-left:5px solid #e3642e}.act.due b::after{content:' · due';color:#c2562a;font-size:12px;font-weight:700}html.hc .upk-n{color:#a33}
details.go>summary{list-style:none;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--mute);font-weight:700;padding:8px 2px;display:flex;justify-content:space-between}
details.go>summary::-webkit-details-marker{display:none}
details.go>summary::after{content:'▸ show';letter-spacing:.3px;text-transform:none}
details.go[open]>summary::after{content:'▾ hide'}
.dest.compact{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px}
.dest.compact .dn{flex:1 1 150px;display:block}
.dest.compact .dn span{display:block;text-align:left}
.dest.compact .chips{margin-top:0}
.tip{background:#fff5d6;border:1.5px solid #e6c97a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px;line-height:1.45}
.tip .tb{display:flex;gap:8px;margin-top:8px}
.tip button{border:1.5px solid #c9a24a;background:#fff;border-radius:9px;padding:6px 10px;font-weight:700;font-size:13px;color:#6b4e0e}
.plan{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.plan h3{font-size:16px;margin-bottom:6px}
.plan select{font:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1.5px solid var(--line);background:#fff;max-width:100%}
.plan .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;font-size:14px}
.plan .res{background:var(--sand);border-radius:10px;padding:9px 11px;font-size:14px;line-height:1.55}
.plan .res b{font-variant-numeric:tabular-nums}
.plan .warn{color:#8a5d00}.plan .bad{color:var(--bad)}.plan .ok2{color:var(--good)}
/* accessibility */
html.fs-l{zoom:1.12}html.fs-xl{zoom:1.25}
html.hc{--mute:#2b3336;--line:#7d7462;--paper:#ffffff;--sand:#efe5cc}
html.hc .hud-sub,html.hc .stat small{opacity:1}html.hc .act,html.hc .dest{border-width:2px}
html.rm *,html.rm *::before,html.rm *::after{animation:none!important;transition:none!important}
.today{background:#eef3f4;border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13.5px;line-height:1.55}
.today b{display:block;font-family:Fraunces;font-size:15px;margin-bottom:2px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,25,30,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{font-size:22px;margin-bottom:8px}
.modal .mb{font-size:15px;line-height:1.5;margin-bottom:14px}
.modal .mb p{margin:0 0 8px}
.modal .act{margin-bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--sand);color:var(--ink);margin:0 4px 4px 0}
.tag.bad{background:#f6ddd5;color:var(--bad)}.tag.good{background:#dcefe2;color:var(--good)}
/* crossing */
.cross{position:fixed;inset:0;z-index:30;background:#12313b;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
.cross svg{width:100%;max-width:480px;height:260px}
.cross .cap{font-family:"Fraunces";font-size:22px;margin-top:6px;text-align:center;padding:0 20px}
.cross .cap2{font-size:13px;opacity:.75;margin-top:6px}
.boat{animation:sail 2.6s ease-in-out forwards}
@keyframes sail{from{transform:translateX(0)}to{transform:translateX(300px)}}
.boat.rev{animation-name:sailrev}
@keyframes sailrev{from{transform:translateX(300px)}to{transform:translateX(0)}}
.bob{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(3px)}}
/* end */
.end{padding:22px 18px 40px}
.end h1{font-size:30px;margin:6px 0 4px}
.grade{font-family:"Fraunces";font-size:58px;font-weight:800;color:var(--buoy);line-height:1}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
</style>
</head>

function audio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function tone(f,dur,type,vol,when,slide){const a=audio();if(!a)return;const t=a.currentTime+(when||0);const o=a.createOscillator(),g=a.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.1,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+0.05)}
function sfx(n){if(!prefs().sound)return;try{
  if(n==='horn'){tone(110,1.5,'triangle',0.16);tone(138.6,1.5,'triangle',0.12);tone(220,1.5,'sine',0.04)}
  else if(n==='good'){tone(784,0.18,'sine',0.09);tone(1175,0.28,'sine',0.07,0.12)}
  else if(n==='bad'){tone(233,0.22,'triangle',0.12);tone(175,0.35,'triangle',0.1,0.15)}
  else if(n==='info'){tone(660,0.16,'sine',0.06)}
  else if(n==='ball'){[0,0.09,0.18].forEach(w=>tone(1400,0.04,'square',0.025,w))}
  else if(n==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,0.28,'sine',0.09,i*0.1))}
  else if(n==='tap'){tone(520,0.05,'sine',0.03)}
}catch(e){}}

function genWeek(diffKey){
  const b=[];const r=Math.random;const D=DIFFS[diffKey||(S&&S.diff)||'normal']||DIFFS.normal;
  for(let k=0;k<(D.major2&&r()<D.major2?2:1);k++) if(r()<D.major){const day=1+Math.floor(r()*4);const start=day*1440+Math.floor((7+r()*11)*60);
    const durs=[300,480,900,1500,2200];b.push({start,end:start+durs[Math.floor(r()*durs.length)],cause:CAUSES[Math.floor(r()*CAUSES.length)]});}
  for(let d=0;d<7;d++){ if(r()<D.minor){const start=d*1440+Math.floor((d===0?10:6)*60+r()*10*60);
      if(!b.some(x=>start<x.end+120&&start>x.start-240)) b.push({start,end:start+90+Math.floor(r()*150),cause:CAUSES[Math.floor(r()*CAUSES.length)]});}}
  const fog=[];for(let d=0;d<7;d++) fog.push(r()<D.fog?10+Math.floor(r()*20):0);
  const px=[],news=[];for(let d=0;d<7;d++){const o={};for(const g in GOODS)o[g]={M:0.85+r()*0.3,I:0.8+r()*0.4};px.push(o);news.push(r()<(d===0?0:0.55)?Math.floor(r()*NEWS.length):-1)}
  let storm=null;
  if(r()<D.storm){const sd=1+Math.floor(r()*5);const st=sd*1440+Math.floor((15+r()*4)*60);storm={day:sd,start:st,end:st+(r()<0.5?960:2280)};
    const ws=st+20;if(!b.some(x=>ws<x.end&&ws+200>x.start)) b.push({start:ws,end:ws+120+Math.floor(r()*120),cause:'high winds (gale warning)'});}
  return {b,fog,storm,px,news,bingo:Math.floor(r()*BINGO_FOR.length)};
}

// ---------------- ferry engine ----------------
function sailing(side,d,dep,mode,knownOnly){
  const abs=d*1440+dep;
  if(d===0&&FUEL_CANCEL[side].includes(dep)) return {abs,dep,d,cancel:true,reason:'Monday fuel run (hazmat: crew & tanker driver only)',known:true};
  for(const b of S.week.b){
    if(knownOnly&&b.start>S.t) continue;
    if(abs>=b.start&&abs<b.end){
      if(b.end-b.start>=1200&&abs>=b.start+960) return {abs,dep,d,passenger:true,delay:0,reason:'Passenger-only backup boat'};
      return {abs,dep,d,cancel:true,reason:b.cause,b};
    }
  }
  const delay=dep<660?S.week.fog[d]||0:0;
  return {abs,dep,d,delay,ketron:KETRON[side].includes(dep)};
}
function findNext(side,mode,knownOnly){
  const deps=side==='I'?AI_DEPS:ST_DEPS;
  for(let d=day();d<day()+4;d++) for(const dep of deps){
    const s=sailing(side,d,dep,mode,knownOnly);

function activeOutage(){return S.week.b.find(b=>b.start<=S.t&&S.t<b.end)}
function fullProb(side,d,dep){

// ISLAND EVENTS FRAMEWORK (non-ferry life on the island)
// ---------------------------------------------------------------------
// defEvent({id, hook, chance, cond(ctx), run(ctx), priority, cooldown, max})
//   hook      (a hook name, or an array of them)
//             'arrive'    just arrived somewhere (ctx.at, ctx.from; 'ferry' when stepping off the boat)
//             'night'     while going to bed (ctx.where, ctx.notes[] for the night summary)
//             'wake'      start of a day, if you woke up at home
//             'tripStart' before an island trip leaves (can block it with choices)
//             'tripMid'   during an island trip (ctx.add(min), or block and later ctx.finish(extra))
//   chance    number or fn(ctx) -> 0..1, rolled each time the hook runs
//   cond      fn(ctx) -> bool, must be true for the event to fire (even when chained)
//   priority  higher runs first; an event returning {block:true} or {stop:true} ends the hook
//   cooldown  days before it can fire again; max = times per week
// chain(id)   guarantees an event fires the next time its hook runs (if its cond passes):
//             this is how one event sets off others (a power outage -> the alarm doesn't go off).
// =====================================================================

let EV_RUNNING=null;
// Global frequency dial per hook: the chance that a hook call lets ANY event through (one roll per call).
// wake:0.8 means 20% of mornings are event-free; chained events are dropped too. Per-event chances are unchanged.
// Events with noScale:true (announcements like the bingo reminder) are exempt.
const HOOK_SCALE={wake:0.8};
const EV=[];
function defEvent(e){EV.push(Object.assign({chance:0,priority:0,cooldown:0,max:99},e))}

  const list=EV.filter(e=>e.hook===hook||(Array.isArray(e.hook)&&e.hook.includes(hook))).sort((a,b)=>b.priority-a.priority);
  for(const e of list){
    const forced=S.ev.force.includes(e.id);
    if(e.cond&&!e.cond(ctx)) continue;
    if(!open&&!e.noScale){if(forced)S.ev.force=S.ev.force.filter(x=>x!==e.id);continue}
    if(!forced){
      if((S.ev.count[e.id]||0)>=e.max) continue;
      if(S.ev.last[e.id]!=null&&day()-S.ev.last[e.id]<e.cooldown) continue;
      const p=(typeof e.chance==='function'?e.chance(ctx):e.chance)*homeEventMul(e.id);
      if(!(Math.random()<p)) continue;
    } else S.ev.force=S.ev.force.filter(x=>x!==e.id);
    S.ev.last[e.id]=day();S.ev.count[e.id]=(S.ev.count[e.id]||0)+1;S.ev.history.push({id:e.id,t:S.t});
    const nBefore=uiNarr.length,mBefore=MQ.length+(document.getElementById('mbg')?1:0);
    EV_RUNNING=e.id;let r;try{r=e.run(ctx)||{}}finally{EV_RUNNING=null}

// ---- Pajama Fred (hooks 'arrive' + 'bingo') ----
// A friendly island fixture in flannel pajama pants and slippers, whatever the weather. Knows everything about the boat.
const FRED_SPOTS={aiDock:'In the ferry line',store:'By the bulletin board outside the old store',food:'Out front of the Riv'};
function fredTip(){
  const soon=S.week.b.find(b=>b.start>S.t&&b.start<S.t+1440);
  if(soon&&(flv('fred')>=2||Math.random()<0.8)) return say(`🩴 Fred leans in: “Buddy of mine on the deck crew says there’s a ${soon.cause.split(' (')[0]} problem brewing. If I were you, I’d catch an early boat ${Math.floor(soon.start/1440)===day()?'today':'tomorrow'}.”`);
  say('🩴 Fred: “'+pick(['The 5:50 out of Steilacoom is never full. Nobody wants to be up that early.','Friday after three? Forget about driving on. Walk on or don’t go.','When the boat’s down, the fella with the sailboat runs people across. Tip him in diesel.','Sunday night everybody comes home at once. Plan around it.','Fog burns off by eleven. Usually. Mostly.'])+'”');
}
defEvent({id:'pajama_fred',hook:['arrive','bingo'],priority:2,max:3,cooldown:1,
  cond:ctx=>{const m=tod();if(m<360||m>=1320)return false;return ctx.hook==='bingo'?ctx.stage==='between':!!FRED_SPOTS[ctx.at]},
  chance:ctx=>ctx.hook==='bingo'?0.12:(S.friends.fred?0.09:0.06),
  run(ctx){
    const done=()=>{if(ctx.cont)ctx.cont()};
    const where=ctx.hook==='bingo'?'Between games, out on the Riv’s porch':FRED_SPOTS[ctx.at];
    const friend=!!S.friends.fred;
    const btns=[];
    if(S.cigs>0) btns.push({l:'Give him a cigarette',s:`You have ${S.cigs} left.`,fn:()=>{S.cigs--;adj('stress',-2);
      if(!meet('fred','Pajama Fred','you gave him a cigarette'))say('🩴 “You’re a good egg.” Fred tucks it behind his ear for later.');
      fredTip();done()}});
    btns.push({l:S.cigs>0?'“Not today, Fred”':friend?'“Sorry, Fred, I’m out”':'“Sorry, I don’t smoke”',s:S.cigs>0?'Keep the pack for yourself.':friend?'He’s used to it.':'Fair enough.',fn:()=>{
      if(friend||Math.random()<0.25){say('🩴 “No worries, no worries.” He lingers to chat anyway.');fredTip()}
      else say('🩴 “No worries! Have a good one.” He shuffles off in his slippers.');
      done()}});
    btns.push({l:'Give him a couple bucks instead',s:'$2',dis:S.money<2,fn:()=>{money(-2);adj('stress',-2);
      if(Math.random()<0.5&&meet('fred','Pajama Fred','you spotted him a couple bucks'));else say('🩴 “Hey, thanks. Appreciate you.”');
      fredTip();done()}});
    modal('🩴 Pajama Fred',`<p>${where}, a guy in flannel pajama pants, slippers and a rain jacket gives you a little wave. ${friend?'It’s your pal Fred.':'Everybody on the island seems to know him.'}</p><p>“Hey${friend?', {{name}}':''}! You wouldn’t happen to have a cigarette, would you?”</p>`,btns);
    return ctx.hook==='bingo'?{block:true}:{stop:true};
  }});

const FAVORS={

defEvent({id:'favor_ask',hook:'wake',priority:2,max:2,cond:ctx=>atHomeWake(ctx)&&day()<6&&Object.keys(S.friends).some(id=>FAVORS[id]&&!S.quests.some(q=>q.who===id&&!q.done)),chance:0.45,
  run(){
    const ids=Object.keys(S.friends).filter(id=>FAVORS[id]&&!S.quests.some(q=>q.who===id&&!q.done));const id=pick(ids),F=FAVORS[id],who=S.friends[id].name.split(',')[0];
    modal(`🙏 ${who} needs a favor`,`<p>${who} asks if you could ${F.t}. Within the next two days, if you can.</p>`,[
      {l:'Sure, happy to help',s:'Builds the friendship.',fn:()=>{S.quests.push({who:id,step:F.buy?'buy':'go',due:day()+2,done:false});say(`🙏 You told ${who} you’d ${F.t.split(' (')[0]}.`)}},
      {l:'Sorry, not this week',fn:()=>{say(`${who} says no worries. Mostly means it.`)}}]);
  }});
function favorActions(a,loc){
  (S.quests||[]).filter(q=>!q.done).forEach(q=>{const F=FAVORS[q.who],who=S.friends[q.who]?S.friends[q.who].name.split(',')[0]:'a friend';
    if(q.step==='buy'&&loc===F.at) a.push({ic:'🛍️',l:`Buy ${F.item} for ${who}: $${F.buy}`,s:`Favor for ${who}. Due ${DAYS[q.due]}.`,cat:'here',dis:S.money<F.buy,fn:()=>{money(-F.buy);q.step='deliver';S.t+=10;say(`🛍️ Got the ${F.item}. Now get it to ${who}.`);afterAction()}});
    else if(q.step==='deliver'&&loc===F.back) a.push({ic:'🎁',l:F.label,s:`They’ll pay you back $${F.reward}.`,cat:'here',cls:'primary',fn:()=>{q.done=true;money(F.reward);S.t+=10;adj('stress',-3);friendPts(q.who,2);say(`🎁 ${who} is thrilled. “You’re the best.”`);afterAction()}});
    else if(q.step==='go'&&loc===F.at) a.push({ic:'🎁',l:F.label,s:`Favor for ${who}. Due ${DAYS[q.due]}.`,cat:'here',cls:'primary',fn:()=>{q.done=true;S.t+=10;adj('stress',-3);friendPts(q.who,2);say(`🎁 Done. ${who} will be happy.`);afterAction()}});
  });
}

function lifeSlot(a,key,ic,name,from,to,acts){
  if(!lifeToday(key)) return;
  const m=tod();
  if(S.cal[key]===dayKey()) a.push({ic:'✅',l:`${name} ✓`,s:'You were there. People will remember that, or at least your face.',cat:'here',dis:true});
  else if(m<from) a.push({ic,l:`${name}: ${fmt(from)} today`,s:`Come back between ${fmt(from)} and ${fmt(to)}.`,cat:'here',dis:true});
  else if(m<=to) acts.forEach(x=>a.push(Object.assign({cat:'here'},x)));

// friend story arcs: 3 beats each, S.arcs[id] = {b: beats done, k: dayKey of the last beat, h: times you helped}
// beat 1: once you know them (a day later); beat 2: good friend or week 3; beat 3: close friend or week 4. At least 2 days apart, one arc beat a day.
function arcReady(id){
  const A=S.arcs[id],f=S.friends[id];if(!A||!f||A.b>=3) return false;
  if(S.arcs.day===dayKey()||dayKey()-A.k<2) return false;
  if(A.b===0) return f.day!==day()||S.weekNo>0;
  if(A.b===1) return flv(id)>=2||S.weekNo>=2;
  return flv(id)>=3||S.weekNo>=3;
}
function arcBeat(id){const A=S.arcs[id];A.b++;A.k=dayKey();S.arcs.day=dayKey();return A}

function deadBattery(ctx,triedNeighbor){
  const dest=ctx.to,base=dist(ctx.from,dest);S.stats.deadBattery=(S.stats.deadBattery||0)+1;
  const resume=(extra,msg)=>{S.t+=extra;S.battery='weak';if(msg)say(msg);go(dest,Object.assign({},ctx.o,{started:true}))};
  const btns=[];
  if(S.friends.sam) btns.push({l:'Text Sam for a jump',s:'About 10 minutes.',fn:()=>resume(10,'🔋 “Morning, {{name}}.” Sam pulls up in a bathrobe with jumper cables. The Subaru coughs to life.')});
  else if(!triedNeighbor) btns.push({l:'Knock on the new neighbor’s door',s:'You’ve never actually met them.',fn:()=>{
    if(Math.random()<0.65){meet('sam','Sam, your new neighbor','jump-started your car');resume(20,'🔋 The new neighbor, Sam, digs out jumper cables. “Welcome to island cars.”')}
    else{S.t+=12;say('Nobody answers next door. Their car’s gone.');deadBattery(ctx,true);render()}}});
  if(S.friends.walt) btns.push({l:'Call Walt from the Legion',s:'He always has cables. 25 minutes.',fn:()=>resume(25,'🔋 Walt shows up in his Legion cap with a jump pack and a story about 1979.')});
  btns.push({l:`Walk to ${L[dest].name}`,s:`${Math.round(base*4)} min. The car stays here.`,fn:()=>go(dest,{m:'walk',min:Math.round(base*4),started:true})});
  btns.push({l:'Stand by the road and hitch',s:'Maybe.',fn:()=>go(dest,{m:'hitch',min:base+15,started:true})});
  buzz(120);adj('stress',8);
  modal('🔋 Click. Click. Nothing.',`<p>You turn the key and the dash lights flicker. The battery is dead${S.power?' (the cold, dark night didn’t help)':''}.</p><p>There’s no auto parts store, tow truck or jump service on the island.${S.battery==='weak'?' This battery is clearly on its way out. Replace it at the gas station in Steilacoom.':''}</p>`,btns);
}

function bingoCard(){const cols=[];for(let c=0;c<5;c++){const pool=[];for(let n=c*15+1;n<=c*15+15;n++)pool.push(n);const col=[];for(let i=0;i<5;i++)col.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);cols.push(col)}cols[2][2]=0;return cols}
function hasLine(card,called){const m=(c,r)=>card[c][r]===0||called.has(card[c][r]);
  for(let i=0;i<5;i++){let row=true,col=true;for(let j=0;j<5;j++){if(!m(j,i))row=false;if(!m(i,j))col=false}if(row||col)return true}
  let a=true,b=true;for(let i=0;i<5;i++){if(!m(i,i))a=false;if(!m(i,4-i))b=false}return a||b}
function bingoGame(mine,others){
  const balls=[...Array(75)].map((_,i)=>i+1);for(let i=74;i>0;i--){const j=Math.floor(Math.random()*(i+1));[balls[i],balls[j]]=[balls[j],balls[i]]}
  const called=new Set();
  for(const b of balls){called.add(b);const w=mine.filter(c=>hasLine(c,called));const t=others.filter(c=>hasLine(c,called)).length;if(w.length||t)return {called,ball:b,winners:w,others:t}}
}
const ballName=n=>'BINGO'[Math.floor((n-1)/15)]+'-'+n;
function cardHTML(card,called){
  let h='<table style="border-collapse:collapse;margin:6px auto 10px;font-variant-numeric:tabular-nums"><tr>'+[...'BINGO'].map(L=>`<th style="width:42px;height:28px;background:var(--sound);color:#fff;font-family:Fraunces">${L}</th>`).join('')+'</tr>';
  for(let r=0;r<5;r++){h+='<tr>';for(let c=0;c<5;c++){const n=card[c][r],hit=n===0||called.has(n);
    h+=`<td style="width:42px;height:38px;text-align:center;border:1px solid var(--line);font-weight:700;${hit?'background:#e3642e;color:#fff;border-radius:50%':''}">${n===0?'★':n}</td>`}h+='</tr>'}
  return h+'</table>';
}
const BINGO_GAMES=[{n:'Regular',pot:40},{n:'Regular',pot:40},{n:'Early Bird Special',pot:50},{n:'The Big One',pot:100}];
function playBingo(cards,price){
  if(S.friends.walt)friendPts('walt',1);if(S.friends.rusty)friendPts('rusty',1);
  money(-price);S.bingo.nights++;S.bingo.cards+=cards;S.bingo.donated+=Math.round(price*0.5);
  S.t=Math.max(S.t,day()*1440+1080);
  const free=S.friends.walt&&!S.ev.flags.waltCard?1:0;if(free)S.ev.flags.waltCard=1;
  const mine=[...Array(cards+free)].map(bingoCard);const others=[...Array(34)].map(bingoCard);
  const crowd=Math.round(34*12/3+price);
  let gi=0,won=0;
  S.bingo.order=null;S.bingo.delay=0;S.bingo.comped=0;S.bingo.playing=day();

function workActions(a,d,m){
  const J=curJob();if(!J) return;
  if(!J.days.includes(d)){a.push({ic:'🌲',l:'You’re off today',s:`You work ${dayList(J.days)}.`,dis:true});return}
  if(S.worked[d]){a.push({ic:'✅',l:'Shift done for today',s:'Go home. Or shop. Probably shop.',dis:true});return}
  if(m<J.start-120){a.push({ic:'🔒',l:'Not open yet',s:`Your shift starts at ${fmt(J.start)}.`,dis:true});return}
  if(m>=J.start+240){a.push({ic:'🙅',l:'Too late to work today',s:'Your boss already marked you absent.',dis:true});return}
  const lateBy=Math.max(0,m-J.start);
  const lateTxt=lateBy===0?'On time.':lateBy<=30?`${lateBy} min late (job −4)`:`${lateBy} min late (job −10, docked pay)`;
  const pay=lateBy>30?Math.round(J.pay*(1-lateBy/480)):J.pay;
  const start=Math.max(m,J.start),mid=J.start+Math.round((J.end-J.start)*0.6);
  const doShift=(endM,payAmt,jobAdj,msg)=>{S.worked[d]=true;S.late[d]=lateBy;S.stats.workdays=(S.stats.workdays||0)+1;S.t=d*1440+endM;money(payAmt);adj('job',jobAdj+(lateBy===0?3:lateBy<=30?-4:-10));adj('stress',lateBy>0?6:2);say(msg+` +${$(payAmt)}.`);afterAction()};
  a.push({ic:'💼',l:`Work a full shift (until ${fmt(J.end)})`,s:`${J.n}. ${lateTxt} Pay ${$(pay)}.`,cls:'primary',fn:()=>doShift(J.end,pay,0,lateBy?'You slink in late and work through lunch to make up for it.':'You clock in on time. Your coworkers from the mainland have no idea what that took.')});
  if(start<mid&&J.loc!=='food') a.push({ic:'🩺',l:`Work until ${fmt(mid)}, then leave`,s:`Half day. ${d===APPT_DAY&&apptActive()?'For your doctor’s appointment (job −2).':'Boss won’t love it (job −8).'} Pay ${$(Math.round(pay*0.55))}.`,fn:()=>doShift(mid,Math.round(pay*0.55),d===APPT_DAY&&apptActive()?-2:-8,`You leave at ${fmt(mid)} with a mumbled explanation.`)});
}

// ---------------- save / app shell ----------------
const SAVE_KEY='islandtime.save', LEGACY_KEYS=['islandtime.save.v2','islandtime.save.v1'], BEST_KEY='islandtime.best';
let saveNotice='';
function store(){try{return window.localStorage}catch(e){return null}}
function packSave(){return {schema:SAVE_SCHEMA,app:APP_VERSION,S,uiNarr,tab,at:Date.now()}}
// The save is mirrored under the older key names so an older copy of the game (old install, cached phone app) still finds it.
function saveGame(){const ls=store();if(!ls||!S)return;const keys=[SAVE_KEY,...LEGACY_KEYS];
  try{if(S.over)keys.forEach(k=>ls.removeItem(k));else{const v=JSON.stringify(packSave());keys.forEach(k=>{try{ls.setItem(k,v)}catch(e){}})}}catch(e){}}
// Fill in anything an older (or newer) save is missing, without touching what it has.
function fillDefaults(obj,def){
  for(const k in def){
    if(obj[k]===undefined||obj[k]===null&&def[k]!==null&&typeof def[k]==='object'&&!Array.isArray(def[k])) obj[k]=JSON.parse(JSON.stringify(def[k]));
    else if(def[k]&&typeof def[k]==='object'&&!Array.isArray(def[k])&&obj[k]&&typeof obj[k]==='object') fillDefaults(obj[k],def[k]);
  }
  return obj;
}
const num=(v,d)=>typeof v==='number'&&isFinite(v)?v:d;
function migrate(d){
  if(!d||typeof d!=='object'||!d.S||typeof d.S!=='object') throw new Error('not an Island Time save');
  const from=d.schema||(d.S.cargo?2:1), x=d.S, notes=[];
  // v1 (game 1.1): loose gas/diesel cans instead of trade cargo
  if(from<2){
    x.cargo=x.cargo||{food:0,med:0,gas:0,diesel:0,drugs:0};
    if(x.canGal>0){x.cargo.gas+=Math.max(1,Math.round(x.canGal/5));notes.push('your gas can moved into trade cargo')}
    if(x.dieselCans>0){x.cargo.diesel+=Math.max(1,Math.round(x.dieselCans/5));notes.push('your diesel cans moved into trade cargo')}
    delete x.canGal;delete x.dieselCans;
  }
  fillDefaults(x,baseState());
  // 1.4.2 -> 1.4.3: Pajama Mike was renamed Pajama Fred
  if(x.friends&&x.friends.mike){x.friends.fred=Object.assign(x.friends.mike,{name:'Pajama Fred'});delete x.friends.mike}
  if(x.ev){for(const k of ['count','last'])if(x.ev[k]&&x.ev[k].pajama_mike!=null){x.ev[k].pajama_fred=x.ev[k].pajama_mike;delete x.ev[k].pajama_mike}
    if(Array.isArray(x.ev.history))x.ev.history.forEach(h=>{if(h.id==='pajama_mike')h.id='pajama_fred'});
    if(Array.isArray(x.ev.force))x.ev.force=x.ev.force.map(i=>i==='pajama_mike'?'pajama_fred':i)}
  if(Array.isArray(x.log))x.log.forEach(e=>{if(typeof e.s==='string')e.s=e.s.replace(/Pajama Mike/g,'Pajama Fred').replace(/\bMike\b/g,'Fred')});
  if(Array.isArray(d.uiNarr))d.uiNarr=d.uiNarr.map(t=>typeof t==='string'?t.replace(/Pajama Mike/g,'Pajama Fred').replace(/\bMike\b/g,'Fred'):t);
  // core fields must be sane numbers
  x.t=num(x.t,330);x.cur=num(x.cur,Math.floor(x.t/1440));x.cur=Math.max(0,Math.min(6,x.cur));
  for(const k of ['money','pantry','carried','health','stress','job']) x[k]=num(x[k],baseState()[k]);
  if(!L[x.loc]){notes.push('a place from another version doesn’t exist here, so you’re back home');x.loc='home';}
  // cars
  if(!Array.isArray(x.cars)||!x.cars.length) x.cars=baseState().cars;
  if(x.phoneT<x.cur*1440)x.phoneT=x.t;
  // 1.7.0: one alarm {time,type} became two independent alarms
  if(x.alarm&&x.alarm.type){const t=num(x.alarm.time,330),ty=x.alarm.type;x.alarm={plug:{on:ty==='plug',time:t},phone:{on:ty==='phone',time:t}}}
  // before 1.5.0 every player had a generator at home; keep it
  if(from<5&&x.gen==null){x.gen='home';notes.push('you keep the generator you already had at home')}
  for(const id in x.friends){const f=x.friends[id];f.lvl=f.lvl||1;f.pts=f.pts||0}
  x.cars.forEach(c=>{c.tank=num(c.tank,c.diesel?20:c.id==='beat'?12:14);c.fuel=num(c.fuel,Math.min(8,c.tank));c.diesel=!!c.diesel;if(!L[c.loc])c.loc=L[x.loc].side==='I'?'home':'stDock';c.name=c.name||'Car'});
  // cargo: unknown goods from a newer version are kept but ignored
  for(const g in GOODS) x.cargo[g]=Math.max(0,num(x.cargo[g],0));
  // week: regenerate whatever is missing
  if(!DIFFS[x.diff])x.diff='normal';
  const w=x.week&&typeof x.week==='object'?x.week:{}, fresh=genWeek(x.diff);
  if(!Array.isArray(w.b)) w.b=fresh.b;
  if(!Array.isArray(w.fog)) w.fog=fresh.fog;
  if(w.storm===undefined) w.storm=null;
  if(!Array.isArray(w.px)||w.px.length<7) w.px=fresh.px;
  w.px.forEach((o,i)=>{for(const g in GOODS) if(!o[g]) o[g]=fresh.px[i][g]});
  if(!Array.isArray(w.news)) w.news=fresh.news.map((n,i)=>i<x.cur?-1:n);
  if(typeof w.bingo!=='number'||!BINGO_FOR[w.bingo]) w.bingo=fresh.bingo;
  if(!Array.isArray(x.ev.force)) x.ev.force=[];
  w.news=w.news.map(n=>typeof n==='number'&&n<NEWS.length?n:-1);
  x.week=w;
  if(from>SAVE_SCHEMA) notes.push(`this save is from a newer version (${d.app||'unknown'}). Anything this version doesn’t know about is kept but ignored`);
  else if(from<SAVE_SCHEMA) notes.push(`upgraded from an older version${d.app?' ('+d.app+')':''}`);
  return {schema:Math.max(from,SAVE_SCHEMA),app:d.app,S:x,uiNarr:Array.isArray(d.uiNarr)?d.uiNarr:[],tab:['act','ferry','todo','log'].includes(d.tab)?d.tab:'act',at:d.at,notes};
}
function rawSave(){const ls=store();if(!ls)return null;
  let best=null;
  for(const k of [SAVE_KEY,...LEGACY_KEYS]){const v=ls.getItem(k);if(!v)continue;let at=0;try{at=JSON.parse(v).at||0}catch(e){}
    if(!best||at>best.at)best={k,v,at}}
  return best}
function loadSave(){
  const r=rawSave();if(!r)return null;
  try{const d=migrate(JSON.parse(r.v));return d.S.over?null:d}
  catch(e){try{const ls=store();ls.setItem('islandtime.save.broken',r.v);[SAVE_KEY,...LEGACY_KEYS].forEach(k=>ls.removeItem(k))}catch(_){}
    saveNotice='Your saved game couldn’t be read, so it was set aside. Start a new week.';return null}
}
function adopt(d){
  S=d.S;uiNarr=d.uiNarr;tab=d.tab;
  render();
  if(d.notes&&d.notes.length) modal('Save loaded',`<p>Welcome back. Note: ${d.notes.join('; ')}.</p>`,[{l:'Continue',fn:()=>{}}]);
  if(S.t>=day()*1440+1410&&L[S.loc].side==='M') strandedModal();
}
function resumeGame(){const d=loadSave();if(!d)return titleScreen();
  try{adopt(d)}catch(e){saveNotice='That save couldn’t be loaded in this version.';titleScreen()}}
// ---- transfer codes: move a game between the web page, the phone app and Windows
function b64enc(str){return btoa(unescape(encodeURIComponent(str)))}
function b64dec(b){return decodeURIComponent(escape(atob(b)))}
function exportCode(){const d=rawSave();if(!d&&!S)return '';const obj=d?JSON.parse(d.v):packSave();return 'ISLANDTIME:'+b64enc(JSON.stringify(obj))}
window.openTransfer=()=>{
  const code=exportCode();
  modal('Transfer a saved game',`<p>Copy this code to move your week to another device or version (the web page, the phone app, or Windows).</p>
  ${code?`<textarea id="exp" readonly style="width:100%;height:70px;font-size:11px;border-radius:8px;border:1.5px solid var(--line);padding:6px">${code}</textarea>
  <button class="act" style="margin-top:6px" onclick="copyCode()"><span class="tx"><b id="cpl">📋 Copy code</b></span></button>`:'<p><i>No game in progress to export.</i></p>'}
  <p style="margin-top:12px">Or paste a code here to load it. It replaces your current save.</p>
  <textarea id="imp" oninput="window.IMPV=this.value" placeholder="ISLANDTIME:…" style="width:100%;height:70px;font-size:12px;border-radius:8px;border:1.5px solid var(--line);padding:6px"></textarea>
  <div id="imperr" style="color:var(--bad);font-size:13px"></div>`,
  [{l:'Load pasted code',fn:importCode},{l:'Close',fn:()=>{if(!S||S.over)titleScreen()}}]);
};
window.copyCode=async()=>{const t=document.getElementById('exp');t.select();try{await navigator.clipboard.writeText(t.value);document.getElementById('cpl').textContent='✅ Copied'}catch(e){document.getElementById('cpl').textContent='Selected: press Ctrl+C / Copy'}};
function importCode(){
  const raw=(window.IMPV||document.getElementById('imp')?.value||'').trim();window.IMPV='';
  try{
    const body=raw.replace(/^ISLANDTIME:/,'').replace(/\s+/g,'');
    const d=migrate(JSON.parse(b64dec(body)));

  saveGame();let best=null;const ls=store();try{best=ls?Number(ls.getItem(BEST_KEY)||'NaN'):NaN;if(!lost&&(isNaN(best)||sc>best)){ls&&ls.setItem(BEST_KEY,String(sc));best=isNaN(best)?null:best;var newBest=true}}catch(e){}
  app.innerHTML=withName(`<div class="end"><div style="display:flex;justify-content:space-between;align-items:center"><div class="small-note" style="color:var(--mute)">${lost?'GAME OVER':'WEEK COMPLETE'} · {{name}}</div><button class="gear" style="background:var(--sand);color:var(--ink)" onclick="openSettings()" aria-label="Settings">⚙️</button></div><h1>${h1}</h1><p>${sub}</p>
  <div style="display:flex;gap:16px;align-items:center;margin:16px 0"><div class="grade">${g[0]}</div><div><b style="font-family:Fraunces;font-size:20px">${g[1]}</b><div style="color:var(--mute);font-size:14px">${g[2]}</div></div></div>
  <div class="kv"><span>Difficulty</span><b>${DF().ic} ${DF().n}</b></div>
  <div class="kv"><span>Score</span><b>${sc}${typeof newBest!=='undefined'&&newBest?' 🏆 new best':''}</b></div>${best!=null&&!isNaN(best)?`<div class="kv"><span>Previous best</span><b>${best}</b></div>`:''}
  <div class="kv"><span>Cash left</span><b style="${S.money<0?'color:#ff8a70':''}">${S.money<0?'−':''}$${Math.abs(Math.round(S.money))}</b></div>
  <div class="kv"><span>Health / Job / Stress</span><b>${S.health} / ${S.job} / ${S.stress}</b></div>
  <div class="kv"><span>🏠 Home condition</span><b>${S.home} (${homeScore()>=0?'+':'−'}${Math.abs(homeScore())} pts)</b></div>
  <div class="kv"><span>Workdays completed</span><b>${S.stats.workdays||0}</b></div>
  <div class="kv"><span>Job at the end</span><b>${S.emp?JOBS[S.emp].n:'Unemployed'}${S.stats.firings?` (fired ${S.stats.firings}×)`:''}</b></div>
  <div class="kv"><span>Co-op pledges</span><b>${$(S.coop.you)}${S.coop.open?' · 🎉 the co-op opened!':''}</b></div>
  <div class="kv"><span>Doctor’s appointment</span><b>${S.appt?'Made it':'Missed'}</b></div>
  <div class="kv"><span>Ferry crossings</span><b>${s.crossings}</b></div>
  <div class="kv"><span>Hours spent waiting for the boat</span><b>${(s.waited/60).toFixed(1)}</b></div>
  <div class="kv"><span>Times the boat was full</span><b>${s.bumps}</b></div>
  <div class="kv"><span>Nights stranded</span><b>${s.stranded}</b></div>
  <div class="kv"><span>Spent on fares</span><b>${$(s.fares)}</b></div>
  <div class="kv"><span>Gallons bought from Dale</span><b>${s.daleGal}</b></div>
  <div class="kv"><span>Gallons you smuggled / citations</span><b>${s.smuggled} / ${S.citations}</b></div>
  <div class="kv"><span>Nights without power</span><b>${s.outageNights}</b></div>
  <div class="kv"><span>Island friends made</span><b>${Object.keys(S.friends).length?Object.values(S.friends).map(f=>f.name.split(',')[0].split(' from')[0]).join(', '):'none'}</b></div>
  ${S.bingo.comped?`<div class="kv"><span>Comped by the Riv</span><b>${$(S.bingo.comped)}</b></div>`:''}
  <div class="kv"><span>Bingo nights / winnings</span><b>${S.bingo.nights} / ${$(S.bingo.won)}</b></div>${S.bingo.nights?`<div class="kv"><span>Your bingo money that went to the ${BINGO_FOR[S.week.bingo]}</span><b>${$(S.bingo.donated)}</b></div>`:''}
  <div class="kv"><span>Trading: bought / sold</span><b>${$(s.bought)} / ${$(s.sold)}</b></div>
  <div class="kv"><span>Drug runs / arrests</span><b>${s.drugRuns} / ${s.arrests}</b></div>
  <div class="kv"><span>Ferry outages this week</span><b>${S.week.b.filter(b=>b.start<S.t).length}</b></div>
  <button class="big" style="width:100%;margin-top:22px" onclick="startNewWeek()">Play another week</button><button class="act" style="margin-top:10px;justify-content:center" onclick="titleScreen()"><span class="tx" style="text-align:center"><b>Back to title</b></span></button></div>`);
  window.scrollTo(0,0);
}

// ---------------- title ----------------

function titleScreen(){clearTiles();
  app.innerHTML=withName(`<div class="title"><button class="tgear" onclick="openSettings()" aria-label="Settings">⚙️</button><div class="art"><svg viewBox="0 0 480 250" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%"><defs><linearGradient id="ts" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fbcc4"/><stop offset="1" stop-color="#e2e6dc"/></linearGradient></defs><rect width="480" height="250" fill="url(#ts)"/><rect y="96" width="480" height="154" fill="#1d4b5a"/>
   <polygon points="250,95 330,25 345,36 356,28 440,95" fill="#e9eef0"/><polygon points="310,43 330,25 345,36 356,28 375,45 355,42 342,48 328,40" fill="#fff"/>
   ${Array.from({length:16},(_,i)=>{const x=i*32-10,h=50+((i*29)%45);return `<polygon points="${x},96 ${x+16},${96-h} ${x+32},96" fill="#2f5d4a"/>`}).join('')}
   <g transform="translate(150,150)"><g class="bob"><rect x="0" y="20" width="170" height="24" rx="4" fill="#f4f1ea"/><rect x="0" y="38" width="170" height="9" fill="#2f5d4a"/><rect x="60" y="2" width="50" height="20" fill="#f4f1ea"/><rect x="65" y="6" width="40" height="7" fill="#2a3d45"/><rect x="80" y="-12" width="9" height="16" fill="#e3642e"/></g></g>
   <path d="M0 210 h480 M0 230 h480" stroke="#fff" stroke-opacity=".1"/></svg></div>
  <div class="body"><h1>Island Time<span>A week of living on Anderson Island, WA</span></h1>
  <p>There’s no bridge. One small county ferry connects your island home to your job, the grocery store, the gas pump and your doctor. This week it has to get you through all of it.</p>
  <ul><li>Work in Lakewood Mon–Fri. Clock in by 9:00.</li><li>Keep food in the pantry. The island’s only store closed this year.</li><li>Keep gas in the car. There’s no gas on the island, and gas cans are banned on the ferry.</li><li>Make your Thursday doctor’s appointment in Tacoma and pick up your prescription.</li><li>Be in the ferry line 20 minutes early. Watch for fog, full boats and breakdowns.</li><li>Trade on the side: import food, medicine and fuel to the island, or take a bigger risk.</li></ul>
  ${(()=>{const d=loadSave();return d?`<button class="big" onclick="resumeGame()">Continue as ${esc(d.S.name||currentName())}: ${DAYS[d.S.cur]} ${fmt(d.S.t)} ⛴️</button><button class="ghost" onclick="startNewWeek()">Start a new week</button>`:`<button class="big" onclick="startNewWeek()">Start Monday ⛴️</button>`})()}
  <button class="ghost" onclick="openTransfer()">🔁 Transfer a saved game</button>
  ${saveNotice?`<div class="hint">⚠️ ${saveNotice}</div>`:''}${exitNotice?`<div class="hint">${exitNotice}</div>`:''}
  <button id="installBtn" class="ghost" style="display:${deferredInstall&&!isStandalone()?'block':'none'}" onclick="doInstall()">📲 Install as an app</button>
  ${!isStandalone()&&isIOS()?'<div class="hint">📲 <b>Play it like an app:</b> tap the Share button in Safari, then <b>Add to Home Screen</b>. It works offline, too.</div>':''}
  <div class="small-note">Version ${APP_VERSION}. Fictionalized for fun. The schedule, prices and people are made up. The store closure and the fuel rules are real as of mid-2026.</div></div></div>`);
  exitNotice='';
}
titleScreen();
</script>
